<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学习打卡">
<title>学习打卡</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f4f4f8">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f4f4f8; --card:#ffffff; --ink:#17171f; --sub:#71718a; --faint:#a3a3b8; --line:#ebebf2;
  --pri:#5b5bd6; --pri2:#8b7cf6; --pri-soft:#efeffd; --ok:#16a36e; --ok-soft:#e6f6ef;
  --warn:#d97a24; --warn-soft:#fdf1e4; --gold:#e8a317; --gold-soft:#fdf5df;
  --shadow:0 1px 2px rgba(23,23,31,.04),0 6px 20px rgba(23,23,31,.05);
  --r:22px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0f14; --card:#1a1a22; --ink:#ededf5; --sub:#9c9cb2; --faint:#62627a; --line:#2a2a36;
  --pri:#8d8df2; --pri2:#a99bff; --pri-soft:#24244a; --ok:#3ccb92; --ok-soft:#14302a;
  --warn:#f0a35a; --warn-soft:#382816; --gold:#f2bd4b; --gold-soft:#3a3016;
  --shadow:none; color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:calc(env(safe-area-inset-top) + 8px) 18px calc(96px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto}
h1{font-size:28px;line-height:1.2;margin:10px 0 2px;letter-spacing:-.02em;font-weight:800}
h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--sub);font-size:14px}
.faint{color:var(--faint);font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;background:var(--card);box-shadow:var(--shadow)}
.btn{white-space:nowrap;flex:none;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-size:15px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow);width:38px;height:38px;border-radius:12px;color:var(--sub);font-size:18px;cursor:pointer}
.sec-title{font-size:13px;font-weight:700;color:var(--faint);letter-spacing:.06em;margin:22px 4px 6px}
/* hero */
.hero{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .num b{font-size:26px;font-weight:800}
.ring .num span{font-size:12px;color:var(--sub)}
.unlock{border-radius:16px;padding:12px 14px;margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--bg)}
.unlock.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.unlock .ic{font-size:26px}
.unlock b{display:block;font-size:15px}
.unlock small{opacity:.8;font-size:13px}
/* week timeline */
.week{display:flex;justify-content:space-between;position:relative;margin-top:16px}
.week:before{content:'';position:absolute;left:24px;right:24px;top:21px;height:3px;border-radius:3px;background:var(--line)}
.week div{position:relative;width:46px;text-align:center;font-size:12px;color:var(--faint);font-weight:600}
.week i{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:16px;background:var(--card);border:2.5px solid var(--line);color:var(--faint)}
.week .full i{background:var(--ok);border-color:var(--ok);color:#fff}
.week .full{color:var(--ok)}
.week .miss i{background:var(--warn-soft);border-color:var(--warn-soft);color:var(--warn)}
.week .today i{border-color:var(--pri);color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
.week .today{color:var(--pri)}
.week .skip i{border-style:dashed}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--bg);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:88px}
.tile b{font-size:15px;line-height:1.35}
.tile span{font-size:12px;color:var(--pri);font-weight:700}
.tile small{font-size:12px;margin-top:-4px}
.tile.cur{background:var(--pri-soft);box-shadow:inset 0 0 0 2px var(--pri)}
a.tile{cursor:pointer}
.sheet .row .btn.block{flex:1;width:auto}
/* tasks */
.task{display:flex;align-items:center;gap:14px;padding:13px 2px;cursor:pointer;user-select:none}
.task+.task{border-top:1px solid var(--line)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:15px;transition:.2s}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.task .lbl{flex:1}
.task.done .lbl{color:var(--faint);text-decoration:line-through}
.task .tm{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.task .pt{font-size:12px;color:var(--gold);font-weight:700}
.mini{display:flex;align-items:center;gap:14px}
.mini .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.pill{display:inline-block;padding:7px 12px;border-radius:12px;margin:4px 6px 0 0;font-size:14px;background:var(--bg);cursor:pointer;user-select:none}
.pill.on{background:var(--ok-soft);color:var(--ok);font-weight:700}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:99px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);
  border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--faint);font:inherit;font-size:11px;font-weight:600;padding:2px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri)}
/* words */
.seg{display:flex;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 0;font:inherit;font-size:14px;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--pri);color:#fff;font-weight:700}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.wrow+.wrow{border-top:1px solid var(--line)}
.wrow .n{width:20px;color:var(--faint);font-size:12px;text-align:right;flex:none}
.wrow .en{flex:1.1;min-width:0}
.wrow .en b{font-size:18px;display:block;word-break:break-word}
.wrow .en span{color:var(--sub);font-size:13px}
.wrow .zh{flex:1;font-size:15px;min-width:0}
.mask{color:transparent!important;background:var(--bg);border-radius:8px}
.say{border:0;background:var(--pri-soft);color:var(--pri);width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.grid button{border:0;border-radius:11px;padding:9px 0;font:inherit;font-size:13px;background:var(--bg);color:var(--sub);cursor:pointer}
.grid button.l{background:var(--ok-soft);color:var(--ok);font-weight:700}
.grid button.r3{background:var(--ok);color:#fff;font-weight:700}
.grid button.cur{outline:2px solid var(--pri)}
/* wenyan */
.kai{font-family:inherit;letter-spacing:.03em}
.wy-title{font-size:30px;color:var(--pri);margin:10px 0 2px;font-weight:800}
.wy-read{font-size:22px;line-height:2.05;text-indent:2em;margin:4px 0}
.wy-read .p{color:var(--faint);font-size:14px;margin:0 3px}
.line{padding:12px 0}
.line+.line{border-top:1px solid var(--line)}
.line .o{font-size:17px;font-weight:700}
.line .t{margin-top:4px;font-size:15px}
.line .k{margin-top:4px;color:var(--sub);font-size:13px}
.audio{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* rewards */
.rw{border-radius:var(--r);padding:20px;margin:14px 0;box-shadow:var(--shadow);background:var(--card)}
.rw.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.rw.on .sub,.rw.on .faint{color:rgba(255,255,255,.8)}
.rw .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.rw.on .btn{background:#fff;color:var(--pri)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--sub)}
.rw.on .tag{background:rgba(255,255,255,.22);color:#fff}
.mile{display:flex;align-items:center;gap:12px;padding:11px 0}
.mile+.mile{border-top:1px solid var(--line)}
/* parent */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:14px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}
.hist{display:flex;align-items:flex-end;gap:3px;height:84px;margin-top:10px}
.hist i{flex:1;background:var(--pri-soft);border-radius:5px 5px 2px 2px;min-height:4px}
.hist i.full{background:var(--ok)}
input,textarea{font:inherit;font-size:16px;padding:11px 13px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
/* sheet & toast */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-10px);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.setbox>summary{list-style:none;cursor:pointer;padding:6px 0}
.setbox>summary::-webkit-details-marker{display:none}
.setbox:not([open])>summary:after{content:' ›'}
.d7{display:flex;justify-content:space-between;margin-top:12px}
.d7 div{text-align:center;font-size:12px;color:var(--faint);width:40px}
.d7 i{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;margin-bottom:4px;font-style:normal;font-size:11px;font-weight:700;color:var(--sub);background:linear-gradient(to top,var(--pri-soft) calc(var(--p)*100%),var(--bg) 0)}
.d7 i.full{background:var(--ok);color:#fff;font-size:15px}
.d7 i.today{box-shadow:inset 0 0 0 2px var(--pri)}
/* 激励 */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.confetti i{position:absolute;width:8px;height:12px;border-radius:2px;animation:pop 1.1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 120px)) rotate(var(--r));opacity:0}}
.floaty{position:fixed;z-index:41;transform:translate(-50%,-50%);font-weight:800;font-size:20px;color:var(--gold);pointer-events:none;animation:floatUp 1s ease-out forwards;text-shadow:0 1px 0 #fff}
@keyframes floatUp{to{transform:translate(-50%,-160%);opacity:0}}
.sheet-bg.center{align-items:center}
.cele{background:var(--card);border-radius:28px;padding:28px 24px 22px;width:min(320px,86vw);text-align:center;animation:zoom .35s cubic-bezier(.2,1.4,.4,1)}
.cele-ic{font-size:64px;line-height:1;margin-bottom:10px;animation:wob 1.2s ease-in-out infinite}
.cele h2{font-size:22px}
@keyframes zoom{from{transform:scale(.6);opacity:0}}
@keyframes wob{50%{transform:scale(1.12) rotate(-6deg)}}
.lvcard{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:var(--r);padding:20px;margin:14px 0;box-shadow:var(--shadow)}
.lvcard .ic{font-size:46px;line-height:1;width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.lvbar{height:10px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:12px}
.lvbar i{display:block;height:100%;background:#fff;border-radius:99px}
.charge{position:relative;height:46px;border-radius:14px;background:var(--bg);overflow:hidden;margin-top:12px}
.charge>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3cc7a0,var(--ok));border-radius:14px;transition:width .6s}
.charge>b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--ink)}
.charge.full>b{color:#fff}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.badge{text-align:center;font-size:11.5px;color:var(--sub);line-height:1.3}
.badge .bi{width:56px;height:56px;margin:0 auto 6px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:var(--gold-soft)}
.badge.off .bi{background:var(--bg);filter:grayscale(1);opacity:.4}
.badge.off{color:var(--faint)}
.badge small{display:block;color:var(--faint);font-size:10.5px}
/* today v2 */
.wk{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);cursor:pointer}
.wk i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;border:2px solid var(--line);color:var(--faint);flex:none}
.wk i.full{background:var(--ok);border-color:var(--ok);color:#fff}
.wk i.miss{background:var(--warn-soft);border-color:var(--warn-soft);color:var(--warn)}
.wk i.today{border-color:var(--pri);color:var(--pri)}
.wk i.skip{border-style:dashed}
.wk span{font-size:12.5px;color:var(--sub);margin-left:2px;line-height:1.3;flex:1;min-width:0}
.grp{padding:4px 18px}
.grp summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px;cursor:pointer;font-weight:700;font-size:14px;color:var(--sub)}
.grp summary::-webkit-details-marker{display:none}
.grp summary:after{content:'›';transform:rotate(90deg);color:var(--faint);margin-left:8px;transition:.2s}
.grp:not([open]) summary{padding-bottom:10px}
.grp:not([open]) summary:after{transform:none}
.grp summary span:first-child{flex:1}
.task .lbl small{display:block;color:var(--faint);font-size:12.5px;margin-top:2px;line-height:1.4}
.task .lbl small .pill{padding:3px 9px;font-size:12px;margin:5px 4px 0 0;background:var(--warn-soft);color:var(--warn);font-weight:700}
.grp .task{gap:12px;margin:0 -10px;padding:12px 10px;border-radius:14px}
.grp .task+.task,.grp .rest+.task,.grp .task+.rest{border-top:0}
.grp .task .tm{width:40px;flex:none;text-align:left;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;font-weight:600}
.grp .task.now{background:var(--pri-soft)}
.grp .task.now .tm{color:var(--pri)}
.grp .task.now .check{border-color:var(--pri)}
.grp .task.cls .check{border-style:dashed}
.grp .task .go{color:var(--faint);font-size:22px;line-height:1;flex:none}
.grp .task.done{opacity:.75}
.rest{display:flex;align-items:center;gap:12px;padding:4px 0;font-size:12.5px;color:var(--faint)}
.rest .tm{width:40px;flex:none;font-variant-numeric:tabular-nums}
.task .tm .no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--sub);font-size:12px;font-weight:700}
.task.now .tm .no{background:var(--pri);color:#fff}
.rest span:last-child{flex:1;border-top:1px dashed var(--line);padding-top:4px;margin-top:4px}
.next{margin-top:8px;font-size:13px;color:var(--sub);cursor:pointer}
.next b{color:var(--pri);font-weight:700}
.link{border:0;background:none;padding:4px 0;font:inherit;font-size:13px;color:var(--faint);cursor:pointer}
.tag.pri{background:var(--pri-soft);color:var(--pri);margin-right:6px}
.tag.cls{background:var(--gold-soft);color:var(--warn);margin-right:6px}
.tag.ok{background:var(--ok-soft);color:var(--ok);margin-right:6px}
[hidden]{display:none!important}

/* ---------- 灵动版（11/19）：渐变总览卡、任务彩色图标、进场动画、打勾弹跳、导航胶囊 ---------- */
.hero-card{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#5b5bd6 0%,#7c6cf3 55%,#a98bff 100%);box-shadow:0 10px 30px rgba(91,91,214,.28)}
.hero-card:before,.hero-card:after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.hero-card:before{width:180px;height:180px;right:-60px;top:-70px;animation:drift 9s ease-in-out infinite}
.hero-card:after{width:110px;height:110px;left:-40px;bottom:-50px;animation:drift 11s ease-in-out infinite reverse}
.hero-card>*{position:relative}
.hero-card h2{color:#fff;font-size:19px}
.hero-card .sub,.hero-card .next{color:rgba(255,255,255,.85)}
.hero-card .next b{color:#fff}
.hero-card .ring circle{stroke:rgba(255,255,255,.22)}
.hero-card .ring circle+circle{stroke:#fff}
.hero-card .ring .num span{color:rgba(255,255,255,.8)}
.hero-card .wk{border-top-color:rgba(255,255,255,.2)}
.hero-card .wk i{border-color:rgba(255,255,255,.45);color:#fff}
.hero-card .wk i.full{background:#fff;border-color:#fff;color:var(--ok)}
.hero-card .wk i.miss{background:rgba(255,255,255,.18);border-color:transparent;color:#ffe2c4}
.hero-card .wk i.today{background:#fff;border-color:#fff;color:#5b5bd6;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.hero-card .wk span{color:rgba(255,255,255,.88)}
.hero-card .btn{background:#fff;color:#5b5bd6}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--c,var(--pri-soft));transition:transform .25s}
.task.done .ico{filter:grayscale(.6);opacity:.7}
.task:active .ico{transform:scale(.9) rotate(-6deg)}
.task{transition:background .2s,transform .15s}
.task:active{transform:scale(.985)}
.btn,.tile,.chip,.pill{transition:transform .15s}
.btn:active,.tile:active,.pill:active{transform:scale(.96)}
.grp .task.now{background:var(--pri-soft);box-shadow:inset 3px 0 0 var(--pri)}
.check.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.check.pop:after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--ok);animation:ripple .6s ease-out forwards}
.check{position:relative}
nav button svg{padding:3px 14px;width:52px;height:30px;border-radius:12px;transition:background .25s,transform .25s}
nav button.on svg{background:var(--pri-soft);animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
.enter>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}
.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(n+6){animation-delay:.25s}
.enter .grp .task{animation:up .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 40ms + .15s)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes ripple{from{transform:scale(1);opacity:.8}to{transform:scale(2.2);opacity:0}}
