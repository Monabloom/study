async function toggleTask(task, on, type) {
  const doIt = async pin => {
    const before = rewardsState(state.date).daily.unlocked;
    const res = await api('/api/task', {date: state.date, task, done: on, pin});
    if (res.error === 'needdict') { state.view = 'dict'; state.di = 0; render(); scrollTo(0, 0); return res; }
    if (res.error === 'needreview') { openDictMark('review', res.day); return res; }
    if (res.error === 'needket') { openDictMark('ket'); return res; }
    if (res.error === 'needwrong') { openDictMark('wrong'); return res; }
    if (res.error === 'needtest') { openDictMark('pet', res.day); return res; }
    if (res.error === 'needpin') { if (pin !== undefined) return {error: '家长密码不对'}; askPin('补打卡（3 天前的要家长确认）', p => doIt(p)); return {}; }
    if (res.error) { if (pin === undefined) toast(res.error); return res; }
    const rs = rewardsState(state.date), after = rs.daily.unlocked;
    if (on && DATA.timer && DATA.timer.date === state.date && DATA.timer.id === task) stopTimer();
    if (!on) { toast('已取消'); render(); return res; }
    const el = document.querySelector(`[data-task="${task}"] .check`), bx = el ? el.getBoundingClientRect() : {left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0};
    const cx = bx.left + bx.width / 2, cy = bx.top + bx.height / 2;
    await render();
    const nc = document.querySelector(`[data-task="${task}"] .check`); if (nc) nc.classList.add('pop');
    if (!before && after) bigCelebrate('🎮', '今天全部完成！', '试炼 2 局 / 排位 1 局 / 手机 20 分钟，自己选一个；周末再 +15 分钟', '去选奖励', () => go('rewards'));
    else { chime(false); confetti(cx, cy, 18); floatText(cx, cy - 10, type === 'word' || type === 'ket' ? '+2⭐' : '+1⭐');
      toast(rs.daily.remaining > 0 ? `再做 ${rs.daily.remaining} 项就能玩 🎮` : '完成 +1⭐'); }
    return res;
  };
  return doIt();
}

  $$('[data-pm]').forEach(b => b.onclick = () => {   // 每个词点 ✓ / ✗；✗ 立刻进错词本 + 生词循环；再点一次取消
    const [i, v] = b.dataset.pm.split(':').map(Number), w = card.words[i], pmk = petMarks(day), old = pmk[w.w];

    state.pmLast = w.w; save();
    const all = card.words.every(x => x.w in pmk), t0 = todayIso(), need = (!meta.learned && day === list.current) || reviewsDue(t0).some(v2 => v2.day === day && !v2.done);
    if (all && need) {   // 20 个都标完 = 这张卡完成（背完 / 复习完）

    } else if (v === 0 && old !== 0) toast(`${w.w} 进错词本了，过几天再考 🔁`);
    render();
  });
  const judge = (i, alts) => {
    const w = card.words[i];
    const r = m === 'zh' ? (judgeZh(alts, w.zh) ? 'ok' : 'no') : (judgeEn(alts, w.w) || 'no');
    quiz[i] = r; quiz._last = i; if (r === 'no') addWrong(w, 'PET');
    quiz['h' + i] = m === 'en' && /^([a-z][\s\-.,]+){2,}[a-z]\W*$/i.test(alts[0].trim()) ? alts[0].trim().replace(/[\s.,]+/g, '-').replace(/-+/g, '-').toLowerCase() : alts[0];
    const ok = Object.entries(quiz).filter(([k, v]) => /^\d+$/.test(k) && v !== 'no').length;
    const res = LOCAL['POST /api/wordtest']({day, ok});
    if (res.learned) toast(`🎉 Day ${day} 背完了！+2⭐`);
    else if (res.reviewed) toast(`🔁 Day ${day} ${res.reviewed}复习完成 +1⭐`);
    else toast(r === 'no' ? '差一点～看看正确答案' : r === 'spell' ? '拼对了！👏' : '对了！👍');
    render();
  };
  const showInput = i => { const el = document.querySelector(`[data-in="${i}"]`); el.hidden = false; el.querySelector('input').focus(); };
  bindDeck();
  $$('[data-mode]').forEach(b => b.onclick = () => { state.mode = b.dataset.mode; state.cardDay = day; render(); });
  $$('[data-rev]').forEach(el => el.onclick = () => el.classList.remove('mask'));
  $$('[data-say]').forEach(b => b.onclick = () => { sayEn(b.dataset.say); b.classList.add('playing'); setTimeout(() => b.classList.remove('playing'), 1400); });
  $$('[data-mic]').forEach(b => b.onclick = async () => {
    const i = +b.dataset.mic;
    try { speechSynthesis.cancel(); } catch (e) {}
    if (USE_KB) { showInput(i); toast(kbHint(m)); return; }   // 必须在点击里同步聚焦，iPhone 才会弹键盘
    b.textContent = '●'; b.style.background = 'var(--warn)'; b.style.color = '#fff';
    try { judge(i, await listen(m === 'zh' ? 'zh-CN' : 'en-US')); }
    catch (err) {
      b.textContent = '🎤'; b.style.background = ''; b.style.color = '';
      if (err === 'nospeech' || err === 'no-speech' || err === 'aborted') toast('没听清，再说一次');
      else { toast(`语音识别用不了（${err}），改用输入框`); showInput(i); }
    }
  });
  $$('[data-go]').forEach(b => b.onclick = () => { const i = +b.dataset.go, v = document.querySelector(`[data-in="${i}"] input`).value.trim(); if (v) judge(i, [v]); });
  $$('[data-in] input').forEach(inp => { const i = +inp.closest('[data-in]').dataset.in; autoSubmit(inp, v => judge(i, [v])); });
  $$('[data-fix]').forEach(a => a.onclick = e => { e.preventDefault(); quiz[+a.dataset.fix] = 'ok'; unWrong(card.words[+a.dataset.fix].w); render(); });
  if ($('#qreset')) $('#qreset').onclick = () => { quiz = {}; render(); };
  $$('[data-day]').forEach(b => b.onclick = () => { state.cardDay = +b.dataset.day; render(); scrollTo(0, 0); });
  $('#pd').onclick = () => { state.cardDay = day - 1; render(); scrollTo(0, 0); };
  $('#nd').onclick = () => { state.cardDay = day + 1; render(); scrollTo(0, 0); };
}

function chime(big) {

    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = big ? [523, 659, 784, 1047] : [784, 1175];
    notes.forEach((f, i) => {

      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.18, t0 + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + (big ? .5 : .3));
      o.start(t0); o.stop(t0 + .55);

  } catch (e) {}
}

}

  const mx = Math.max(1, ...avgs.map(a => a.avg)), dayTot = days7.map(d => Object.values(TM[d] || {}).reduce((a, b) => a + b, 0)), dmx = Math.max(1, ...dayTot);

  const hm = ms => { const z = new Date(ms); return String(z.getHours()).padStart(2, '0') + ':' + String(z.getMinutes()).padStart(2, '0'); };
  const finish = days7.map(d => { if (!coreFull(d)) return null; const m = DATA.taskDone[d] || {}; return Math.max(...coreTasks(d).map(z => +m[z.id] || 0)); });
  const fins = finish.filter(Boolean).map(ms => { const z = new Date(ms); let mm = z.getHours() * 60 + z.getMinutes(); if (mm < 6 * 60) mm += 24 * 60; return mm; });
  const avgFin = fins.length ? Math.round(fins.reduce((a, b) => a + b, 0) / fins.length) : null;
  const finCard = `<div class="card"><div class="row between"><h2>🕘 几点做完</h2><span class="faint">${avgFin === null ? '最近 7 天' : `平均 ${String(Math.floor(avgFin / 60) % 24).padStart(2, '0')}:${String(avgFin % 60).padStart(2, '0')} 做完`}</span></div>
    <div class="fin">${days7.map((d, i) => `<div><b class="${finish[i] ? '' : 'no'}">${finish[i] ? hm(finish[i]) : '—'}</b>${'日一二三四五六'[new Date(d + 'T00:00').getDay()]}</div>`).join('')}</div>
    <div class="faint" style="margin-top:8px">按当天最后一项打勾的时间算，没全部完成的显示 —</div></div>`;
  const WB = Object.values(DATA.wrongBook || {}), mon0 = addDays(t, 1 - isoWeekday(t)), wkNew = WB.filter(w => w.last >= mon0).length, topW = WB.slice().sort((a, b) => b.n - a.n).slice(0, 6);
  const wrongCard = `<div class="card"><div class="row between"><h2>🦊 错词</h2><span class="faint">今天要复习 ${wrongToday(t).length} 个</span></div>
    <div class="pstat" style="margin-top:12px;grid-template-columns:repeat(3,1fr)"><div><b>${WB.length}</b>错词本</div><div><b>${wkNew}</b>本周新增</div><div><b>${Object.keys(ketState().wrong).length}</b>在循环复习</div></div>
    ${topW.length ? `<div class="faint" style="margin-top:10px">错得最多：${topW.map(w => `${esc(w.w)}（${w.n}）`).join('、')}</div>` : ''}</div>`;
  const minCard = `<div class="card"><div class="row between"><h2>⏱ 用时分析</h2><span class="faint">最近 7 天</span></div>

      <div class="faint" style="margin:14px 0 4px">各项平均用时（分钟）</div>
      ${avgs.map(a => `<div class="hb"><span>${esc(a.label)}</span><div><i style="width:${a.avg / mx * 100}%"></i></div><b>${a.avg}</b></div>`).join('')}`
      : '<div class="sub" style="margin-top:6px">在「今天」页每项任务下面的「⏱ 用时」填上分钟数，这里就会出现每天总用时和各项平均用时。</div>'}</div>`;
  const cl = Object.entries(DATA.claims || {}).map(([key, v]) => ({key, ...v})).sort((a, b) => b.at - a.at);
  const cnt = DAILY_OPTS.map(([k, ic, nm]) => [ic, nm, cl.filter(c => c.note === '每日奖励：' + nm).length]);
  const rewardCard = `<div class="card"><div class="row between"><h2>🎁 孩子选的奖励</h2><span class="faint">共 ${cl.length} 次</span></div>
    <div class="pstat" style="margin-top:12px">${cnt.map(([ic, nm, n]) => `<div><b>${n}</b>${ic} ${nm.replace('王者荣耀', '')}</div>`).join('')}</div>
    ${cl.slice(0, 5).map(c => `<div class="row between" style="padding:8px 0;border-top:1px solid var(--line);margin-top:6px"><span style="font-size:14px">${esc(c.note)}</span><span class="faint">${c.date.slice(5).replace('-', '/')}</span></div>`).join('')}</div>`;
  const prog = (name, n, total, col) => `<div style="margin-top:12px"><div class="row between"><span>${name}</span><span class="faint">${n} / ${total}</span></div><div class="bar" style="margin-top:6px"><i style="width:${total ? Math.min(100, n / total * 100) : 0}%;${col ? 'background:' + col : ''}"></i></div></div>`;
  let x = `<div style="margin-top:6px"><div class="sub">只给家长看</div><h1>家长看板</h1></div>
    <div class="card hero-card"><div class="hero">${ring(tt.length - left.length, tt.length)}
      <div style="flex:1;min-width:0"><h2>${left.length ? `今天还差 ${left.length} 项` : '今天全部完成 🎉'}</h2>
        <div class="sub" style="margin-top:4px">今天用时 <b style="color:#fff" class="cnt" data-to="${todayMin}">${todayMin}</b> 分钟${todayMinN ? `（填了 ${todayMinN} 项）` : ''}</div></div></div>
      ${left.length ? `<div class="chips">${left.map(z => `<span>${esc(z.label)}</span>`).join('')}</div>` : ''}
      <div class="pstat"><div><b class="cnt" data-to="${s.streak}">${s.streak}</b>连续天</div><div><b class="cnt" data-to="${bestStreak()}">${bestStreak()}</b>最长连续</div><div><b>${L.ic}</b>Lv${L.lv} ${L.name}</div><div><b class="cnt" data-to="${s.earned}">${s.earned}</b>星星</div></div></div>
    ${weekCard(t)}${minCard}${finCard}${wrongCard}${rewardCard}
    ${s.reviews_pending ? `<div class="warn">📌 有 ${s.reviews_pending} 张单词卡到了复习时间还没复习</div>` : ''}
    <div class="card"><h2>最近 7 天</h2>
      <div class="d7">${days7.map(d => { const [n, tot] = dayProgress(d), f = coreFull(d); return `<div><i class="${f ? 'full' : d === t ? 'today' : n ? 'part' : ''}" style="--p:${tot ? n / tot : 0}">${f ? '✓' : tot ? Math.round(n / tot * 100) + '%' : ''}</i>${'日一二三四五六'[new Date(d + 'T00:00').getDay()]}</div>`; }).join('')}</div>
      ${missTop.length ? `<div class="faint" style="margin-top:12px">最常没做完：${missTop.map(([k, v]) => `${esc(k)} ${v} 次`).join('、')}</div>` : '<div class="faint" style="margin-top:12px">还没有往日数据</div>'}</div>
    <div class="card"><h2>学习进度</h2>
      ${prog('PET 单词卡', s.words_learned, s.cards_total)}${prog('KET 复习', ketDone, (CONTENT.ket || []).length, 'var(--gold)')}${prog('文言文背会', s.wenyan_memorized, s.wenyan_total, 'var(--ok)')}</div>
    ${s.history.length > 7 ? `<div class="card"><h2>最近 ${s.history.length} 天</h2><div class="hist">` +
    s.history.map(h => `<i class="${h.total && h.done === h.total ? 'full' : ''}" style="height:${h.total ? Math.max(5, h.done / h.total * 100) : 5}%"></i>`).join('') +
    `</div><div class="row between faint" style="margin-top:6px"><span>${s.history[0] ? s.history[0].date.slice(5).replace('-', '/') : ''}</span><span>今天</span></div></div>` : ''}
    <details class="card grp"><summary><span>⭐ 星星明细</span><span class="faint">共 ${s.earned} 颗</span></summary>
      ${s.recent.slice(0, 15).map(r => `<div class="row between" style="padding:6px 0;border-top:1px solid var(--line)"><span style="font-size:14px">${esc(r.note)}</span><span class="faint">${r.date.slice(5).replace('-', '/')} +${r.amount}</span></div>`).join('') || '<div class="faint" style="padding-bottom:12px">还没有</div>'}</details>

    <div class="card"><div class="row between"><h2>☁️ 云同步</h2><span class="tag" style="${CFG && CFG.gt ? 'background:var(--ok-soft);color:var(--ok)' : 'background:var(--warn-soft);color:var(--warn)'}">${CFG && CFG.gt ? '已开启' : '未开启'}</span></div>
      <div class="sub" style="margin:4px 0 12px">${CFG && CFG.gt ? `打卡记录加密后自动存到网上，手机、电脑、平板看到同一份，换设备也不丢。上次同步：${DATA.cloudAt ? new Date(DATA.cloudAt).toLocaleString('zh-CN', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'}) : '还没有'}${cloudLast ? `<br><span style="color:var(--warn)">上次没连上（${esc(cloudLast)}），联网后会自动再试</span>` : ''}` : '还没开启：记录只存在这台设备上。请家长导入带云同步的设置链接。'}</div>
      ${CFG && CFG.gt ? '<button class="btn soft sm" id="cloudNow">立即同步</button>' : ''}</div>
    <div class="card"><div class="row between"><h2>🛟 保底模式</h2><span class="tag" style="${isLite(t) ? 'background:var(--warn-soft);color:var(--warn)' : ''}">${isLite(t) ? '今天已开启' : '未开启'}</span></div>
      <div class="sub" style="margin:4px 0 12px">有晚课、太累或生病时用：今天只做「学校作业 + PET 单词 + 阅读」，做完就算全部完成，奖励和连续天数照算。</div>
      <button class="btn ${isLite(t) ? 'soft' : ''} sm" id="liteBtn">${isLite(t) ? '关掉，恢复完整任务' : '今天开启保底模式'}</button></div>
    <details class="card grp" id="tcBox"><summary><span>📝 任务设置（晚上）</span><span class="faint">开关 · 改名 · 排序</span></summary>
      <div class="sub" style="margin:2px 0 8px">关掉的任务就不出现；名字留空用默认；↑↓ 调顺序。保存要家长密码。</div>
      <div id="tcList">${eveOrder().map(id => tcRow(id)).join('')}</div>
      <div class="row" style="margin:12px 0 14px"><button class="btn sm" id="tcSave">保存</button><button class="btn soft sm" id="tcReset">恢复默认</button></div></details>
    <details class="setbox"><summary class="sec-title">⚙️ 设置、素材链接与备份</summary>
    <div class="card"><h2>📺 素材库链接</h2>
      ${listenLinks().map((l, k) => `<div class="row between" style="padding:8px 0;border-top:1px solid var(--line)"><span>${CATS.find(c => c[0] === catOf(l))[1]} ${esc(l.name)}</span><button class="btn soft sm" data-ldel="${k}">删除</button></div>`).join('') || '<div class="sub" style="margin-top:4px">还没有</div>'}
      <div class="faint" style="margin:12px 0 8px">抖音打开合集 → 分享 → 复制链接，整段粘贴到下面，再起个名字</div>
      <textarea id="lu" rows="3" style="font-size:13px" placeholder="粘贴抖音分享内容"></textarea>
      <div class="row" style="margin-top:8px"><input id="ln" placeholder="名字，如：西游记英文版"><select id="lc" style="font:inherit;padding:10px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)">${CATS.map(([k, , n]) => `<option value="${k}">${n}</option>`).join('')}</select></div>
      <button class="btn sm" id="luSave" style="margin-top:10px">添加</button></div>
    <div class="card"><h2>⭐ 一键导入推荐素材</h2><div class="sub" style="margin:4px 0 10px">${CATS.map(([k, , n]) => n + ' ' + RECOMMENDED.filter(l => l.cat === k).length).join(' · ')}，已有的不会重复</div>
      <button class="btn sm" id="recGo">一键导入</button></div>
    <div class="card"><h2>📦 导入设置 / 链接包</h2><div class="sub" style="margin:4px 0 10px">更新任务表、批量加链接时，把 Claude 给的那条长链接粘贴到这里</div>
      <textarea id="pk" rows="3" style="font-size:12px" placeholder="粘贴 https://…#setup=… 整条"></textarea>
      <button class="btn sm" id="pkGo" style="margin-top:10px">导入</button></div>
    <div class="card"><h2>🔑 修改家长密码</h2><input id="np" type="password" inputmode="numeric" placeholder="新密码（至少 4 位）" style="margin-top:10px"><button class="btn sm" id="setpin" style="margin-top:10px">修改</button></div>
    <div class="card"><h2>💾 备份（建议每周一次）</h2>
      <div class="sub" style="margin-top:4px">打卡记录只存在这部手机里。换手机或清理 Safari 数据前，先导出备份。</div>
      <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn sm" id="exp">导出备份</button>
      <label class="btn soft sm">导入备份文件<input type="file" id="impf" accept=".json,application/json,text/plain" hidden></label></div>
      <textarea id="bk" rows="3" style="margin-top:10px;font-size:12px" placeholder="也可以把备份文字粘贴到这里"></textarea>
      <button class="btn soft sm" id="impt" style="margin-top:8px">用粘贴的文字恢复</button>
      <div class="faint" style="margin-top:8px">上次备份：${DATA.lastBackup ? DATA.lastBackup.slice(5).replace('-', '/') : '还没有'}${backupDue() ? ' <b style="color:var(--warn)">· 该备份了</b>' : ''}　上次保存：${DATA.savedAt ? esc(new Date(DATA.savedAt).toLocaleString('zh-CN', {hour12: false}).slice(0, -3)) : '还没有'}</div></div></details>`;
  app.innerHTML = x;
  $('#luSave').onclick = () => { const u = $('#lu').value, n = $('#ln').value; if (!u.trim() || (!n.trim() && !/#setup=/.test(u))) { toast('链接和名字都要填'); return; } askPin('添加素材', async p => { const r = await api('/api/listen', {pin: p, url: u, name: n, cat: $('#lc').value}); if (!r.error) { toast(r.imported ? '链接包导入成功' : '已添加'); render(); } return r; }); };
  $('#recGo').onclick = () => askPin('导入推荐素材', async p => { const r = await api('/api/listen/recommended', {pin: p}); if (!r.error) { toast(r.added ? `已导入 ${r.added} 个` : '都已经有了'); render(); } return r; });
  $('#pkGo').onclick = () => { const v = $('#pk').value; if (!v.trim()) { toast('请先粘贴'); return; } askPin('导入设置 / 链接包', async p => { if (String(p) !== String(pin())) return {error: '家长密码不对'}; if (!applySetupCode(v)) return {error: '内容不完整，请重新复制整条'}; toast('导入成功'); render(); return {ok: true}; }); };
  $$('[data-ldel]').forEach(b => b.onclick = () => askPin('删除这个链接', async p => { const r = await api('/api/listen/del', {pin: p, idx: b.dataset.ldel}); if (!r.error) { toast('已删除'); render(); } return r; }));
  $('#setpin').onclick = () => { const v = $('#np').value; if (v.trim().length < 4) { toast('新密码至少 4 位'); return; } askPin('先输入原密码', async p => { const r = await api('/api/pin', {pin: p, newpin: v}); if (!r.error) { toast('密码已修改'); render(); } return r; }); };
  if ($('#wsShare')) $('#wsShare').onclick = () => shareWeek(t);
  if ($('#wsBk')) $('#wsBk').onclick = async () => { if (await doBackup()) render(); else toast('这台设备发不了文件，请到下面「设置」里导出'); };
  if ($('#cloudNow')) $('#cloudNow').onclick = async () => { toast('正在同步…'); await cloudSync(); toast(cloudLast ? '没连上，稍后再试' : '同步好了 ☁️'); render(); };
  $('#liteBtn').onclick = () => askPin(isLite(t) ? '关掉保底模式' : '今天开启保底模式', async p => {
    if (String(p) !== String(pin())) return {error: '家长密码不对'};
    DATA.lite = DATA.lite || {}; if (isLite(t)) { delete DATA.lite[t]; tomb('lite/' + t); } else DATA.lite[t] = 1; save(); refreshBonus(t); toast(isLite(t) ? '今天只做 3 项 🛟' : '已恢复完整任务'); render(); return {};
  });
  $('#tcList').onclick = e => { const b = e.target.closest('[data-up],[data-dn]'); if (!b) return; const r = b.closest('.tcr'), sib = b.hasAttribute('data-up') ? r.previousElementSibling : r.nextElementSibling; if (!sib) return; b.hasAttribute('data-up') ? r.parentNode.insertBefore(r, sib) : r.parentNode.insertBefore(sib, r); };
  $('#tcSave').onclick = () => askPin('保存任务设置', async p => {
    if (String(p) !== String(pin())) return {error: '家长密码不对'};
    const rows = $$('#tcList .tcr'), cfg = {order: rows.map(r => r.dataset.tc), off: {}, names: {}};
    rows.forEach(r => { const [cb, nmI] = r.querySelectorAll('input'); if (!cb.checked) cfg.off[r.dataset.tc] = 1; if (nmI.value.trim()) cfg.names[r.dataset.tc] = nmI.value.trim(); });
    settings().taskCfg = cfg; save(); toast('任务设置已保存'); render(); return {};
  });
  $('#tcReset').onclick = () => askPin('恢复默认任务', async p => { if (String(p) !== String(pin())) return {error: '家长密码不对'}; delete settings().taskCfg; save(); toast('已恢复默认'); render(); return {}; });
  $('#exp').onclick = async () => { if (!(await doBackup())) { $('#bk').value = exportBackup(); $('#bk').select(); toast('已放到下面文本框，请全选复制保存'); } };
  $('#impf').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { importBackup(await f.text()); toast('恢复成功'); render(); } catch (err) { toast(err.message || '文件不对'); } };
  $('#impt').onclick = () => { try { importBackup($('#bk').value.trim()); toast('恢复成功'); render(); } catch (err) { toast(err.message || '内容不对'); } };
}

/* ---------- 启动 ---------- */
const setupOk = applySetupFromHash();
if (!CFG) {
  app.innerHTML = `<div style="margin-top:30px"><div class="sub">欢迎 👋</div><h1>第一次使用</h1></div>
    <div class="card"><p style="margin-top:0">请家长把<b>设置链接</b>整条复制，粘贴到下面，点“完成设置”。</p>
    <textarea id="setupIn" rows="4" style="font-size:13px" placeholder="粘贴 https://…#setup=… 整条链接"></textarea>
    <button class="btn block" id="setupBtn" style="margin-top:12px">完成设置</button></div>
    <div class="card"><div class="sub">已经有备份文件？</div><label class="btn soft sm" style="display:inline-block;margin-top:10px">导入备份文件<input type="file" id="impf0" accept=".json,application/json,text/plain" hidden></label></div>`;
  $('#nav').hidden = true;
  $('#setupBtn').onclick = () => { if (applySetupCode($('#setupIn').value)) location.reload(); else toast('链接不完整，请重新复制整条'); };
  $('#impf0').onchange = async e => { try { importBackup(await e.target.files[0].text()); location.reload(); } catch (err) { toast(err.message || '文件不对'); } };
} else {
  if (setupOk) setTimeout(() => toast('设置成功！可以开始打卡了'), 300);
  const h0 = location.hash.slice(1), mw = h0.match(/^wy(\d+)$/);
  if (mw) { state.wy = +mw[1]; go('wenyan'); }
  else if (/^words-(zh|en)$/.test(h0)) { state.mode = h0.slice(6); go('words'); }
  else if (['today', 'words', 'wenyan', 'rewards', 'parent', 'media'].includes(h0)) go(h0); else render();
}
let lastDay = todayIso();
function dayCheck() {
  const t = todayIso();
  if (t !== lastDay) { lastDay = t; state.date = t; quiz = {}; if (CFG) render(); }
}
syncSchedule().then(ch => { if (ch) { toast('课表已自动更新'); render(); } });
cloudSync().then(ch => { if (ch) { toast('已同步其他设备的打卡记录 ☁️'); render(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { cloudSync().then(ch => { if (ch) render(); }); syncSchedule().then(ch => { if (ch) { toast('课表已自动更新'); render(); } }); dayCheck(); if (CFG && state.view === 'today' && !document.querySelector('.sheet-bg')) render(); } });
setInterval(dayCheck, 60000);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const t0 = Date.now(), hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {   // 程序更新后：新版接管就刷新一次（1 分钟内不重复刷）
    let last = 0; try { last = +localStorage.getItem('swReloadAt') || 0; } catch (e) {}
    if (hadCtl && Date.now() - last > 60000) { try { localStorage.setItem('swReloadAt', Date.now()); } catch (e) {} location.reload(); }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); });
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
}
</script>
