<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学习打卡">
<title>学习打卡</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f4f4f8">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f4f4f8; --card:#ffffff; --ink:#17171f; --sub:#71718a; --faint:#a3a3b8; --line:#ebebf2;
  --pri:#5b5bd6; --pri2:#8b7cf6; --pri-soft:#efeffd; --ok:#16a36e; --ok-soft:#e6f6ef;
  --warn:#d97a24; --warn-soft:#fdf1e4; --gold:#e8a317; --gold-soft:#fdf5df;
  --shadow:0 1px 2px rgba(23,23,31,.04),0 6px 20px rgba(23,23,31,.05);
  --r:22px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0f14; --card:#1a1a22; --ink:#ededf5; --sub:#9c9cb2; --faint:#62627a; --line:#2a2a36;
  --pri:#8d8df2; --pri2:#a99bff; --pri-soft:#24244a; --ok:#3ccb92; --ok-soft:#14302a;
  --warn:#f0a35a; --warn-soft:#382816; --gold:#f2bd4b; --gold-soft:#3a3016;
  --shadow:none; color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:calc(env(safe-area-inset-top) + 8px) 18px calc(96px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto}
h1{font-size:28px;line-height:1.2;margin:10px 0 2px;letter-spacing:-.02em;font-weight:800}
h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--sub);font-size:14px}
.faint{color:var(--faint);font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;background:var(--card);box-shadow:var(--shadow)}
.btn{white-space:nowrap;flex:none;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-size:15px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow);width:38px;height:38px;border-radius:12px;color:var(--sub);font-size:18px;cursor:pointer}
.sec-title{font-size:13px;font-weight:700;color:var(--faint);letter-spacing:.06em;margin:22px 4px 6px}
/* hero */
.hero{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .num b{font-size:26px;font-weight:800}
.ring .num span{font-size:12px;color:var(--sub)}
.unlock{border-radius:16px;padding:12px 14px;margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--bg)}
.unlock.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.unlock .ic{font-size:26px}
.unlock b{display:block;font-size:15px}
.unlock small{opacity:.8;font-size:13px}
/* week timeline */
.week{display:flex;justify-content:space-between;position:relative;margin-top:16px}
.week:before{content:'';position:absolute;left:24px;right:24px;top:21px;height:3px;border-radius:3px;background:var(--line)}
.week div{position:relative;width:46px;text-align:center;font-size:12px;color:var(--faint);font-weight:600}
.week i{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:16px;background:var(--card);border:2.5px solid var(--line);color:var(--faint)}
.week .full i{background:var(--ok);border-color:var(--ok);color:#fff}
.week .full{color:var(--ok)}
.week .miss i{background:var(--warn-soft);border-color:var(--warn-soft);color:var(--warn)}
.week .today i{border-color:var(--pri);color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
.week .today{color:var(--pri)}
.week .skip i{border-style:dashed}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--bg);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:88px}
.tile b{font-size:15px;line-height:1.35}
.tile span{font-size:12px;color:var(--pri);font-weight:700}
.sheet .row .btn.block{flex:1;width:auto}
/* tasks */
.task{display:flex;align-items:center;gap:14px;padding:13px 2px;cursor:pointer;user-select:none}
.task+.task{border-top:1px solid var(--line)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:15px;transition:.2s}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.task .lbl{flex:1}
.task.done .lbl{color:var(--faint);text-decoration:line-through}
.task .tm{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.task .pt{font-size:12px;color:var(--gold);font-weight:700}
.mini{display:flex;align-items:center;gap:14px}
.mini .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.pill{display:inline-block;padding:7px 12px;border-radius:12px;margin:4px 6px 0 0;font-size:14px;background:var(--bg);cursor:pointer;user-select:none}
.pill.on{background:var(--ok-soft);color:var(--ok);font-weight:700}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:99px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);
  border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--faint);font:inherit;font-size:11px;font-weight:600;padding:2px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri)}
/* words */
.seg{display:flex;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 0;font:inherit;font-size:14px;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--pri);color:#fff;font-weight:700}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.wrow+.wrow{border-top:1px solid var(--line)}
.wrow .n{width:20px;color:var(--faint);font-size:12px;text-align:right;flex:none}
.wrow .en{flex:1.1;min-width:0}
.wrow .en b{font-size:18px;display:block;word-break:break-word}
.wrow .en span{color:var(--sub);font-size:13px}
.wrow .zh{flex:1;font-size:15px;min-width:0}
.mask{color:transparent!important;background:var(--bg);border-radius:8px}
.say{border:0;background:var(--pri-soft);color:var(--pri);width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.grid button{border:0;border-radius:11px;padding:9px 0;font:inherit;font-size:13px;background:var(--bg);color:var(--sub);cursor:pointer}
.grid button.l{background:var(--ok-soft);color:var(--ok);font-weight:700}
.grid button.r3{background:var(--ok);color:#fff;font-weight:700}
.grid button.cur{outline:2px solid var(--pri)}
/* wenyan */
.kai{font-family:"Kaiti SC","STKaiti","楷体",KaiTi,serif}
.wy-title{font-size:34px;color:var(--pri);margin:6px 0 0}
.wy-read{font-size:22px;line-height:2.05;text-indent:2em;margin:4px 0}
.wy-read .p{color:var(--faint);font-size:14px;margin:0 3px}
.line{padding:12px 0}
.line+.line{border-top:1px solid var(--line)}
.line .o{font-size:18px}
.line .t{margin-top:4px;font-size:15px}
.line .k{margin-top:4px;color:var(--sub);font-size:13px}
.audio{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* rewards */
.rw{border-radius:var(--r);padding:20px;margin:14px 0;box-shadow:var(--shadow);background:var(--card)}
.rw.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.rw.on .sub,.rw.on .faint{color:rgba(255,255,255,.8)}
.rw .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.rw.on .btn{background:#fff;color:var(--pri)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--sub)}
.rw.on .tag{background:rgba(255,255,255,.22);color:#fff}
.mile{display:flex;align-items:center;gap:12px;padding:11px 0}
.mile+.mile{border-top:1px solid var(--line)}
/* parent */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:14px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}
.hist{display:flex;align-items:flex-end;gap:3px;height:84px;margin-top:10px}
.hist i{flex:1;background:var(--pri-soft);border-radius:5px 5px 2px 2px;min-height:4px}
.hist i.full{background:var(--ok)}
input,textarea{font:inherit;font-size:16px;padding:11px 13px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
/* sheet & toast */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-10px);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* today v2 */
.wk{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);cursor:pointer}
.wk i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;border:2px solid var(--line);color:var(--faint);flex:none}
.wk i.full{background:var(--ok);border-color:var(--ok);color:#fff}
.wk i.miss{background:var(--warn-soft);border-color:var(--warn-soft);color:var(--warn)}
.wk i.today{border-color:var(--pri);color:var(--pri)}
.wk i.skip{border-style:dashed}
.wk span{font-size:13px;color:var(--sub);margin-left:4px;line-height:1.3}
.grp{padding:4px 18px}
.grp summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px;cursor:pointer;font-weight:700;font-size:14px;color:var(--sub)}
.grp summary::-webkit-details-marker{display:none}
.grp summary:after{content:'›';transform:rotate(90deg);color:var(--faint);margin-left:8px;transition:.2s}
.grp:not([open]) summary{padding-bottom:10px}
.grp:not([open]) summary:after{transform:none}
.grp summary span:first-child{flex:1}
.task .lbl small{display:block;color:var(--faint);font-size:12.5px;margin-top:2px;line-height:1.4}
.task .lbl small .pill{padding:3px 8px;font-size:12px;margin:3px 4px 0 0}
.task .tm{text-align:right;flex:none}
.tag.pri{background:var(--pri-soft);color:var(--pri);margin-right:6px}
.tag.cls{background:var(--gold-soft);color:var(--warn);margin-right:6px}
.tag.ok{background:var(--ok-soft);color:var(--ok);margin-right:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast"></div>
<nav id="nav">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8.5 15l2 2 4-4"/></svg>今天</button>
  <button data-v="words"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 13l2.5-6 2.5 6M9.8 11h3.4"/></svg>单词</button>
  <button data-v="wenyan"><svg viewBox="0 0 24 24"><path d="M7 3h11a2 2 0 0 1 2 2v13a3 3 0 0 1-3 3H7"/><path d="M7 3a3 3 0 0 0-3 3v1h3M7 3v15a3 3 0 0 0 3 3"/><path d="M11 8h5M11 12h5M11 16h3"/></svg>文言文</button>
  <button data-v="rewards"><svg viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="11.5" rx="2"/><path d="M2.5 9h19M12 9v11.5"/><path d="M12 9S10.5 4 8 4a2.3 2.3 0 0 0 0 4.6M12 9s1.5-5 4-5a2.3 2.3 0 0 1 0 4.6"/></svg>奖励</button>
  <button data-v="parent"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>家长</button>
</nav>

om", "ipa": "/frɒm/", "zh": "从"}, {"w": "off", "ipa": "/ɒf/", "zh": "离开，关闭"}, {"w": "on", "ipa": "/ɒn/", "zh": "在上面"}, {"w": "otherwise", "ipa": "/ˈʌðərwaɪz/", "zh": "否则，另外"}, {"w": "ought", "ipa": "/ɔːt/", "zh": "应该"}, {"w": "regarding", "ipa": "/rɪˈɡɑːrdɪŋ/", "zh": "关于"}, {"w": "shall", "ipa": "/ʃæl/", "zh": "将（表示未来的助动词）"}, {"w": "should", "ipa": "/ʃʊd/", "zh": "应该"}, {"w": "so", "ipa": "/soʊ/", "zh": "那么"}]}, {"day": 89, "topics": "连接词、介词与情态词", "words": [{"w": "than", "ipa": "/ðæn/", "zh": "比"}, {"w": "therefore", "ipa": "/ˈðɛrˌfɔːr/", "zh": "因此"}, {"w": "though", "ipa": "/ðoʊ/", "zh": "虽然"}, {"w": "together", "ipa": "/təˈɡɛðər/", "zh": "一起"}, {"w": "unless", "ipa": "/ʌnˈlɛs/", "zh": "除非"}, {"w": "whether", "ipa": "/ˈwɛðər/", "zh": "是否"}, {"w": "will", "ipa": "/wɪl/", "zh": "将，愿意"}, {"w": "would", "ipa": "/wʊd/", "zh": "将，会"}, {"w": "face-to-face", "ipa": "/ˈfeɪs tu ˈfeɪs/", "zh": "面对面的"}, {"w": "according to", "ipa": "/əˈkɔːrdʒɪŋ tuː/", "zh": "根据"}, {"w": "apart from", "ipa": "/əˈpɑːrt frəm/", "zh": "除了"}, {"w": "as long as", "ipa": "/æz lɒŋ æz/", "zh": "只要"}, {"w": "as well (as)", "ipa": "/æz wel æz/", "zh": "也，同样"}, {"w": "at all", "ipa": "/æt ɔːl/", "zh": "根本，究竟"}, {"w": "at least", "ipa": "/æt liːst/", "zh": "至少"}, {"w": "because of", "ipa": "/bɪˈkɒz əv/", "zh": "因为"}, {"w": "by hand", "ipa": "/baɪ hænd/", "zh": "手工"}, {"w": "by mistake", "ipa": "/baɪ maɪˈsteɪk/", "zh": "错误地"}, {"w": "by name", "ipa": "/baɪ neɪm/", "zh": "以名字"}, {"w": "due to", "ipa": "/djuː tuː/", "zh": "由于"}]}, {"day": 90, "topics": "连接词、介词与情态词", "words": [{"w": "even though", "ipa": "/ˌiːvən ðoʊ/", "zh": "即使"}, {"w": "face to face", "ipa": "/feɪs tu feɪs/", "zh": "面对面地"}, {"w": "in fact", "ipa": "/ɪn fækt/", "zh": "事实上"}, {"w": "in order", "ipa": "/ɪn ˈɔːrdər/", "zh": "有序"}, {"w": "in order to", "ipa": "/ɪn ˈɔːrdər tuː/", "zh": "为了"}, {"w": "in the end", "ipa": "/ɪn ðə ɛnd/", "zh": "最后"}, {"w": "instead (of)", "ipa": "/ɪnˈstɛd əv/", "zh": "代替"}, {"w": "on purpose", "ipa": "/ɒn ˈpɜːrpəs/", "zh": "故意地"}, {"w": "out of date", "ipa": "/ˌaʊt əv deɪt/", "zh": "过时的"}, {"w": "out of order", "ipa": "/ˌaʊt əv ˈɔːrdər/", "zh": "出故障的"}, {"w": "up to date", "ipa": "/ʌp tuː deɪt/", "zh": "最新的"}]}], "wenyan": [{"t": "司马光", "g": "三年级上册", "s": "《宋史·司马光传》（课本据此改写）", "read": "群儿/戏于庭，一儿/登瓮，足跌/没水中。众/皆弃去，光/持石/击瓮/破之，水迸，儿/得活。", "hard": "瓮 wèng　没 mò　迸 bèng", "lines": [["群儿戏于庭，", "戏：玩耍。庭：庭院。", "一群小孩在庭院里玩耍。"], ["一儿登瓮，足跌没水中。", "瓮：口小肚大的大缸。跌：失足。没（mò）：沉没、淹没。", "一个小孩爬上大缸，失足掉进缸里，被水淹没了。"], ["众皆弃去，", "皆：都。弃去：丢下他跑开。", "其他小孩都丢下他跑了。"], ["光持石击瓮破之，", "持：拿着。", "司马光拿起石头砸缸，把缸砸破了，"], ["水迸，儿得活。", "迸：涌出。", "水涌了出来，落水的小孩得救了。"]], "tip": "一个动作一个字，连起来就是整篇：戏 → 登 → 跌 → 弃 → 击 → 迸 → 活", "moral": "遇到危险不慌张，冷静想办法。"}, {"t": "守株待兔", "g": "三年级下册", "s": "《韩非子·五蠹》", "read": "宋人/有耕者。田中/有株，兔走/触株，折颈/而死。因/释其耒/而守株，冀/复得兔。兔/不可复得，而身/为宋国笑。", "hard": "株 zhū　耒 lěi　冀 jì", "lines": [["宋人有耕者。", "耕：耕田、种地。", "宋国有个种田的人。"], ["田中有株，兔走触株，折颈而死。", "株：露出地面的树桩。走：跑。触：撞。", "他的田里有个树桩，一只兔子跑过来撞到树桩上，折断脖子死了。"], ["因释其耒而守株，冀复得兔。", "因：于是。释：放下。耒（lěi）：古代翻土的农具。冀（jì）：希望。复：再。", "于是他放下农具，守在树桩旁边，希望再捡到兔子。"], ["兔不可复得，而身为宋国笑。", "身：他自己。为……笑：被……嘲笑。", "兔子不可能再捡到了，他自己却被宋国人当成了笑话。"]], "tip": "耕 → 株 → 触 → 死 → 释 → 守 → 冀 → 笑", "moral": "偶然的好运不会天天有，想要收获就得靠自己努力。"}, {"t": "精卫填海", "g": "四年级上册", "s": "《山海经·北山经》", "read": "炎帝之/少女，名曰/女娃。女娃/游于东海，溺/而不返，故/为精卫。常/衔西山之/木石，以/堙于东海。", "hard": "溺 nì　衔 xián　堙 yīn", "lines": [["炎帝之少女，名曰女娃。", "少女：小女儿。曰：叫做。", "炎帝的小女儿，名叫女娃。"], ["女娃游于东海，溺而不返，", "溺（nì）：淹没、淹死。返：回来。", "女娃到东海游玩，淹死在海里，再也没能回来，"], ["故为精卫。", "故：所以。为：变成。", "所以变成了精卫鸟。"], ["常衔西山之木石，以堙于东海。", "衔：用嘴叼着。堙（yīn）：填塞。", "她常常叼着西山上的树枝和石子，用来填塞东海。"]], "tip": "按\"谁 → 出了什么事 → 变成什么 → 做什么\"背：炎帝少女 → 溺 → 精卫 → 衔木石，堙东海", "moral": "精卫鸟意志坚定、不怕困难，再难的事也坚持去做。"}, {"t": "王戎不取道旁李", "g": "四年级上册", "s": "《世说新语·雅量》", "read": "王戎/七岁，尝/与诸小儿/游。看/道边李树/多子/折枝，诸儿/竞走/取之，唯/戎不动。人/问之，答曰：“树/在道边/而多子，此/必苦李。”取之，信然。", "hard": "尝 cháng　诸 zhū　竞 jìng", "lines": [["王戎七岁，尝与诸小儿游。", "尝：曾经。诸：众多。游：玩耍。", "王戎七岁的时候，曾经和许多小孩一起玩。"], ["看道边李树多子折枝，", "子：果实。折枝：把树枝都压弯了。", "他们看见路边的李树结了很多李子，把树枝都压弯了，"], ["诸儿竞走取之，唯戎不动。", "竞走：争着跑过去。唯：只有。", "小孩们争着跑去摘，只有王戎站着不动。"], ["人问之，答曰：“树在道边而多子，此必苦李。”", "此：这。", "有人问他为什么不去，他回答：“李树长在路边，还结了这么多果子，这一定是苦李子。”"], ["取之，信然。", "信然：确实如此。", "摘来一尝，果然是这样。"]], "tip": "看 → 竞走取 → 唯戎不动 → 问 → 答（道边、多子、苦李）→ 信然", "moral": "遇事先观察、动脑想，不盲目跟着别人跑。"}, {"t": "囊萤夜读", "g": "四年级下册", "s": "《晋书·车胤传》", "read": "胤/恭勤不倦，博学/多通。家贫/不常得油，夏月/则练囊/盛数十萤火/以照书，以夜/继日焉。", "hard": "胤 yìn　囊 náng　萤 yíng　盛 chéng　数 shù", "lines": [["胤恭勤不倦，博学多通。", "胤：车胤，晋朝人。恭勤：谦逊勤奋。倦：疲倦。通：通晓。", "车胤谦逊勤奋，从不疲倦，知识广博，懂得很多学问。"], ["家贫不常得油，", "油：点灯用的油。", "家里穷，不能经常有灯油点灯。"], ["夏月则练囊盛数十萤火以照书，", "夏月：夏天。练囊：白绢做的袋子。盛（chéng）：装。", "夏天，他就用白绢袋装几十只萤火虫，用来照着读书，"], ["以夜继日焉。", "以夜继日：夜晚接着白天，指日夜不停。焉：语气词。", "白天晚上都不停地学习。"]], "tip": "先说人（恭勤、博学）→ 再说难（家贫无油）→ 最后说办法（练囊盛萤，以夜继日）", "moral": "条件再艰苦，只要肯想办法，也能坚持学习。"}, {"t": "铁杵成针", "g": "四年级下册", "s": "宋·祝穆《方舆胜览·眉州》", "read": "磨针溪，在/眉州/象耳山下。世传/李太白/读书山中，未成，弃去。过/是溪，逢/老媪/方磨铁杵，问之，曰：“欲作针。”太白/感其意，还/卒业。媪/自言姓武。今/溪旁/有武氏岩。", "hard": "媪 ǎo　杵 chǔ　还 huán　卒 zú", "lines": [["磨针溪，在眉州象耳山下。", "眉州：在今四川眉山。", "磨针溪在眉州的象耳山下。"], ["世传李太白读书山中，未成，弃去。", "世传：世代相传。李太白：李白，字太白。弃去：放弃离开。", "相传李白在山中读书，学业还没完成，就放弃离开了。"], ["过是溪，逢老媪方磨铁杵，", "是：这。逢：遇到。媪（ǎo）：老妇人。方：正在。杵（chǔ）：棒槌。", "他经过这条小溪，遇见一位老奶奶正在磨一根铁棒，"], ["问之，曰：“欲作针。”", "欲：想要。", "李白问她在做什么，老奶奶说：“想把它磨成一根针。”"], ["太白感其意，还卒业。", "感：被……感动。还（huán）：回去。卒（zú）业：完成学业。", "李白被她的毅力感动，回到山中完成了学业。"], ["媪自言姓武。今溪旁有武氏岩。", "", "老奶奶说自己姓武。现在溪边还有一块“武氏岩”。"]], "tip": "地点（磨针溪）→ 李白弃学 → 遇媪磨杵 → 问答 → 感其意，还卒业 → 武氏岩", "moral": "只要功夫深，铁杵磨成针。做事要坚持，不能半途而废。"}, {"t": "古人谈读书", "g": "五年级上册", "s": "前三则出自《论语》；第四则出自宋·朱熹《训学斋规》", "read": "子曰：“敏/而好学，不耻/下问。”\n子曰：“知之/为知之，不知/为不知，是/知也。”\n子曰：“默/而识之，学/而不厌，诲人/不倦。”\n余/尝谓，读书/有三到，谓/心到，眼到，口到。心/不在此，则眼/不看仔细，心眼/既不专一，却只/漫浪诵读，决/不能记，记/亦不能久也。三到之中，心到/最急。心/既到矣，眼口/岂不到乎？", "hard": "好 hào　识 zhì　诲 huì　岂 qǐ", "lines": [["子曰：“敏而好学，不耻下问。”", "子：孔子。敏：聪明。好（hào）：喜爱。耻：以……为羞耻。下问：向不如自己的人请教。", "孔子说：“聪明又爱学习，不把向不如自己的人请教当成丢脸的事。”"], ["子曰：“知之为知之，不知为不知，是知也。”", "为：是。是：这。知：同“智”，智慧。", "孔子说：“知道就是知道，不知道就是不知道，这才是真正的智慧。”"], ["子曰：“默而识之，学而不厌，诲人不倦。”", "识（zhì）：记住。厌：满足。诲：教导。", "孔子说：“把学到的默默记在心里，学习从不满足，教别人从不厌倦。”"], ["余尝谓，读书有三到，谓心到，眼到，口到。", "余：我。尝：曾经。谓：说。", "我曾经说过，读书要做到“三到”：心到、眼到、口到。"], ["心不在此，则眼不看仔细，", "此：这里，指书本。", "心思不在书上，眼睛就不会看仔细，"], ["心眼既不专一，却只漫浪诵读，", "漫浪：随随便便。", "心和眼都不专注，只是随随便便地读，"], ["决不能记，记亦不能久也。", "决：一定。亦：也。", "一定记不住，就算记住了也记不长久。"], ["三到之中，心到最急。", "急：要紧。", "三到之中，心到最要紧。"], ["心既到矣，眼口岂不到乎？", "岂：难道。", "心已经到了，眼睛和嘴难道还会不到吗？"]], "tip": "孔子三句各抓一个字：敏（好学）→ 知（实事求是）→ 默（记住、不厌、不倦）；朱熹一段抓“三到，心到最急”", "moral": "读书要谦虚好学、实事求是，最要紧的是专心。"}, {"t": "少年中国说（节选）", "g": "五年级上册", "s": "梁启超（半文言）", "read": "故/今日之责任，不在他人，而全在/我少年。少年智/则国智，少年富/则国富；少年强/则国强，少年独立/则国独立；少年自由/则国自由；少年进步/则国进步；少年胜于欧洲，则国/胜于欧洲；少年雄于地球，则国/雄于地球。\n红日初升，其道/大光。河出伏流，一泻/汪洋。潜龙/腾渊，鳞爪/飞扬。乳虎/啸谷，百兽/震惶。鹰隼/试翼，风尘/翕张。奇花/初胎，矞矞/皇皇。干将/发硎，有作/其芒。天戴/其苍，地履/其黄。纵有/千古，横有/八荒。前途/似海，来日/方长。\n美哉/我少年中国，与天/不老！壮哉/我中国少年，与国/无疆！", "hard": "隼 sǔn　翕 xī　矞 yù　干将 gān jiāng　硎 xíng　履 lǚ", "lines": [["故今日之责任，不在他人，而全在我少年。", "故：所以。", "所以今天的责任，不在别人身上，全在我们少年身上。"], ["少年智则国智，少年富则国富；少年强则国强，少年独立则国独立；少年自由则国自由；少年进步则国进步；", "智：聪明。则：就。", "少年聪明，国家就聪明；少年富裕，国家就富裕；少年强大，国家就强大；少年独立，国家就独立；少年自由，国家就自由；少年进步，国家就进步；"], ["少年胜于欧洲，则国胜于欧洲；少年雄于地球，则国雄于地球。", "胜于：胜过。雄：称雄。", "少年胜过欧洲，国家就胜过欧洲；少年称雄世界，国家就称雄世界。"], ["红日初升，其道大光。", "道：道路。", "红日刚刚升起，前方的道路一片光明。"], ["河出伏流，一泻汪洋。", "伏流：地下的水流。汪洋：宽广的水面。", "黄河从地下奔涌而出，一泻千里，浩浩荡荡。"], ["潜龙腾渊，鳞爪飞扬。", "潜龙：潜藏的龙。渊：深水。", "潜藏的龙从深渊中腾跃而起，鳞片和爪子舞动飞扬。"], ["乳虎啸谷，百兽震惶。", "乳虎：小老虎。啸：吼叫。震惶：震惊害怕。", "小老虎在山谷中吼叫，所有野兽都感到害怕。"], ["鹰隼试翼，风尘翕张。", "隼（sǔn）：一种猛禽。试翼：展翅试飞。翕（xī）张：收拢和张开。", "雄鹰展翅试飞，卷起漫天风沙。"], ["奇花初胎，矞矞皇皇。", "初胎：刚孕育出花苞。矞矞（yù）皇皇：繁盛美丽的样子。", "奇异的花刚长出花苞，就显得富丽堂皇。"], ["干将发硎，有作其芒。", "干将（gān jiāng）：古代宝剑名。发硎（xíng）：刚在磨刀石上磨过。芒：锋芒。", "宝剑刚刚磨好，闪着锋利的光芒。"], ["天戴其苍，地履其黄。", "戴：头顶着。履（lǚ）：脚踩着。", "头顶着苍天，脚踩着黄土大地。"], ["纵有千古，横有八荒。", "纵：从时间上说。横：从空间上说。八荒：四面八方遥远的地方。", "从时间看，有悠久的历史；从空间看，有辽阔的疆土。"], ["前途似海，来日方长。", "方：正。", "前途像大海一样宽广，未来的日子还很长。"], ["美哉我少年中国，与天不老！壮哉我中国少年，与国无疆！", "哉：啊。无疆：没有尽头。", "美啊，我的少年中国，将和天一样永不衰老！壮啊，我的中国少年，将和国家一样前程无限！"]], "tip": "分三段背：① “少年X则国X”，依次是智、富、强、独立、自由、进步，再加胜于欧洲、雄于地球；② 七个比喻按顺序：红日 → 河 → 潜龙 → 乳虎 → 鹰隼 → 奇花 → 干将，最后天地、纵横、前途；③ 结尾两句“美哉……壮哉……”", "moral": "少年是国家的希望，要立志做有用的人。"}, {"t": "自相矛盾", "g": "五年级下册", "s": "《韩非子·难一》", "read": "楚人/有鬻盾与矛者，誉之曰：“吾盾之坚，物/莫能陷也。”又誉其矛曰：“吾矛之利，于物/无不陷也。”或曰：“以子之矛，陷/子之盾，何如？”其人/弗能应也。夫/不可陷之盾/与无不陷之矛，不可/同世而立。", "hard": "鬻 yù　弗 fú　夫 fú", "lines": [["楚人有鬻盾与矛者，", "鬻（yù）：卖。", "楚国有个卖盾和矛的人，"], ["誉之曰：“吾盾之坚，物莫能陷也。”", "誉：夸耀。吾：我。莫：没有什么。陷：刺破、穿透。", "他夸自己的盾说：“我的盾非常坚固，没有什么东西能刺穿它。”"], ["又誉其矛曰：“吾矛之利，于物无不陷也。”", "利：锋利。", "又夸他的矛说：“我的矛非常锋利，什么东西都能刺穿。”"], ["或曰：“以子之矛，陷子之盾，何如？”", "或：有人。子：您。何如：怎么样。", "有人问：“用您的矛刺您的盾，会怎么样呢？”"], ["其人弗能应也。", "弗：不。应：回答。", "那个人回答不上来。"], ["夫不可陷之盾与无不陷之矛，不可同世而立。", "夫（fú）：句首语气词。同世而立：同时存在。", "刺不穿的盾和什么都能刺穿的矛，是不可能同时存在的。"]], "tip": "卖 → 夸盾（莫能陷）→ 夸矛（无不陷）→ 有人问 → 答不上 → 结论（不可同世而立）", "moral": "说话做事要前后一致，不能自己打自己的嘴巴。"}, {"t": "杨氏之子", "g": "五年级下册", "s": "《世说新语·言语》", "read": "梁国/杨氏子/九岁，甚/聪惠。孔君平/诣其父，父/不在，乃/呼儿出。为/设果，果/有杨梅。孔/指以示儿曰：“此是/君家果。”儿/应声答曰：“未闻/孔雀/是夫子家禽。”", "hard": "惠 huì　诣 yì", "lines": [["梁国杨氏子九岁，甚聪惠。", "甚：非常。惠：同“慧”，智慧。", "梁国一户姓杨的人家，有个九岁的儿子，非常聪明。"], ["孔君平诣其父，父不在，乃呼儿出。", "诣（yì）：拜访。乃：于是。", "孔君平来拜访孩子的父亲，父亲不在家，于是把孩子叫了出来。"], ["为设果，果有杨梅。", "设：摆放。", "孩子给客人摆上水果，水果里有杨梅。"], ["孔指以示儿曰：“此是君家果。”", "示：给……看。君家：您家。", "孔君平指着杨梅对孩子说：“这是你家的果子。”"], ["儿应声答曰：“未闻孔雀是夫子家禽。”", "应声：随着声音，马上。闻：听说。夫子：对男子的尊称。", "孩子马上回答：“我可没听说过孔雀是您家的鸟。”"]], "tip": "抓住“姓”的玩笑：杨梅 → 杨家的果；孔雀 → 孔家的鸟。客人姓孔，孩子姓杨，一来一回就记住了", "moral": "说话既要机智，也要有礼貌：孩子说“未闻”，没有直接顶撞长辈。"}, {"t": "伯牙鼓琴", "g": "六年级上册", "s": "《吕氏春秋·本味》", "read": "伯牙/鼓琴，锺子期/听之。方鼓琴/而志在太山，锺子期曰：“善哉乎/鼓琴，巍巍乎/若太山。”少选之间/而志在流水，锺子期/又曰：“善哉乎/鼓琴，汤汤乎/若流水。”锺子期死，伯牙/破琴绝弦，终身/不复鼓琴，以为/世无足复/为鼓琴者。", "hard": "锺 zhōng　巍 wēi　汤汤 shāng shāng　少选 shǎo xuǎn", "lines": [["伯牙鼓琴，锺子期听之。", "鼓：弹奏。", "伯牙弹琴，锺子期在一旁听。"], ["方鼓琴而志在太山，", "方：正在。志：心里想的。太山：大山（一说泰山）。", "伯牙弹琴时，心里想着高山，"], ["锺子期曰：“善哉乎鼓琴，巍巍乎若太山。”", "善：好。哉、乎：语气词，相当于“啊”。巍巍：高大的样子。若：像。", "锺子期说：“弹得真好啊！我仿佛看到了巍峨的高山。”"], ["少选之间而志在流水，", "少选：一会儿。", "过了一会儿，伯牙心里又想着流水，"], ["锺子期又曰：“善哉乎鼓琴，汤汤乎若流水。”", "汤汤（shāng shāng）：水流大而急的样子。", "锺子期又说：“弹得真好啊！我仿佛看到了浩荡的流水。”"], ["锺子期死，伯牙破琴绝弦，终身不复鼓琴，", "绝：弄断。终身：一辈子。复：再。", "锺子期死后，伯牙摔破琴、扯断弦，一辈子不再弹琴，"], ["以为世无足复为鼓琴者。", "以为：认为。足：值得。", "他认为世上再也没有值得他为之弹琴的人了。"]], "tip": "两组对称句一起背：志在太山 ↔ 巍巍乎若太山；志在流水 ↔ 汤汤乎若流水。结尾一个动作：破琴绝弦", "moral": "真正懂你的朋友（知音）非常难得，要珍惜。"}, {"t": "书戴嵩画牛", "g": "六年级上册", "s": "宋·苏轼", "read": "蜀中/有杜处士，好书画，所宝/以百数。有/戴嵩《牛》一轴，尤所爱，锦囊/玉轴，常/以自随。一日/曝书画，有一牧童/见之，拊掌/大笑，曰：“此画/斗牛也。牛斗，力/在角，尾/搐入两股间。今/乃掉尾而斗，谬矣！”处士/笑而然之。古语有云：“耕/当问奴，织/当问婢。”不可改也。", "hard": "嵩 sōng　处士 chǔ shì　曝 pù　拊 fǔ　搐 chù　谬 miù　婢 bì", "lines": [["蜀中有杜处士，好书画，所宝以百数。", "蜀：今四川一带。处士（chǔ shì）：不做官的读书人。好（hào）：喜爱。宝：珍藏。以百数：用百来计算，形容很多。", "四川有一位姓杜的处士，喜爱书画，珍藏的书画有好几百件。"], ["有戴嵩《牛》一轴，尤所爱，锦囊玉轴，常以自随。", "戴嵩：唐代画家，擅长画牛。轴：卷轴，一幅画叫一轴。尤：尤其。锦囊玉轴：用锦缎做画套，用玉做画轴。自随：随身带着。", "其中有一幅戴嵩画的《牛》，他特别喜爱，用锦缎做画套、用玉做画轴，常常随身带着。"], ["一日曝书画，有一牧童见之，拊掌大笑，曰：", "曝（pù）：晒。拊（fǔ）掌：拍手。", "有一天他晾晒书画，一个放牛的孩子看见了这幅画，拍着手大笑，说："], ["“此画斗牛也。牛斗，力在角，尾搐入两股间。", "搐（chù）：抽缩、夹紧。股：大腿。", "“这画的是两头牛在打架。牛打架时，力气集中在角上，尾巴紧紧夹在两条后腿中间。"], ["今乃掉尾而斗，谬矣！”", "乃：却。掉尾：摇着尾巴。谬：错误。", "可这画上的牛却摇着尾巴打架，画错了！”"], ["处士笑而然之。", "然：认为……是对的。", "杜处士笑了，认为牧童说得对。"], ["古语有云：“耕当问奴，织当问婢。”不可改也。", "奴：男仆。婢（bì）：女仆。", "古话说：“种地的事应该问种地的男仆，织布的事应该问织布的女仆。”这个道理是不会变的。"]], "tip": "处士爱画（锦囊玉轴）→ 晒画 → 牧童笑 → 指错（力在角，尾在股间，掉尾谬矣）→ 处士然之 → 古语", "moral": "实践出真知，要向真正有经验的人请教；名家也会出错。"}, {"t": "学弈", "g": "六年级下册", "s": "《孟子·告子上》", "read": "弈秋，通国之/善弈者也。使/弈秋/诲二人弈，其一人/专心致志，惟弈秋之为听；一人/虽听之，一心/以为/有鸿鹄将至，思/援弓缴/而射之。虽/与之俱学，弗若之矣。为/是其智/弗若与？曰：非然也。", "hard": "弈 yì　诲 huì　鹄 hú　缴 zhuó　为 wèi　与 yú", "lines": [["弈秋，通国之善弈者也。", "弈：下棋。通国：全国。善：擅长。", "弈秋是全国最擅长下棋的人。"], ["使弈秋诲二人弈，", "使：让。诲：教导。", "让弈秋教两个人下棋，"], ["其一人专心致志，惟弈秋之为听；", "惟弈秋之为听：只听弈秋的教导。", "其中一个人专心致志，只听弈秋讲；"], ["一人虽听之，一心以为有鸿鹄将至，思援弓缴而射之。", "鸿鹄（hú）：天鹅。援：拉。缴（zhuó）：系着丝绳的箭。", "另一个人虽然也在听，心里却一直想着有天鹅要飞过来，想拉弓搭箭去射它。"], ["虽与之俱学，弗若之矣。", "俱：一起。弗若：不如。", "虽然他和前一个人一起学，成绩却不如前一个人。"], ["为是其智弗若与？曰：非然也。", "为（wèi）：因为。是：这。与（yú）：同“欤”，吗。非然：不是这样。", "是因为他的智力不如别人吗？回答是：不是这样的。"]], "tip": "一位老师（弈秋）→ 两个学生：一个“专心致志”，一个“想射鸿鹄”→ 结果“弗若”→ 原因不是“智”", "moral": "学习成绩好坏，关键在专心不专心，不在聪明不聪明。"}, {"t": "两小儿辩日", "g": "六年级下册", "s": "《列子·汤问》", "read": "孔子/东游，见/两小儿/辩斗，问其故。一儿曰：“我以/日始出时/去人近，而/日中时/远也。”一儿/以日初出/远，而/日中时/近也。一儿曰：“日初出/大如车盖，及/日中/则如盘盂，此/不为远者小/而近者大乎？”一儿曰：“日初出/沧沧凉凉，及其/日中/如探汤，此/不为近者热/而远者凉乎？”孔子/不能决也。两小儿/笑曰：“孰为汝/多知乎？”", "hard": "盂 yú　沧 cāng　汤 tāng　孰 shú　汝 rǔ（“孰为汝多知乎”的“为”“知”各版本读音有分歧，以课本注音为准）", "lines": [["孔子东游，见两小儿辩斗，问其故。", "游：游历。辩斗：争辩。故：原因。", "孔子到东方游历，看见两个小孩在争论，就问他们在争什么。"], ["一儿曰：“我以日始出时去人近，而日中时远也。”", "以：认为。去：距离。日中：中午。", "一个小孩说：“我认为太阳刚出来时离人近，中午时离人远。”"], ["一儿以日初出远，而日中时近也。", "", "另一个小孩认为太阳刚出来时离人远，中午时离人近。"], ["一儿曰：“日初出大如车盖，及日中则如盘盂，此不为远者小而近者大乎？”", "车盖：古代车上的篷盖。及：等到。盘盂（yú）：盘子和碗。为：是。", "一个小孩说：“太阳刚出来时大得像车篷，到了中午就小得像个盘子，这不正是远的看起来小、近的看起来大吗？”"], ["一儿曰：“日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？”", "沧沧凉凉：清凉、有点冷。探汤：把手伸进热水里。", "另一个小孩说：“太阳刚出来时凉飕飕的，到了中午热得像把手伸进热水里，这不正是近的热、远的凉吗？”"], ["孔子不能决也。", "决：判断。", "孔子也判断不了谁对谁错。"], ["两小儿笑曰：“孰为汝多知乎？”", "孰：谁。为：说。汝：你。知：同“智”，智慧。", "两个小孩笑着说：“谁说你知识渊博呢？”"]], "tip": "一个看“大小”（车盖 ↔ 盘盂），一个看“冷热”（沧沧凉凉 ↔ 探汤），两人观点正好相反；结尾：孔子不能决，小儿笑", "moral": "学无止境，再有学问的人也有不懂的；不懂就说不懂，这是实事求是。"}], "wenyan_schedule": [{"start": "2026-11-16", "end": "2026-11-22", "idxs": [0, 1, 2, 3], "label": "复背已学 4 篇"}, {"start": "2026-11-23", "end": "2026-12-06", "idxs": [4], "label": "《囊萤夜读》"}, {"start": "2026-12-07", "end": "2026-12-20", "idxs": [5], "label": "《铁杵成针》"}, {"start": "2026-12-21", "end": "2027-01-10", "idxs": [6], "label": "《古人谈读书》"}, {"start": "2027-01-11", "end": "2027-01-31", "idxs": [7], "label": "《少年中国说（节选）》"}, {"start": "2027-02-01", "end": "2027-02-07", "idxs": [], "label": "春节：只复背已会的"}, {"start": "2027-02-08", "end": "2027-02-14", "idxs": [], "label": "春节：只复背已会的"}, {"start": "2027-02-15", "end": "2027-02-28", "idxs": [8], "label": "《自相矛盾》"}, {"start": "2027-03-01", "end": "2027-03-14", "idxs": [9], "label": "《杨氏之子》"}, {"start": "2027-03-15", "end": "2027-03-28", "idxs": [10], "label": "《伯牙鼓琴》"}, {"start": "2027-03-29", "end": "2027-04-11", "idxs": [11], "label": "《书戴嵩画牛》"}, {"start": "2027-04-12", "end": "2027-04-25", "idxs": [12], "label": "《学弈》"}, {"start": "2027-04-26", "end": "2027-05-09", "idxs": [13], "label": "《两小儿辩日》"}], "ket": [{"day": 1, "words": [{"w": "a few", "ipa": "/ə fjuː/", "zh": "一些"}, {"w": "a.m.", "ipa": "/eɪˈem/", "zh": "n.(缩)上午 午前"}, {"w": "able", "ipa": "/ˈeɪb(ə)l/", "zh": "a.有本事的"}, {"w": "about", "ipa": "/əˈbaʊt/", "zh": "ad.在周围；大约prep.关于；在周围a.准备"}, {"w": "accident", "ipa": "/ˈæksɪdənt/", "zh": "n.意外遭遇,事故；意外(因素)"}, {"w" <script>/* 手机独立版：把原服务端逻辑搬到本地，数据存 iPhone 本机 localStorage */
const LS_DATA = 'study_data_v1', LS_CFG = 'study_cfg_v1';
const CARDS = CONTENT.cards, WENYAN = CONTENT.wenyan, WY_SCHED = CONTENT.wenyan_schedule;
const REVIEW_OFFSETS = {1: 1, 2: 3, 3: 6, 4: 14, 5: 29};   // 记忆曲线：第 2、4、7、15、30 天
const REVIEW_NAMES = {1: '次日', 2: '第4天', 3: '第7天', 4: '第15天', 5: '第30天'};
const STAGES = [1, 2, 3, 4, 5];
const WY_STAGES = ['读通 5 遍', '能讲意思', '能背下来', '1 周后复背', '1 月后复背'];

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function emptyData() { return {taskDone: {}, wordLearn: {}, wordReview: {}, wenyan: {}, stars: {}, rewards: null, redeem: [], nextId: 1}; }
let DATA = lsGet(LS_DATA, null) || emptyData();
let CFG = lsGet(LS_CFG, null);
function save() { DATA.savedAt = new Date().toISOString(); lsSet(LS_DATA, DATA); }

function ensureRewards() {
  if (DATA.rewards === null && CFG) {
    DATA.rewards = (CFG.rewards || []).map(([name, cost]) => ({id: DATA.nextId++, name, cost, active: 1}));
    save();
  }
  if (DATA.rewards === null) DATA.rewards = [];
}

const isoOf = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 10); };
const todayStr = () => isoOf(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return isoOf(d); };
const isoWeekday = s => { const w = new Date(s + 'T00:00').getDay(); return w === 0 ? 7 : w; };
const diffDays = (a, b) => Math.round((new Date(a + 'T00:00') - new Date(b + 'T00:00')) / 864e5);

/* 固定学习任务（不含任何课程信息），课程从课表同步进来 */
const EVENING = [['homework', '学校作业', '18:30'], ['reading', '英语阅读 1 篇', '19:30'], ['listen2', '英语听力 1 篇', '19:45'], ['math', '数学计算 15 分钟', '20:00'],
  ['word', 'PET 单词 20 个', '20:15', 'word'], ['ket', 'KET 复习 20 个', '20:35', 'ket'], ['wenyan', '文言文 1 篇', '20:50', 'wenyan'], ['abc', 'ABC Reading 2 本', '21:00'],
  ['bedread', '阅读 20 分钟', '21:30']];
const LIGHT = ['listen2', 'math', 'abc'];   // 有晚课的晚上这几项可以不做
const MORNING = {school: '07:30', sat: '08:30', sun: '08:30', rest: '09:00'};
const ROUTINE = Object.fromEntries(Object.entries(MORNING).map(([k, t]) => [k, [['listen', '听力：英文动画', t], ...EVENING]]));
function dayKind(date) {
  const s = (CFG.sched || {})[date] || {}, wd = isoWeekday(date), vac = CFG.vac;
  if (s.h) return 'rest';
  if (s.w) return 'school';
  if (wd === 6) return 'sat';
  if (wd === 7) return 'sun';
  if (vac && date >= vac[0] && date <= vac[1]) return 'rest';
  return 'school';
}
function holidayName(date) { return ((CFG && CFG.sched || {})[date] || {}).h || ''; }
function tasksFor(date) {
  if (!CFG) return [];
  if (CFG.sched) {
    const s = CFG.sched[date] || {};
    const kind = dayKind(date);
    const cls = (s.c || []).map(([label, time], k) => ({id: 'c' + k, label, time: time || '', type: 'class'}));
    const nightClass = cls.some(c => c.time >= '17:00');
    const base = ROUTINE[kind].map(t => ({id: t[0], label: t[1], time: t[2], type: t[3] || '', opt: nightClass && LIGHT.includes(t[0])}));
    const extra = [];
    if (kind !== 'school') extra.push({id: 'sport', label: '户外 / 篮球 1 小时', time: '16:00', type: 'bonus', opt: true});
    if (kind === 'sat') extra.push({id: 'ewrite', label: '英文小作文 3～5 句', time: '17:30', type: 'bonus', opt: true});
    if (kind === 'sun') extra.push({id: 'dict', label: '拼写听写（程序念中文）', time: '17:00', type: 'dict'}, {id: 'goodsent', label: '好句积累：抄 2 句、仿写 1 句', time: '17:20', type: 'bonus', opt: true});
    return base.concat(cls, extra).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
  }
  let lst = (CFG.dates || {})[date];
  if (!lst) { lst = CFG.weekday[String(isoWeekday(date))]; while (typeof lst === 'string') lst = CFG.weekday[lst]; }
  return (lst || []).map(t => ({id: t[0], label: t[1], time: t[2], type: t[3] || ''}));
}
function star(key, amount, date, note) { DATA.stars[key] = {key, amount, date, note, at: Date.now()}; }
function unstar(key) { delete DATA.stars[key]; }
function dayProgress(date) {
  const tasks = tasksFor(date).filter(t => !t.opt || (DATA.taskDone[date] || {})[t.id]), done = DATA.taskDone[date] || {};
  return [tasks.filter(t => done[t.id]).length, tasks.length];
}
const CORE = ['word', 'ket', 'listen', 'reading', 'bedread'];   // 必做：做完就解锁当天奖励
const PASS = 16;                                          // 单词自测对 16 个才算背完
function coreTasks(date) { const ts = tasksFor(date), c = ts.filter(t => CORE.includes(t.id)); return c.length ? c : ts; }
function coreProgress(date) { const done = DATA.taskDone[date] || {}, c = coreTasks(date); return [c.filter(t => done[t.id]).length, c.length]; }
function refreshBonus(date) {
  const [n, total] = dayProgress(date);
  if (total && n === total) star('bonus:' + date, 3, date, '全部完成奖励'); else unstar('bonus:' + date);
}
function currentCard() {
  for (const c of CARDS) if (!DATA.wordLearn[c.day]) return c.day;
  return null;
}
function learnedOn(date) { for (const [day, d] of Object.entries(DATA.wordLearn)) if (d === date) return +day; return null; }
function reviewsDue(date) {
  const out = [];
  const days = Object.keys(DATA.wordLearn).map(Number).sort((a, b) => a - b);
  for (const day of days) {
    const ld = DATA.wordLearn[day];
    for (const stage of STAGES) {
      const due = addDays(ld, REVIEW_OFFSETS[stage]);
      const doneDate = DATA.wordReview[day + ':' + stage];
      if (doneDate) { if (doneDate === date) out.push({day, stage, name: REVIEW_NAMES[stage], due, done: true}); continue; }
      if (due <= date) out.push({day, stage, name: REVIEW_NAMES[stage], due, done: false, late: diffDays(date, due)});
      break;
    }
  }
  return out;
}
function wenyanWeek(date) { return WY_SCHED.find(b => b.start <= date && date <= b.end) || null; }
function wyChecks(i) { return [0, 1, 2, 3, 4].filter(k => DATA.wenyan[i + ':' + k]); }
function coreFull(date) { const [n, t] = coreProgress(date); return t > 0 && n === t; }
function streak(date) {
  const start = CFG ? CFG.start_date : date;
  let d = coreFull(date) ? date : addDays(date, -1), s = 0;
  while (d >= start && coreFull(d)) { s++; d = addDays(d, -1); }
  return s;
}
function testBest(day) { return ((DATA.wordTest || {})[day] || {}).best || 0; }
function earned() { return Object.values(DATA.stars).reduce((a, s) => a + s.amount, 0); }
function balance() { return earned() - DATA.redeem.reduce((a, r) => a + r.cost, 0); }

const LOCAL = {
  'GET /api/today'(q) {
    const date = q.date || todayStr();
    const done = DATA.taskDone[date] || {};
    const lt = learnedOn(date), cur = lt || currentCard(), wk = wenyanWeek(date);
    return {date, weekday: isoWeekday(date), tasks: tasksFor(date).map(t => ({...t, done: !!done[t.id]})),
      card: {day: cur, topics: cur ? CARDS[cur - 1].topics : '', learned_today: !!lt, total: CARDS.length},
      reviews: reviewsDue(date),
      wenyan: {week: wk, items: (wk ? wk.idxs : []).map(i => ({idx: i, t: WENYAN[i].t, checks: wyChecks(i)}))},
      stars: balance(), streak: streak(date)};
  },
  'POST /api/task'(b) {
    const {date, task, done} = b; const t = tasksFor(date).find(x => x.id === task);
    if (!t) return {error: 'no such task'};
    const today = todayStr();
    if (date > today) return {error: '不能提前打卡哦'};
    if (date < addDays(today, -1) && String(b.pin) !== String(pin())) return {error: 'needpin'};
    if (done && t.type === 'ket' && !ketDoneOn(date)) return {error: 'needket'};
    if (done && t.type === 'dict' && !(((DATA.dict || {})[date] || {}).done)) return {error: 'needdict'};
    if (done && t.type === 'word' && !learnedOn(date)) {
      const cur = currentCard();
      if (cur && testBest(cur) < PASS) return {error: 'needtest', day: cur};
    }
    DATA.taskDone[date] = DATA.taskDone[date] || {};
    if (done) {
      DATA.taskDone[date][task] = Date.now();
      star(`task:${date}:${task}`, t.type === 'word' ? 2 : 1, date, t.label);
      if (t.type === 'word' && !learnedOn(date)) { const cur = currentCard(); if (cur) DATA.wordLearn[cur] = date; }
    } else {
      delete DATA.taskDone[date][task]; unstar(`task:${date}:${task}`);

function b64decodeUtf8(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const bin = atob(s), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function applySetupCode(text) {
  const m = String(text || '').trim().match(/setup=([A-Za-z0-9_\-]+)/);
  if (!m) return false;
  try {
    const cfg = JSON.parse(b64decodeUtf8(m[1]));
    if (!cfg.weekday && !cfg.sched && !cfg.listenLinks) return false;
    if (cfg.listenLinks) {
      const have = new Set(listenLinks().map(l => l.url));
      cfg.listenLinks.forEach(l => { if (!have.has(l.url)) { listenLinks().push(l); have.add(l.url); } });
      delete cfg.listenLinks; save();
    }
    if (cfg.weekday || cfg.sched) { CFG = cfg; lsSet(LS_CFG, cfg); ensureRewards(); }
    return true;
  } catch (e) { return false; }
}
function applySetupFromHash() {
  if (!/^#setup=/.test(location.hash)) return false;
  const ok = applySetupCode(location.hash);
  history.replaceState(null, '', location.pathname);
  if (!ok) alert('设置链接不完整，请重新复制');
  return ok;
}
function backupDue() {
  if (!Object.keys(DATA.taskDone).length) return false;

}

function importBackup(text) {

  if (o.kind !== 'study-backup' || !o.data) throw new Error('不是学习打卡的备份文件');
  DATA = o.data; DATA.claims = DATA.claims || {}; if (o.cfg) { CFG = o.cfg; lsSet(LS_CFG, CFG); } save();
}

  if (!CFG || !CFG.k || !(window.crypto && crypto.subtle)) return false;
  try {
    const r = await fetch('sched.enc?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) return false;
    const buf = new Uint8Array(await r.arrayBuffer());
    const raw = Uint8Array.from(atob(CFG.k.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: buf.slice(0, 12)}, key, buf.slice(12));
    const o = JSON.parse(new TextDecoder().decode(plain));
    if (!o.sched || (CFG.synced && o.synced <= CFG.synced)) return false;
    CFG.sched = o.sched; CFG.synced = o.synced; if (o.vac) CFG.vac = o.vac; if (o.start) CFG.start_date = o.start;
    lsSet(LS_CFG, CFG); return true;
  } catch (e) { return false; }
}

/* ---------- 周日拼写听写：KET 生词 + 本周 PET 单词随机，最多 25 个 ---------- */
function dictList(date) {
  DATA.dict = DATA.dict || {};
  if (DATA.dict[date]) return DATA.dict[date].items;
  const mon = addDays(date, 1 - isoWeekday(date));
  const ketW = Object.values(ketState().wrong).map(v => v.item).slice(0, 12);
  const petW = Object.entries(DATA.wordLearn).filter(([, d]) => d >= mon && d <= date).flatMap(([day]) => CARDS[+day - 1].words);
  for (let i = petW.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [petW[i], petW[j]] = [petW[j], petW[i]]; }
  const items = [...ketW, ...petW].filter((w, i, a) => a.findIndex(x => x.w === w.w) === i).slice(0, 25).map(w => ({w: w.w, ipa: w.ipa, zh: w.zh}));
  DATA.dict[date] = {items, res: {}}; save(); return items;
}
LOCAL['POST /api/dict/finish'] = b => {
  const date = todayStr(), d = (DATA.dict || {})[date]; if (!d) return {error: 'no list'};
  d.res = b.res || {}; d.done = true;
  d.items.forEach(w => { if (d.res[w.w] === 0) LOCAL['POST /api/ket/result']({item: w, ok: false}); });
  const t = tasksFor(date).find(x => x.type === 'dict');
  if (t) { DATA.taskDone[date] = DATA.taskDone[date] || {}; DATA.taskDone[date][t.id] = Date.now(); star(`task:${date}:${t.id}`, 2, date, '拼写听写'); refreshBonus(date); }
  save(); return {ok: true, wrong: Object.values(d.res).filter(v => v === 0).length};
};

const recState = {on: false, url: null, rec: null};
async function toggleRec() {
  if (recState.on) { try { recState.rec.stop(); } catch (e) {} return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({audio: true});
    const mime = window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
    const rec = new MediaRecorder(s, mime ? {mimeType: mime} : undefined), chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => { s.getTracks().forEach(t => t.stop()); recState.on = false; recState.url = URL.createObjectURL(new Blob(chunks, {type: rec.mimeType || 'audio/mp4'})); toast('录好了，点「听听我说的」'); render(); };
    recState.rec = rec; recState.on = true; rec.start(); render(); toast('开始录，用英语说吧');
  } catch (e) { recState.on = false; toast('用不了麦克风：请在设置里允许，或直接说给家长听'); }
}

const kbHint = lang => lang === 'zh' ? '点键盘右下角的 🎤 说中文' : '点 🌐 切到英文键盘，再点右下角 🎤 说英文';

/* 输入框停顿 1.5 秒自动提交（键盘听写说完会自动停） */
function autoSubmit(inp, fn) {
  let t; inp.oninput = () => { clearTimeout(t); t = setTimeout(() => { const v = inp.value.trim(); if (v) fn(v); }, 1500); };
  inp.onkeydown = e => { if (e.key === 'Enter') { clearTimeout(t); const v = inp.value.trim(); if (v) fn(v); } };
}
function listen(lang) {
  return new Promise((res, rej) => {
    if (!SR) return rej('nosupport');
    let r; try { r = new SR(); } catch (e) { return rej('nosupport'); }
    r.lang = lang; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    let got = false;
    r.onresult = e => { got = true; res([...e.results[0]].map(x => x.transcript)); };
    r.onerror = e => rej(e.error || 'error');
    r.onend = () => { if (!got) rej('nospeech'); };
    try { r.start(); } catch (e) { return rej('nosupport'); }
    setTimeout(() => { try { r.stop(); } catch (e) {} }, 7000);
  });
}
const normZh = s => String(s).replace(/[（(].*?[）)]/g, '').replace(/[^一-龥]/g, '');
function zhSenses(zh) { return zh.replace(/[（(].*?[）)]/g, '').split(/[，,；;、/\s]+|或/).map(normZh).filter(Boolean); }
function judgeZh(alts, zh) {
  const senses = zhSenses(zh);
  const bi = m => m.length < 2 ? [m] : [...Array(m.length - 1)].map((_, k) => m.slice(k, k + 2));
  return alts.some(a => { const s = normZh(a); return s && senses.some(m => s.includes(m) || (s.length >= 2 && m.includes(s)) || bi(m).some(b => b.length === 2 && s.includes(b))); });
}
const lettersOf = s => String(s).toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z]/g, '');
const variants = w => { const b = lettersOf(w.split(/\s*\/\s*| or /)[0]); return [b, b.replace(/is(e|ed|ing|ation)/g, 'iz$1'), b.replace(/our/g, 'or'), b.replace(/tre$/, 'ter')]; };
function judgeEn(alts, word) {
  const vs = variants(word);
  for (const a of alts) {
    const spoken = String(a).trim();
    const letters = lettersOf(spoken);
    const isSpelled = /^([a-z][\s\-.,]+){2,}[a-z]\W*$/i.test(spoken);   // "a p o l o g i s e" / "a-p-o-l…"
    if (vs.includes(letters)) return isSpelled ? 'spell' : 'say';
  }
  return false;
}

/* 朗读纠音：网页朗读不能指定读音，只在送去朗读的文字里把易错多音字换成同音常用字，屏幕显示不变 */
const TTS_FIX = {
  '司马光': [['没水中', '莫水中']],
  '守株待兔': [['为宋国笑', '维宋国笑']],
  '精卫填海': [['少女', '绍女']],
  '囊萤夜读': [['盛数十', '成数十']],
  '铁杵成针': [['还卒业', '环足业']],
  '古人谈读书': [['好学', '浩学'], ['识之', '志之'], ['是知也', '是智也']],
  '少年中国说（节选）': [['干将', '甘江'], ['发硎', '发形'], ['矞矞', '玉玉'], ['翕张', '吸张'], ['鹰隼', '鹰损'], ['鳞爪', '鳞找']],
  '自相矛盾': [['鬻', '玉'], ['夫不可陷', '扶不可陷']],
  '杨氏之子': [['为设果', '位设果'], ['聪惠', '聪慧']],
  '伯牙鼓琴': [['汤汤', '伤伤'], ['锺', '钟'], ['为鼓琴者', '位鼓琴者']],
  '书戴嵩画牛': [['处士', '楚士'], ['好书画', '浩书画'], ['曝', '瀑']],
  '学弈': [['为是其智弗若与', '位是其智弗若于'], ['缴', '酌'], ['鹄', '胡']],
};
const ttsText = (t, s) => (TTS_FIX[t] || []).reduce((x, [f, r]) => x.split(f).join(r), s);

async function wenyanDetail(i) {
  const w = await api('/api/wenyan/' + i);
  const plain = w.read.replace(/[\/\n]/g, '');
  const read = w.read.split('\n').map(line => `<p class="wy-read kai">${line.split('/').map(esc).join('<span class="p">/</span>')}</p>`).join('');
  let x = `<button class="btn soft sm" style="margin-top:8px" id="back">‹ 全部篇目</button>
    <h1 class="kai wy-title">${esc(w.t)}</h1><div class="sub">${esc(w.g)} · ${esc(w.s)}</div>
    <div class="card"><div class="faint" style="margin-bottom:6px">背诵打卡</div>${w.stages.map((s, k) => `<span class="pill ${w.checks.includes(k) ? 'on' : ''}" data-st="${k}">${w.checks.includes(k) ? '✓ ' : ''}${s}</span>`).join('')}</div>

      <div style="margin-top:8px">${read}</div></div>

    <div class="card" style="padding:4px 18px">${w.lines.map(([a, b, c]) => `<div class="line"><div class="o kai">${esc(a)}</div><div class="t">${esc(c)}</div>${b ? `<div class="k">${esc(b)}</div>` : ''}</div>`).join('')}</div>
    <div class="card" style="background:var(--ok-soft)"><b>记忆窍门</b><div style="margin-top:4px">${esc(w.tip)}</div><b style="display:block;margin-top:10px">这篇告诉我们</b><div style="margin-top:4px">${esc(w.moral)}</div></div>`;
  app.innerHTML = x;
  $('#back').onclick = () => { try { speechSynthesis.cancel(); } catch (e) {} state.wy = null; render(); };
  $('#sayO').onclick = () => speakQueue([[ttsText(w.t, plain), 'zh-CN', .75]]);
  $('#sayT').onclick = () => speakQueue(w.lines.map(l => [l[2], 'zh-CN', .9]));
  $('#sayB').onclick = () => speakQueue(w.lines.flatMap(l => [[ttsText(w.t, l[0]), 'zh-CN', .72], [l[2], 'zh-CN', .92]]));
  $('#sayStop').onclick = () => { try { speechSynthesis.cancel(); } catch (e) {} };
  $$('[data-st]').forEach(el => el.onclick = async () => {
    const k = +el.dataset.st, on = !w.checks.includes(k);
    await api('/api/wenyan/check', {idx: i, stage: k, done: on}); if (on) toast(k === 2 ? '背会了！成长大奖 +1 🎁' : '打卡 +1⭐'); render();
  });
}

} else {
  if (setupOk) setTimeout(() => toast('设置成功！可以开始打卡了'), 300);
  const h0 = location.hash.slice(1), mw = h0.match(/^wy(\d+)$/);
  if (mw) { state.wy = +mw[1]; go('wenyan'); }
  else if (/^words-(zh|en)$/.test(h0)) { state.mode = h0.slice(6); go('words'); }
  else if (['today', 'words', 'wenyan', 'rewards', 'parent', 'media'].includes(h0)) go(h0); else render();
}
let lastDay = todayIso();
function dayCheck() {
  const t = todayIso();
  if (t !== lastDay) { lastDay = t; state.date = t; quiz = {}; if (CFG) render(); }
}
syncSchedule().then(ch => { if (ch) { toast('课表已自动更新'); render(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncSchedule().then(ch => { if (ch) { toast('课表已自动更新'); render(); } }); dayCheck(); if (CFG && state.view === 'today' && !document.querySelector('.sheet-bg')) render(); } });
setInterval(dayCheck, 60000);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
