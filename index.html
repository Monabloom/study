om", "ipa": "/frɒm/", "zh": "从"}, {"w": "off", "ipa": "/ɒf/", "zh": "离开，关闭"}, {"w": "on", "ipa": "/ɒn/", "zh": "在上面"}, {"w": "otherwise", "ipa": "/ˈʌðərwaɪz/", "zh": "否则，另外"}, {"w": "ought", "ipa": "/ɔːt/", "zh": "应该"}, {"w": "regarding", "ipa": "/rɪˈɡɑːrdɪŋ/", "zh": "关于"}, {"w": "shall", "ipa": "/ʃæl/", "zh": "将（表示未来的助动词）"}, {"w": "should", "ipa": "/ʃʊd/", "zh": "应该"}, {"w": "so", "ipa": "/soʊ/", "zh": "那么"}]}, {"day": 89, "topics": "连接词、介词与情态词", "words": [{"w": "than", "ipa": "/ðæn/", "zh": "比"}, {"w": "therefore", "ipa": "/ˈðɛrˌfɔːr/", "zh": "因此"}, {"w": "though", "ipa": "/ðoʊ/", "zh": "虽然"}, {"w": "together", "ipa": "/təˈɡɛðər/", "zh": "一起"}, {"w": "unless", "ipa": "/ʌnˈlɛs/", "zh": "除非"}, {"w": "whether", "ipa": "/ˈwɛðər/", "zh": "是否"}, {"w": "will", "ipa": "/wɪl/", "zh": "将，愿意"}, {"w": "would", "ipa": "/wʊd/", "zh": "将，会"}, {"w": "face-to-face", "ipa": "/ˈfeɪs tu ˈfeɪs/", "zh": "面对面的"}, {"w": "according to", "ipa": "/əˈkɔːrdʒɪŋ tuː/", "zh": "根据"}, {"w": "apart from", "ipa": "/əˈpɑːrt frəm/", "zh": "除了"}, {"w": "as long as", "ipa": "/æz lɒŋ æz/", "zh": "只要"}, {"w": "as well (as)", "ipa": "/æz wel æz/", "zh": "也，同样"}, {"w": "at all", "ipa": "/æt ɔːl/", "zh": "根本，究竟"}, {"w": "at least", "ipa": "/æt liːst/", "zh": "至少"}, {"w": "because of", "ipa": "/bɪˈkɒz əv/", "zh": "因为"}, {"w": "by hand", "ipa": "/baɪ hænd/", "zh": "手工"}, {"w": "by mistake", "ipa": "/baɪ maɪˈsteɪk/", "zh": "错误地"}, {"w": "by name", "ipa": "/baɪ neɪm/", "zh": "以名字"}, {"w": "due to", "ipa": "/djuː tuː/", "zh": "由于"}]}, {"day": 90, "topics": "连接词、介词与情态词", "words": [{"w": "even though", "ipa": "/ˌiːvən ðoʊ/", "zh": "即使"}, {"w": "face to face", "ipa": "/feɪs tu feɪs/", "zh": "面对面地"}, {"w": "in fact", "ipa": "/ɪn fækt/", "zh": "事实上"}, {"w": "in order", "ipa": "/ɪn ˈɔːrdər/", "zh": "有序"}, {"w": "in order to", "ipa": "/ɪn ˈɔːrdər tuː/", "zh": "为了"}, {"w": "in the end", "ipa": "/ɪn ðə ɛnd/", "zh": "最后"}, {"w": "instead (of)", "ipa": "/ɪnˈstɛd əv/", "zh": "代替"}, {"w": "on purpose", "ipa": "/ɒn ˈpɜːrpəs/", "zh": "故意地"}, {"w": "out of date", "ipa": "/ˌaʊt əv deɪt/", "zh": "过时的"}, {"w": "out of order", "ipa": "/ˌaʊt əv ˈɔːrdər/", "zh": "出故障的"}, {"w": "up to date", "ipa": "/ʌp tuː deɪt/", "zh": "最新的"}]}], "wenyan": [{"t": "司马光", "g": "三年级上册", "s": "《宋史·司马光传》（课本据此改写）", "read": "群儿/戏于庭，一儿/登瓮，足跌/没水中。众/皆弃去，光/持石/击瓮/破之，水迸，儿/得活。", "hard": "瓮 wèng　没 mò　迸 bèng", "lines": [["群儿戏于庭，", "戏：玩耍。庭：庭院。", "一群小孩在庭院里玩耍。"], ["一儿登瓮，足跌没水中。", "瓮：口小肚大的大缸。跌：失足。没（mò）：沉没、淹没。", "一个小孩爬上大缸，失足掉进缸里，被水淹没了。"], ["众皆弃去，", "皆：都。弃去：丢下他跑开。", "其他小孩都丢下他跑了。"], ["光持石击瓮破之，", "持：拿着。", "司马光拿起石头砸缸，把缸砸破了，"], ["水迸，儿得活。", "迸：涌出。", "水涌了出来，落水的小孩得救了。"]], "tip": "一个动作一个字，连起来就是整篇：戏 → 登 → 跌 → 弃 → 击 → 迸 → 活", "moral": "遇到危险不慌张，冷静想办法。"}, {"t": "守株待兔", "g": "三年级下册", "s": "《韩非子·五蠹》", "read": "宋人/有耕者。田中/有株，兔走/触株，折颈/而死。因/释其耒/而守株，冀/复得兔。兔/不可复得，而身/为宋国笑。", "hard": "株 zhū　耒 lěi　冀 jì", "lines": [["宋人有耕者。", "耕：耕田、种地。", "宋国有个种田的人。"], ["田中有株，兔走触株，折颈而死。", "株：露出地面的树桩。走：跑。触：撞。", "他的田里有个树桩，一只兔子跑过来撞到树桩上，折断脖子死了。"], ["因释其耒而守株，冀复得兔。", "因：于是。释：放下。耒（lěi）：古代翻土的农具。冀（jì）：希望。复：再。", "于是他放下农具，守在树桩旁边，希望再捡到兔子。"], ["兔不可复得，而身为宋国笑。", "身：他自己。为……笑：被……嘲笑。", "兔子不可能再捡到了，他自己却被宋国人当成了笑话。"]], "tip": "耕 → 株 → 触 → 死 → 释 → 守 → 冀 → 笑", "moral": "偶然的好运不会天天有，想要收获就得靠自己努力。"}, {"t": "精卫填海", "g": "四年级上册", "s": "《山海经·北山经》", "read": "炎帝之/少女，名曰/女娃。女娃/游于东海，溺/而不返，故/为精卫。常/衔西山之/木石，以/堙于东海。", "hard": "溺 nì　衔 xián　堙 yīn", "lines": [["炎帝之少女，名曰女娃。", "少女：小女儿。曰：叫做。", "炎帝的小女儿，名叫女娃。"], ["女娃游于东海，溺而不返，", "溺（nì）：淹没、淹死。返：回来。", "女娃到东海游玩，淹死在海里，再也没能回来，"], ["故为精卫。", "故：所以。为：变成。", "所以变成了精卫鸟。"], ["常衔西山之木石，以堙于东海。", "衔：用嘴叼着。堙（yīn）：填塞。", "她常常叼着西山上的树枝和石子，用来填塞东海。"]], "tip": "按\"谁 → 出了什么事 → 变成什么 → 做什么\"背：炎帝少女 → 溺 → 精卫 → 衔木石，堙东海", "moral": "精卫鸟意志坚定、不怕困难，再难的事也坚持去做。"}, {"t": "王戎不取道旁李", "g": "四年级上册", "s": "《世说新语·雅量》", "read": "王戎/七岁，尝/与诸小儿/游。看/道边李树/多子/折枝，诸儿/竞走/取之，唯/戎不动。人/问之，答曰：“树/在道边/而多子，此/必苦李。”取之，信然。", "hard": "尝 cháng　诸 zhū　竞 jìng", "lines": [["王戎七岁，尝与诸小儿游。", "尝：曾经。诸：众多。游：玩耍。", "王戎七岁的时候，曾经和许多小孩一起玩。"], ["看道边李树多子折枝，", "子：果实。折枝：把树枝都压弯了。", "他们看见路边的李树结了很多李子，把树枝都压弯了，"], ["诸儿竞走取之，唯戎不动。", "竞走：争着跑过去。唯：只有。", "小孩们争着跑去摘，只有王戎站着不动。"], ["人问之，答曰：“树在道边而多子，此必苦李。”", "此：这。", "有人问他为什么不去，他回答：“李树长在路边，还结了这么多果子，这一定是苦李子。”"], ["取之，信然。", "信然：确实如此。", "摘来一尝，果然是这样。"]], "tip": "看 → 竞走取 → 唯戎不动 → 问 → 答（道边、多子、苦李）→ 信然", "moral": "遇事先观察、动脑想，不盲目跟着别人跑。"}, {"t": "囊萤夜读", "g": "四年级下册", "s": "《晋书·车胤传》", "read": "胤/恭勤不倦，博学/多通。家贫/不常得油，夏月/则练囊/盛数十萤火/以照书，以夜/继日焉。", "hard": "胤 yìn　囊 náng　萤 yíng　盛 chéng　数 shù", "lines": [["胤恭勤不倦，博学多通。", "胤：车胤，晋朝人。恭勤：谦逊勤奋。倦：疲倦。通：通晓。", "车胤谦逊勤奋，从不疲倦，知识广博，懂得很多学问。"], ["家贫不常得油，", "油：点灯用的油。", "家里穷，不能经常有灯油点灯。"], ["夏月则练囊盛数十萤火以照书，", "夏月：夏天。练囊：白绢做的袋子。盛（chéng）：装。", "夏天，他就用白绢袋装几十只萤火虫，用来照着读书，"], ["以夜继日焉。", "以夜继日：夜晚接着白天，指日夜不停。焉：语气词。", "白天晚上都不停地学习。"]], "tip": "先说人（恭勤、博学）→ 再说难（家贫无油）→ 最后说办法（练囊盛萤，以夜继日）", "moral": "条件再艰苦，只要肯想办法，也能坚持学习。"}, {"t": "铁杵成针", "g": "四年级下册", "s": "宋·祝穆《方舆胜览·眉州》", "read": "磨针溪，在/眉州/象耳山下。世传/李太白/读书山中，未成，弃去。过/是溪，逢/老媪/方磨铁杵，问之，曰：“欲作针。”太白/感其意，还/卒业。媪/自言姓武。今/溪旁/有武氏岩。", "hard": "媪 ǎo　杵 chǔ　还 huán　卒 zú", "lines": [["磨针溪，在眉州象耳山下。", "眉州：在今四川眉山。", "磨针溪在眉州的象耳山下。"], ["世传李太白读书山中，未成，弃去。", "世传：世代相传。李太白：李白，字太白。弃去：放弃离开。", "相传李白在山中读书，学业还没完成，就放弃离开了。"], ["过是溪，逢老媪方磨铁杵，", "是：这。逢：遇到。媪（ǎo）：老妇人。方：正在。杵（chǔ）：棒槌。", "他经过这条小溪，遇见一位老奶奶正在磨一根铁棒，"], ["问之，曰：“欲作针。”", "欲：想要。", "李白问她在做什么，老奶奶说：“想把它磨成一根针。”"], ["太白感其意，还卒业。", "感：被……感动。还（huán）：回去。卒（zú）业：完成学业。", "李白被她的毅力感动，回到山中完成了学业。"], ["媪自言姓武。今溪旁有武氏岩。", "", "老奶奶说自己姓武。现在溪边还有一块“武氏岩”。"]], "tip": "地点（磨针溪）→ 李白弃学 → 遇媪磨杵 → 问答 → 感其意，还卒业 → 武氏岩", "moral": "只要功夫深，铁杵磨成针。做事要坚持，不能半途而废。"}, {"t": "古人谈读书", "g": "五年级上册", "s": "前三则出自《论语》；第四则出自宋·朱熹《训学斋规》", "read": "子曰：“敏/而好学，不耻/下问。”\n子曰：“知之/为知之，不知/为不知，是/知也。”\n子曰：“默/而识之，学/而不厌，诲人/不倦。”\n余/尝谓，读书/有三到，谓/心到，眼到，口到。心/不在此，则眼/不看仔细，心眼/既不专一，却只/漫浪诵读，决/不能记，记/亦不能久也。三到之中，心到/最急。心/既到矣，眼口/岂不到乎？", "hard": "好 hào　识 zhì　诲 huì　岂 qǐ", "lines": [["子曰：“敏而好学，不耻下问。”", "子：孔子。敏：聪明。好（hào）：喜爱。耻：以……为羞耻。下问：向不如自己的人请教。", "孔子说：“聪明又爱学习，不把向不如自己的人请教当成丢脸的事。”"], ["子曰：“知之为知之，不知为不知，是知也。”", "为：是。是：这。知：同“智”，智慧。", "孔子说：“知道就是知道，不知道就是不知道，这才是真正的智慧。”"], ["子曰：“默而识之，学而不厌，诲人不倦。”", "识（zhì）：记住。厌：满足。诲：教导。", "孔子说：“把学到的默默记在心里，学习从不满足，教别人从不厌倦。”"], ["余尝谓，读书有三到，谓心到，眼到，口到。", "余：我。尝：曾经。谓：说。", "我曾经说过，读书要做到“三到”：心到、眼到、口到。"], ["心不在此，则眼不看仔细，", "此：这里，指书本。", "心思不在书上，眼睛就不会看仔细，"], ["心眼既不专一，却只漫浪诵读，", "漫浪：随随便便。", "心和眼都不专注，只是随随便便地读，"], ["决不能记，记亦不能久也。", "决：一定。亦：也。", "一定记不住，就算记住了也记不长久。"], ["三到之中，心到最急。", "急：要紧。", "三到之中，心到最要紧。"], ["心既到矣，眼口岂不到乎？", "岂：难道。", "心已经到了，眼睛和嘴难道还会不到吗？"]], "tip": "孔子三句各抓一个字：敏（好学）→ 知（实事求是）→ 默（记住、不厌、不倦）；朱熹一段抓“三到，心到最急”", "moral": "读书要谦虚好学、实事求是，最要紧的是专心。"}, {"t": "少年中国说（节选）", "g": "五年级上册", "s": "梁启超（半文言）", "read": "故/今日之责任，不在他人，而全在/我少年。少年智/则国智，少年富/则国富；少年强/则国强，少年独立/则国独立；少年自由/则国自由；少年进步/则国进步；少年胜于欧洲，则国/胜于欧洲；少年雄于地球，则国/雄于地球。\n红日初升，其道/大光。河出伏流，一泻/汪洋。潜龙/腾渊，鳞爪/飞扬。乳虎/啸谷，百兽/震惶。鹰隼/试翼，风尘/翕张。奇花/初胎，矞矞/皇皇。干将/发硎，有作/其芒。天戴/其苍，地履/其黄。纵有/千古，横有/八荒。前途/似海，来日/方长。\n美哉/我少年中国，与天/不老！壮哉/我中国少年，与国/无疆！", "hard": "隼 sǔn　翕 xī　矞 yù　干将 gān jiāng　硎 xíng　履 lǚ", "lines": [["故今日之责任，不在他人，而全在我少年。", "故：所以。", "所以今天的责任，不在别人身上，全在我们少年身上。"], ["少年智则国智，少年富则国富；少年强则国强，少年独立则国独立；少年自由则国自由；少年进步则国进步；", "智：聪明。则：就。", "少年聪明，国家就聪明；少年富裕，国家就富裕；少年强大，国家就强大；少年独立，国家就独立；少年自由，国家就自由；少年进步，国家就进步；"], ["少年胜于欧洲，则国胜于欧洲；少年雄于地球，则国雄于地球。", "胜于：胜过。雄：称雄。", "少年胜过欧洲，国家就胜过欧洲；少年称雄世界，国家就称雄世界。"], ["红日初升，其道大光。", "道：道路。", "红日刚刚升起，前方的道路一片光明。"], ["河出伏流，一泻汪洋。", "伏流：地下的水流。汪洋：宽广的水面。", "黄河从地下奔涌而出，一泻千里，浩浩荡荡。"], ["潜龙腾渊，鳞爪飞扬。", "潜龙：潜藏的龙。渊：深水。", "潜藏的龙从深渊中腾跃而起，鳞片和爪子舞动飞扬。"], ["乳虎啸谷，百兽震惶。", "乳虎：小老虎。啸：吼叫。震惶：震惊害怕。", "小老虎在山谷中吼叫，所有野兽都感到害怕。"], ["鹰隼试翼，风尘翕张。", "隼（sǔn）：一种猛禽。试翼：展翅试飞。翕（xī）张：收拢和张开。", "雄鹰展翅试飞，卷起漫天风沙。"], ["奇花初胎，矞矞皇皇。", "初胎：刚孕育出花苞。矞矞（yù）皇皇：繁盛美丽的样子。", "奇异的花刚长出花苞，就显得富丽堂皇。"], ["干将发硎，有作其芒。", "干将（gān jiāng）：古代宝剑名。发硎（xíng）：刚在磨刀石上磨过。芒：锋芒。", "宝剑刚刚磨好，闪着锋利的光芒。"], ["天戴其苍，地履其黄。", "戴：头顶着。履（lǚ）：脚踩着。", "头顶着苍天，脚踩着黄土大地。"], ["纵有千古，横有八荒。", "纵：从时间上说。横：从空间上说。八荒：四面八方遥远的地方。", "从时间看，有悠久的历史；从空间看，有辽阔的疆土。"], ["前途似海，来日方长。", "方：正。", "前途像大海一样宽广，未来的日子还很长。"], ["美哉我少年中国，与天不老！壮哉我中国少年，与国无疆！", "哉：啊。无疆：没有尽头。", "美啊，我的少年中国，将和天一样永不衰老！壮啊，我的中国少年，将和国家一样前程无限！"]], "tip": "分三段背：① “少年X则国X”，依次是智、富、强、独立、自由、进步，再加胜于欧洲、雄于地球；② 七个比喻按顺序：红日 → 河 → 潜龙 → 乳虎 → 鹰隼 → 奇花 → 干将，最后天地、纵横、前途；③ 结尾两句“美哉……壮哉……”", "moral": "少年是国家的希望，要立志做有用的人。"}, {"t": "自相矛盾", "g": "五年级下册", "s": "《韩非子·难一》", "read": "楚人/有鬻盾与矛者，誉之曰：“吾盾之坚，物/莫能陷也。”又誉其矛曰：“吾矛之利，于物/无不陷也。”或曰：“以子之矛，陷/子之盾，何如？”其人/弗能应也。夫/不可陷之盾/与无不陷之矛，不可/同世而立。", "hard": "鬻 yù　弗 fú　夫 fú", "lines": [["楚人有鬻盾与矛者，", "鬻（yù）：卖。", "楚国有个卖盾和矛的人，"], ["誉之曰：“吾盾之坚，物莫能陷也。”", "誉：夸耀。吾：我。莫：没有什么。陷：刺破、穿透。", "他夸自己的盾说：“我的盾非常坚固，没有什么东西能刺穿它。”"], ["又誉其矛曰：“吾矛之利，于物无不陷也。”", "利：锋利。", "又夸他的矛说：“我的矛非常锋利，什么东西都能刺穿。”"], ["或曰：“以子之矛，陷子之盾，何如？”", "或：有人。子：您。何如：怎么样。", "有人问：“用您的矛刺您的盾，会怎么样呢？”"], ["其人弗能应也。", "弗：不。应：回答。", "那个人回答不上来。"], ["夫不可陷之盾与无不陷之矛，不可同世而立。", "夫（fú）：句首语气词。同世而立：同时存在。", "刺不穿的盾和什么都能刺穿的矛，是不可能同时存在的。"]], "tip": "卖 → 夸盾（莫能陷）→ 夸矛（无不陷）→ 有人问 → 答不上 → 结论（不可同世而立）", "moral": "说话做事要前后一致，不能自己打自己的嘴巴。"}, {"t": "杨氏之子", "g": "五年级下册", "s": "《世说新语·言语》", "read": "梁国/杨氏子/九岁，甚/聪惠。孔君平/诣其父，父/不在，乃/呼儿出。为/设果，果/有杨梅。孔/指以示儿曰：“此是/君家果。”儿/应声答曰：“未闻/孔雀/是夫子家禽。”", "hard": "惠 huì　诣 yì", "lines": [["梁国杨氏子九岁，甚聪惠。", "甚：非常。惠：同“慧”，智慧。", "梁国一户姓杨的人家，有个九岁的儿子，非常聪明。"], ["孔君平诣其父，父不在，乃呼儿出。", "诣（yì）：拜访。乃：于是。", "孔君平来拜访孩子的父亲，父亲不在家，于是把孩子叫了出来。"], ["为设果，果有杨梅。", "设：摆放。", "孩子给客人摆上水果，水果里有杨梅。"], ["孔指以示儿曰：“此是君家果。”", "示：给……看。君家：您家。", "孔君平指着杨梅对孩子说：“这是你家的果子。”"], ["儿应声答曰：“未闻孔雀是夫子家禽。”", "应声：随着声音，马上。闻：听说。夫子：对男子的尊称。", "孩子马上回答：“我可没听说过孔雀是您家的鸟。”"]], "tip": "抓住“姓”的玩笑：杨梅 → 杨家的果；孔雀 → 孔家的鸟。客人姓孔，孩子姓杨，一来一回就记住了", "moral": "说话既要机智，也要有礼貌：孩子说“未闻”，没有直接顶撞长辈。"}, {"t": "伯牙鼓琴", "g": "六年级上册", "s": "《吕氏春秋·本味》", "read": "伯牙/鼓琴，锺子期/听之。方鼓琴/而志在太山，锺子期曰：“善哉乎/鼓琴，巍巍乎/若太山。”少选之间/而志在流水，锺子期/又曰：“善哉乎/鼓琴，汤汤乎/若流水。”锺子期死，伯牙/破琴绝弦，终身/不复鼓琴，以为/世无足复/为鼓琴者。", "hard": "锺 zhōng　巍 wēi　汤汤 shāng shāng　少选 shǎo xuǎn", "lines": [["伯牙鼓琴，锺子期听之。", "鼓：弹奏。", "伯牙弹琴，锺子期在一旁听。"], ["方鼓琴而志在太山，", "方：正在。志：心里想的。太山：大山（一说泰山）。", "伯牙弹琴时，心里想着高山，"], ["锺子期曰：“善哉乎鼓琴，巍巍乎若太山。”", "善：好。哉、乎：语气词，相当于“啊”。巍巍：高大的样子。若：像。", "锺子期说：“弹得真好啊！我仿佛看到了巍峨的高山。”"], ["少选之间而志在流水，", "少选：一会儿。", "过了一会儿，伯牙心里又想着流水，"], ["锺子期又曰：“善哉乎鼓琴，汤汤乎若流水。”", "汤汤（shāng shāng）：水流大而急的样子。", "锺子期又说：“弹得真好啊！我仿佛看到了浩荡的流水。”"], ["锺子期死，伯牙破琴绝弦，终身不复鼓琴，", "绝：弄断。终身：一辈子。复：再。", "锺子期死后，伯牙摔破琴、扯断弦，一辈子不再弹琴，"], ["以为世无足复为鼓琴者。", "以为：认为。足：值得。", "他认为世上再也没有值得他为之弹琴的人了。"]], "tip": "两组对称句一起背：志在太山 ↔ 巍巍乎若太山；志在流水 ↔ 汤汤乎若流水。结尾一个动作：破琴绝弦", "moral": "真正懂你的朋友（知音）非常难得，要珍惜。"}, {"t": "书戴嵩画牛", "g": "六年级上册", "s": "宋·苏轼", "read": "蜀中/有杜处士，好书画，所宝/以百数。有/戴嵩《牛》一轴，尤所爱，锦囊/玉轴，常/以自随。一日/曝书画，有一牧童/见之，拊掌/大笑，曰：“此画/斗牛也。牛斗，力/在角，尾/搐入两股间。今/乃掉尾而斗，谬矣！”处士/笑而然之。古语有云：“耕/当问奴，织/当问婢。”不可改也。", "hard": "嵩 sōng　处士 chǔ shì　曝 pù　拊 fǔ　搐 chù　谬 miù　婢 bì", "lines": [["蜀中有杜处士，好书画，所宝以百数。", "蜀：今四川一带。处士（chǔ shì）：不做官的读书人。好（hào）：喜爱。宝：珍藏。以百数：用百来计算，形容很多。", "四川有一位姓杜的处士，喜爱书画，珍藏的书画有好几百件。"], ["有戴嵩《牛》一轴，尤所爱，锦囊玉轴，常以自随。", "戴嵩：唐代画家，擅长画牛。轴：卷轴，一幅画叫一轴。尤：尤其。锦囊玉轴：用锦缎做画套，用玉做画轴。自随：随身带着。", "其中有一幅戴嵩画的《牛》，他特别喜爱，用锦缎做画套、用玉做画轴，常常随身带着。"], ["一日曝书画，有一牧童见之，拊掌大笑，曰：", "曝（pù）：晒。拊（fǔ）掌：拍手。", "有一天他晾晒书画，一个放牛的孩子看见了这幅画，拍着手大笑，说："], ["“此画斗牛也。牛斗，力在角，尾搐入两股间。", "搐（chù）：抽缩、夹紧。股：大腿。", "“这画的是两头牛在打架。牛打架时，力气集中在角上，尾巴紧紧夹在两条后腿中间。"], ["今乃掉尾而斗，谬矣！”", "乃：却。掉尾：摇着尾巴。谬：错误。", "可这画上的牛却摇着尾巴打架，画错了！”"], ["处士笑而然之。", "然：认为……是对的。", "杜处士笑了，认为牧童说得对。"], ["古语有云：“耕当问奴，织当问婢。”不可改也。", "奴：男仆。婢（bì）：女仆。", "古话说：“种地的事应该问种地的男仆，织布的事应该问织布的女仆。”这个道理是不会变的。"]], "tip": "处士爱画（锦囊玉轴）→ 晒画 → 牧童笑 → 指错（力在角，尾在股间，掉尾谬矣）→ 处士然之 → 古语", "moral": "实践出真知，要向真正有经验的人请教；名家也会出错。"}, {"t": "学弈", "g": "六年级下册", "s": "《孟子·告子上》", "read": "弈秋，通国之/善弈者也。使/弈秋/诲二人弈，其一人/专心致志，惟弈秋之为听；一人/虽听之，一心/以为/有鸿鹄将至，思/援弓缴/而射之。虽/与之俱学，弗若之矣。为/是其智/弗若与？曰：非然也。", "hard": "弈 yì　诲 huì　鹄 hú　缴 zhuó　为 wèi　与 yú", "lines": [["弈秋，通国之善弈者也。", "弈：下棋。通国：全国。善：擅长。", "弈秋是全国最擅长下棋的人。"], ["使弈秋诲二人弈，", "使：让。诲：教导。", "让弈秋教两个人下棋，"], ["其一人专心致志，惟弈秋之为听；", "惟弈秋之为听：只听弈秋的教导。", "其中一个人专心致志，只听弈秋讲；"], ["一人虽听之，一心以为有鸿鹄将至，思援弓缴而射之。", "鸿鹄（hú）：天鹅。援：拉。缴（zhuó）：系着丝绳的箭。", "另一个人虽然也在听，心里却一直想着有天鹅要飞过来，想拉弓搭箭去射它。"], ["虽与之俱学，弗若之矣。", "俱：一起。弗若：不如。", "虽然他和前一个人一起学，成绩却不如前一个人。"], ["为是其智弗若与？曰：非然也。", "为（wèi）：因为。是：这。与（yú）：同“欤”，吗。非然：不是这样。", "是因为他的智力不如别人吗？回答是：不是这样的。"]], "tip": "一位老师（弈秋）→ 两个学生：一个“专心致志”，一个“想射鸿鹄”→ 结果“弗若”→ 原因不是“智”", "moral": "学习成绩好坏，关键在专心不专心，不在聪明不聪明。"}, {"t": "两小儿辩日", "g": "六年级下册", "s": "《列子·汤问》", "read": "孔子/东游，见/两小儿/辩斗，问其故。一儿曰：“我以/日始出时/去人近，而/日中时/远也。”一儿/以日初出/远，而/日中时/近也。一儿曰：“日初出/大如车盖，及/日中/则如盘盂，此/不为远者小/而近者大乎？”一儿曰：“日初出/沧沧凉凉，及其/日中/如探汤，此/不为近者热/而远者凉乎？”孔子/不能决也。两小儿/笑曰：“孰为汝/多知乎？”", "hard": "盂 yú　沧 cāng　汤 tāng　孰 shú　汝 rǔ（“孰为汝多知乎”的“为”“知”各版本读音有分歧，以课本注音为准）", "lines": [["孔子东游，见两小儿辩斗，问其故。", "游：游历。辩斗：争辩。故：原因。", "孔子到东方游历，看见两个小孩在争论，就问他们在争什么。"], ["一儿曰：“我以日始出时去人近，而日中时远也。”", "以：认为。去：距离。日中：中午。", "一个小孩说：“我认为太阳刚出来时离人近，中午时离人远。”"], ["一儿以日初出远，而日中时近也。", "", "另一个小孩认为太阳刚出来时离人远，中午时离人近。"], ["一儿曰：“日初出大如车盖，及日中则如盘盂，此不为远者小而近者大乎？”", "车盖：古代车上的篷盖。及：等到。盘盂（yú）：盘子和碗。为：是。", "一个小孩说：“太阳刚出来时大得像车篷，到了中午就小得像个盘子，这不正是远的看起来小、近的看起来大吗？”"], ["一儿曰：“日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？”", "沧沧凉凉：清凉、有点冷。探汤：把手伸进热水里。", "另一个小孩说：“太阳刚出来时凉飕飕的，到了中午热得像把手伸进热水里，这不正是近的热、远的凉吗？”"], ["孔子不能决也。", "决：判断。", "孔子也判断不了谁对谁错。"], ["两小儿笑曰：“孰为汝多知乎？”", "孰：谁。为：说。汝：你。知：同“智”，智慧。", "两个小孩笑着说：“谁说你知识渊博呢？”"]], "tip": "一个看“大小”（车盖 ↔ 盘盂），一个看“冷热”（沧沧凉凉 ↔ 探汤），两人观点正好相反；结尾：孔子不能决，小儿笑", "moral": "学无止境，再有学问的人也有不懂的；不懂就说不懂，这是实事求是。"}, {"t": "咏雪", "g": "初中 · 七年级上册", "s": "《世说新语·言语》", "read": "谢太傅/寒雪日/内集，与儿女/讲论文义。俄而/雪骤，公/欣然曰：“白雪纷纷/何所似？”兄子胡儿曰：“撒盐空中/差可拟。”兄女曰：“未若/柳絮因风起。”公/大笑乐。即公大兄无奕女，左将军/王凝之妻也。", "hard": "骤 zhòu　差 chà　拟 nǐ　奕 yì", "lines": [["谢太傅寒雪日内集，与儿女讲论文义。", "内集：家庭聚会。儿女：子侄辈的年轻人。文义：诗文的意义。", "一个寒冷的下雪天，谢太傅把家里人聚在一起，和子侄们讲论诗文。"], ["俄而雪骤，公欣然曰：“白雪纷纷何所似？”", "俄而：不久，一会儿。骤：急。欣然：高兴的样子。", "不一会儿雪下得紧了，谢太傅高兴地说：“这纷纷扬扬的白雪像什么呢？”"], ["兄子胡儿曰：“撒盐空中差可拟。”", "差：大致。拟：相比。", "他哥哥的儿子胡儿说：“把盐撒在空中，差不多可以相比。”"], ["兄女曰：“未若柳絮因风起。”", "未若：不如。因：凭借。", "他哥哥的女儿说：“不如比作柳絮被风吹得满天飞舞。”"], ["公大笑乐。", "", "谢太傅高兴得笑了起来。"], ["即公大兄无奕女，左将军王凝之妻也。", "即：就是。", "她就是谢太傅大哥谢无奕的女儿谢道韫，左将军王凝之的妻子。"]], "tip": "一问两答：雪像什么？撒盐 vs 柳絮，柳絮更美", "moral": "比喻要贴切又有美感，好句子来自细心观察。"}, {"t": "陈太丘与友期行", "g": "初中 · 七年级上册", "s": "《世说新语·方正》", "read": "陈太丘/与友期行，期日中。过中/不至，太丘/舍去，去后/乃至。元方/时年七岁，门外戏。客问元方：“尊君/在不？”答曰：“待君久/不至，已去。”友人/便怒曰：“非人哉！与人期行，相委而去。”元方曰：“君与家君/期日中。日中/不至，则是/无信；对子/骂父，则是/无礼。”友人惭，下车/引之。元方/入门/不顾。", "hard": "不 fǒu　委 wěi", "lines": [["陈太丘与友期行，期日中。", "期行：约定一同出行。期：约定。日中：正午。", "陈太丘和朋友约好一起出门，约定正午出发。"], ["过中不至，太丘舍去，去后乃至。", "舍去：不再等候就走了。乃：才。", "过了正午朋友还没来，陈太丘就不等他自己走了，他走后朋友才到。"], ["元方时年七岁，门外戏。", "元方：陈太丘的长子陈纪。戏：玩耍。", "元方那年七岁，正在门外玩。"], ["客问元方：“尊君在不？”", "尊君：对别人父亲的尊称。不（fǒu）：同“否”。", "客人问元方：“你父亲在家吗？”"], ["答曰：“待君久不至，已去。”", "", "元方回答说：“等了您很久您都没来，他已经走了。”"], ["友人便怒曰：“非人哉！与人期行，相委而去。”", "相委而去：丢下我走了。委：舍弃。", "朋友就生气地说：“真不是人啊！和别人约好一起走，却丢下别人自己走了。”"], ["元方曰：“君与家君期日中。", "家君：对人称自己的父亲。", "元方说：“您和我父亲约好正午出发。"], ["日中不至，则是无信；对子骂父，则是无礼。”", "信：讲信用。", "正午您没到，这是不讲信用；当着孩子的面骂他父亲，这是没有礼貌。”"], ["友人惭，下车引之。", "惭：感到惭愧。引：拉，牵拉。", "朋友感到惭愧，下车想拉元方的手。"], ["元方入门不顾。", "顾：回头看。", "元方走进家门，连头也不回。"]], "tip": "约 → 等 → 走 → 骂 → 驳（无信、无礼）→ 惭", "moral": "做人要守信、讲礼貌；有理也要说得清楚。"}, {"t": "《论语》十二章", "g": "初中 · 七年级上册", "s": "《论语》", "read": "子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”子曰：“温故而知新，可以为师矣。”子曰：“学而不思则罔，思而不学则殆。”子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”子曰：“知之者不如好之者，好之者不如乐之者。”子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”子曰：“三人行，必有我师焉。择其善者而从之，其不善者而改之。”子在川上曰：“逝者如斯夫，不舍昼夜。”子曰：“三军可夺帅也，匹夫不可夺志也。”子夏曰：“博学而笃志，切问而近思，仁在其中矣。”", "hard": "说 yuè　愠 yùn　省 xǐng　传 chuán　逾 yú　罔 wǎng　殆 dài　箪 dān　好 hào　食 sì　肱 gōng　笃 dǔ", "lines": [["子曰：“学而时习之，不亦说乎？", "时习：按时温习。说（yuè）：同“悦”，愉快。", "孔子说：“学了又按时温习，不也很愉快吗？"], ["有朋自远方来，不亦乐乎？", "", "有志同道合的人从远方来，不也很快乐吗？"], ["人不知而不愠，不亦君子乎？”", "愠（yùn）：生气，恼怒。君子：有德行的人。", "别人不了解我，我却不生气，不也是有德行的君子吗？”"], ["曾子曰：“吾日三省吾身：", "三省（xǐng）：多次反省。", "曾子说：“我每天多次反省自己："], ["为人谋而不忠乎？与朋友交而不信乎？传不习乎？”", "忠：尽心竭力。信：诚信。传：老师传授的知识。", "替别人办事是否尽心？和朋友交往是否诚信？老师传授的知识是否温习了？”"], ["子曰：“吾十有五而志于学，三十而立，四十而不惑，", "有（yòu）：同“又”。立：能自立。不惑：不被迷惑。", "孔子说：“我十五岁立志学习，三十岁能自立，四十岁遇事不再迷惑，"], ["五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”", "耳顺：能听进不同意见。逾：越过。矩：规矩。", "五十岁懂得了天命，六十岁能听得进各种话，七十岁随心所欲也不会越出规矩。”"], ["子曰：“温故而知新，可以为师矣。”", "故：旧的知识。", "孔子说：“温习旧知识能有新体会、新发现，就可以当老师了。”"], ["子曰：“学而不思则罔，思而不学则殆。”", "罔：迷惑。殆：疑惑、危险。", "孔子说：“只学习不思考就会迷惑，只思考不学习就会疑惑。”"], ["子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，", "回：颜回，孔子的学生。箪（dān）：古代盛饭的竹器。", "孔子说：“颜回真是贤德啊！一竹筐饭，一瓢水，住在简陋的小巷里，"], ["人不堪其忧，回也不改其乐。贤哉，回也！”", "堪：能忍受。", "别人都受不了这种苦，颜回却不改变他自得其乐的态度。颜回真是贤德啊！”"], ["子曰：“知之者不如好之者，好之者不如乐之者。”", "好（hào）：喜爱。", "孔子说：“懂得它的人不如喜爱它的人，喜爱它的人不如以它为乐的人。”"], ["子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。", "饭：吃。疏食（sì）：粗粮。肱（gōng）：胳膊。", "孔子说：“吃粗粮，喝冷水，弯起胳膊当枕头，乐趣也就在这里面了。"], ["不义而富且贵，于我如浮云。”", "", "用不正当的手段得来的富贵，对我来说就像天上的浮云一样。”"], ["子曰：“三人行，必有我师焉。", "", "孔子说：“几个人一起走路，其中一定有可以做我老师的人。"], ["择其善者而从之，其不善者而改之。”", "", "我选取他们的优点来学习，看到他们的缺点就反省自己并改正。”"], ["子在川上曰：“逝者如斯夫，不舍昼夜。”", "川：河流。逝者：消逝的时光。斯：这，指河水。", "孔子在河边说：“时光就像这河水一样流去，日夜不停。”"], ["子曰：“三军可夺帅也，匹夫不可夺志也。”", "三军：军队的统称。匹夫：普通人。", "孔子说：“一国军队可以被夺去主帅，一个普通人却不能被夺去志向。”"], ["子夏曰：“博学而笃志，切问而近思，仁在其中矣。”", "笃（dǔ）：坚定。切问：恳切地提问。近思：多想眼前的事。", "子夏说：“广泛地学习，坚定自己的志向，恳切地提问，多思考眼前的事，仁德就在其中了。”"]], "tip": "十二章分三类：学习方法（1、4、5、9）、学习态度（7、10、12）、做人修养（2、3、6、8、11）", "moral": "学习要温习、要思考、要喜欢；做人要反省、要有志向。"}, {"t": "诫子书", "g": "初中 · 七年级上册", "s": "诸葛亮", "read": "夫/君子之行，静/以修身，俭/以养德。非淡泊/无以明志，非宁静/无以致远。夫学/须静也，才/须学也，非学/无以广才，非志/无以成学。淫慢/则不能励精，险躁/则不能治性。年/与时驰，意/与日去，遂成枯落，多不接世，悲守穷庐，将复何及！", "hard": "夫 fú　淫 yín　躁 zào　庐 lú", "lines": [["夫君子之行，静以修身，俭以养德。", "夫（fú）：句首发语词。行：品德、操守。", "君子的品行，是靠内心安静来修养身心，靠节俭来培养品德。"], ["非淡泊无以明志，非宁静无以致远。", "淡泊：不追求名利。明志：明确志向。致远：实现远大目标。", "不看淡名利就无法明确志向，不平和安静就无法实现远大目标。"], ["夫学须静也，才须学也，非学无以广才，非志无以成学。", "广才：增长才干。", "学习必须内心安静，才干必须通过学习获得；不学习就无法增长才干，没有志向就无法学有所成。"], ["淫慢则不能励精，险躁则不能治性。", "淫慢：放纵懈怠。励精：振奋精神。险躁：轻薄浮躁。治性：修养性情。", "放纵懈怠就不能振奋精神，轻薄浮躁就不能修养性情。"], ["年与时驰，意与日去，", "驰：疾行，指消逝。", "年龄随时光飞逝，意志随岁月消磨，"], ["遂成枯落，多不接世，悲守穷庐，将复何及！", "枯落：凋零，比喻人老无用。接世：对社会有益。穷庐：破房子。", "最终像枯叶一样凋落，对社会没有用处，只能悲伤地守着破房子，到那时后悔又怎么来得及！"]], "tip": "静 · 俭 · 学 · 志——四个字记全文；最后一句是“不努力的后果”", "moral": "学习要静下心来、立定志向，时间不等人。"}, {"t": "狼", "g": "初中 · 七年级上册", "s": "蒲松龄《聊斋志异》", "read": "一屠/晚归，担中肉尽，止有剩骨。途中两狼，缀行/甚远。屠惧，投以骨。一狼/得骨止，一狼/仍从。复投之，后狼止/而前狼又至。骨已尽矣，而两狼之并驱/如故。屠大窘，恐/前后受其敌。顾野有麦场，场主/积薪其中，苫蔽成丘。屠乃奔倚其下，弛担/持刀。狼不敢前，眈眈/相向。少时，一狼/径去，其一/犬坐于前。久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又数刀/毙之。方欲行，转视积薪后，一狼/洞其中，意将隧入/以攻其后也。身已半入，止露尻尾。屠/自后断其股，亦毙之。乃悟/前狼假寐，盖以诱敌。狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。", "hard": "缀 zhuì　窘 jiǒng　苫 shàn　弛 chí　眈 dān　瞑 míng　暇 xiá　尻 kāo　黠 xiá", "lines": [["一屠晚归，担中肉尽，止有剩骨。", "屠：屠户。止：同“只”。", "一个屠户晚上回家，担子里的肉卖完了，只剩下骨头。"], ["途中两狼，缀行甚远。", "缀行：紧跟着走。", "路上遇到两只狼，紧跟着他走了很远。"], ["屠惧，投以骨。一狼得骨止，一狼仍从。", "从：跟从。", "屠户害怕了，把骨头扔给狼。一只狼得到骨头停了下来，另一只狼仍然跟着。"], ["复投之，后狼止而前狼又至。", "复：又。", "屠户又扔骨头，后面得到骨头的狼停下了，前面那只狼又跟上来。"], ["骨已尽矣，而两狼之并驱如故。", "并驱：一起追赶。如故：像原来一样。", "骨头已经扔完了，两只狼还像原来一样一起追赶。"], ["屠大窘，恐前后受其敌。", "窘（jiǒng）：困窘，为难。敌：攻击。", "屠户非常为难，怕前后受到狼的攻击。"], ["顾野有麦场，场主积薪其中，苫蔽成丘。", "顾：回头看。积薪：堆积柴草。苫（shàn）蔽：覆盖、遮盖。", "他看见野地里有个打麦场，场主把柴草堆在里面，覆盖成小山一样。"], ["屠乃奔倚其下，弛担持刀。", "弛：放下，卸下。", "屠户就跑过去靠在柴草堆下面，放下担子拿起刀。"], ["狼不敢前，眈眈相向。", "眈眈：注视的样子。", "狼不敢上前，瞪着眼睛朝着屠户。"], ["少时，一狼径去，其一犬坐于前。", "径去：径直走开。犬坐：像狗一样蹲坐。", "过了一会儿，一只狼径直走开了，另一只像狗一样蹲坐在前面。"], ["久之，目似瞑，意暇甚。", "瞑（míng）：闭眼。暇：空闲，悠闲。", "时间久了，那只狼的眼睛好像闭上了，神情很悠闲。"], ["屠暴起，以刀劈狼首，又数刀毙之。", "暴：突然。", "屠户突然跳起来，用刀劈狼的头，又连砍几刀把狼杀死了。"], ["方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。", "洞：打洞。隧：从柴堆中打通道。", "他正要走，转身看柴草堆后面，一只狼正在里面打洞，想要钻进去从背后攻击屠户。"], ["身已半入，止露尻尾。", "尻（kāo）：屁股。", "狼的身子已经钻进去一半，只露出屁股和尾巴。"], ["屠自后断其股，亦毙之。", "股：大腿。", "屠户从后面砍断了狼的大腿，也把它杀死了。"], ["乃悟前狼假寐，盖以诱敌。", "假寐：假装睡觉。盖：原来是。", "屠户这才明白前面那只狼假装睡觉，原来是用来诱惑敌人的。"], ["狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。", "黠（xiá）：狡猾。顷刻：一会儿。几何：多少。", "狼也真狡猾啊，可是一会儿两只都被杀死了，禽兽的欺骗手段能有多少呢？只不过给人增加笑料罢了。"]], "tip": "遇狼 → 惧狼（投骨）→ 御狼（倚薪）→ 杀狼（劈首、断股）→ 议狼", "moral": "面对恶势力不能退让，要敢于斗争、善于斗争。"}, {"t": "穿井得一人", "g": "初中 · 七年级上册", "s": "《吕氏春秋》", "read": "宋之丁氏，家无井/而出溉汲，常一人/居外。及其家穿井，告人曰：“吾穿井/得一人。”有闻而传之者曰：“丁氏穿井/得一人。”国人道之，闻之于宋君。宋君/令人问之于丁氏，丁氏对曰：“得一人之使，非得一人/于井中也。”求闻之/若此，不若无闻也。", "hard": "溉 gài　汲 jí", "lines": [["宋之丁氏，家无井而出溉汲，常一人居外。", "溉汲：打水浇田。居外：住在外面，专管打水。", "宋国有户姓丁的人家，家里没有井，要到外面打水浇田，常常要派一个人住在外面专管这事。"], ["及其家穿井，告人曰：“吾穿井得一人。”", "及：等到。穿井：挖井。", "等到他家挖了井，他告诉别人说：“我家挖井得到了一个人。”"], ["有闻而传之者曰：“丁氏穿井得一人。”", "", "有个听到这话的人传话说：“丁家挖井挖出了一个人。”"], ["国人道之，闻之于宋君。", "国人：都城里的人。道：讲述。闻：使知道。", "都城里的人都在讲这件事，一直传到了宋国国君那里。"], ["宋君令人问之于丁氏，丁氏对曰：", "对：回答。", "宋国国君派人去问丁家，丁家回答说："], ["“得一人之使，非得一人于井中也。”", "使：使用，指人力。", "“是得到了一个人的劳力，不是从井里挖出一个人。”"], ["求闻之若此，不若无闻也。", "求：探求。若此：像这样。", "像这样听信传闻，还不如没有听到。"]], "tip": "一句话越传越走样：得一人（之使）→ 穿井得一人 → 国人道之", "moral": "听到传言要动脑子核实，不能人云亦云。"}, {"t": "杞人忧天", "g": "初中 · 七年级上册", "s": "《列子·天瑞》", "read": "杞国有人/忧天地崩坠，身亡所寄，废寝食者。又有/忧彼之所忧者，因往晓之，曰：“天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何/忧崩坠乎？”其人曰：“天果积气，日月星宿，不当坠耶？”晓之者曰：“日月星宿，亦积气中/之有光耀者，只使坠，亦不能/有所中伤。”其人曰：“奈地坏何？”晓者曰：“地，积块耳，充塞四虚，亡处亡块。若躇步跐蹈，终日在地上行止，奈何/忧其坏？”其人/舍然大喜，晓之者/亦舍然大喜。", "hard": "杞 qǐ　亡 wú　宿 xiù　耶 yé　中 zhòng　躇 chú　跐 cǐ　舍 shì", "lines": [["杞国有人忧天地崩坠，身亡所寄，废寝食者。", "崩坠：崩塌坠落。亡（wú）：同“无”。寄：依附。", "杞国有个人担心天塌地陷，自己无处容身，愁得睡不着觉、吃不下饭。"], ["又有忧彼之所忧者，因往晓之，曰：", "晓：开导。", "又有一个为他的担忧而担忧的人，就去开导他，说："], ["“天，积气耳，亡处亡气。", "积气：聚积的气体。", "“天不过是聚积的气体罢了，没有哪个地方没有空气。"], ["若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？”", "若：你。行止：行动和停留。奈何：为什么。", "你一举一动、一呼一吸，整天都在天空里活动，为什么还担心天会塌下来呢？”"], ["其人曰：“天果积气，日月星宿，不当坠耶？”", "星宿（xiù）：星星。耶（yé）：吗。", "那人说：“天如果真是聚积的气体，那太阳、月亮、星星不会掉下来吗？”"], ["晓之者曰：“日月星宿，亦积气中之有光耀者，", "", "开导他的人说：“太阳、月亮、星星，也是聚积的气体中发光的东西，"], ["只使坠，亦不能有所中伤。”", "只使：即使。中（zhòng）伤：打中伤害。", "即使掉下来，也不会伤害到人。”"], ["其人曰：“奈地坏何？”", "奈……何：对……怎么办。", "那人又说：“地陷下去怎么办呢？”"], ["晓者曰：“地，积块耳，充塞四虚，亡处亡块。", "积块：堆积的土块。四虚：四方。", "开导的人说：“地不过是堆积的土块罢了，填满了四方，没有哪个地方没有土块。"], ["若躇步跐蹈，终日在地上行止，奈何忧其坏？”", "躇（chú）步跐（cǐ）蹈：泛指人的站立行走。", "你走路跳跃，整天都在地上活动，为什么还担心它会陷下去呢？”"], ["其人舍然大喜，晓之者亦舍然大喜。", "舍（shì）然：消除疑虑的样子。", "那个人放下心来，非常高兴；开导他的人也放下心来，非常高兴。"]], "tip": "两问两答：天会塌吗？（积气）日月会掉吗？（不伤人）地会陷吗？（积块）", "moral": "不要为没有根据的事情忧虑；也要用道理帮别人解开心结。"}, {"t": "孙权劝学", "g": "初中 · 七年级下册", "s": "司马光《资治通鉴》", "read": "初，权/谓吕蒙曰：“卿/今当涂掌事，不可不学！”蒙/辞以军中多务。权曰：“孤/岂欲卿/治经为博士邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤/常读书，自以为/大有所益。”蒙/乃始就学。及鲁肃/过寻阳，与蒙论议，大惊曰：“卿今者才略，非复/吴下阿蒙！”蒙曰：“士别三日，即更/刮目相待，大兄/何见事之晚乎！”肃/遂拜蒙母，结友而别。", "hard": "当 dāng　涂 tú　邪 yé　更 gèng", "lines": [["初，权谓吕蒙曰：“卿今当涂掌事，不可不学！”", "初：当初。卿：君对臣的爱称。当涂：当道，当权。", "当初，孙权对吕蒙说：“你现在当权管事了，不能不学习！”"], ["蒙辞以军中多务。", "辞：推托。务：事务。", "吕蒙用军中事务繁多来推托。"], ["权曰：“孤岂欲卿治经为博士邪！但当涉猎，见往事耳。", "孤：古代王侯的自称。治经：研究儒家经典。博士：掌管经学传授的学官。涉猎：粗略地阅读。见往事：了解历史。", "孙权说：“我难道是想让你研究经书成为博士吗！只是应当粗略地读些书，了解历史罢了。"], ["卿言多务，孰若孤？孤常读书，自以为大有所益。”", "孰若：与……相比怎么样。益：好处。", "你说事务多，谁比得上我事务多呢？我常常读书，自己觉得很有好处。”"], ["蒙乃始就学。", "就学：从事学习。", "吕蒙于是开始学习。"], ["及鲁肃过寻阳，与蒙论议，大惊曰：", "及：等到。过：经过。", "等到鲁肃经过寻阳，和吕蒙一起议论事情，鲁肃非常吃惊地说："], ["“卿今者才略，非复吴下阿蒙！”", "才略：才干和谋略。非复：不再是。吴下阿蒙：在吴地时的那个吕蒙。", "“你现在的才干谋略，已经不再是当年吴地的那个阿蒙了！”"], ["蒙曰：“士别三日，即更刮目相待，大兄何见事之晚乎！”", "更（gèng）：另外，重新。刮目相待：擦亮眼睛看待。见事：知晓事情。", "吕蒙说：“读书人分别几天，就要重新另眼相看，老兄你怎么现在才知道这个道理呢！”"], ["肃遂拜蒙母，结友而别。", "遂：于是。", "鲁肃于是拜见了吕蒙的母亲，和吕蒙结为朋友后告别。"]], "tip": "劝学（孙权）→ 就学（吕蒙）→ 惊学（鲁肃）——成语“刮目相待”“吴下阿蒙”出自这里", "moral": "再忙也要读书，开始学习永远不晚。"}, {"t": "卖油翁", "g": "初中 · 七年级下册", "s": "欧阳修《归田录》", "read": "陈康肃公尧咨/善射，当世无双，公/亦以此自矜。尝射于家圃，有卖油翁/释担而立，睨之/久而不去。见其发矢/十中八九，但微颔之。康肃问曰：“汝亦知射乎？吾射/不亦精乎？”翁曰：“无他，但手熟尔。”康肃/忿然曰：“尔安敢/轻吾射！”翁曰：“以我酌油/知之。”乃取一葫芦/置于地，以钱覆其口，徐以杓/酌油沥之，自钱孔入，而钱不湿。因曰：“我亦无他，惟手熟尔。”康肃/笑而遣之。此与庄生所谓/解牛斫轮者/何异？", "hard": "矜 jīn　圃 pǔ　睨 nì　颔 hàn　杓 sháo　沥 lì　斫 zhuó", "lines": [["陈康肃公尧咨善射，当世无双，公亦以此自矜。", "善射：擅长射箭。自矜：自夸。", "康肃公陈尧咨擅长射箭，当时没有第二个人比得上，他也因此自夸。"], ["尝射于家圃，有卖油翁释担而立，睨之久而不去。", "尝：曾经。圃：园子。释担：放下担子。睨（nì）：斜着眼看，不以为然的样子。", "他曾在自家园子里射箭，有个卖油的老头放下担子站着，斜着眼看了很久都不离开。"], ["见其发矢十中八九，但微颔之。", "矢：箭。但：只。颔（hàn）：点头。", "老头看他射箭十支能中八九支，只是微微点点头。"], ["康肃问曰：“汝亦知射乎？吾射不亦精乎？”", "", "陈尧咨问道：“你也懂得射箭吗？我的箭术不是很高明吗？”"], ["翁曰：“无他，但手熟尔。”", "无他：没有别的奥妙。尔：同“耳”，罢了。", "老头说：“没有别的奥妙，只不过是手法熟练罢了。”"], ["康肃忿然曰：“尔安敢轻吾射！”", "忿然：气愤的样子。安：怎么。轻：轻视。", "陈尧咨气愤地说：“你怎么敢轻视我的箭术！”"], ["翁曰：“以我酌油知之。”", "酌：倒。", "老头说：“凭我倒油的经验就知道这个道理。”"], ["乃取一葫芦置于地，以钱覆其口，", "覆：盖。", "于是拿出一个葫芦放在地上，用一枚铜钱盖住葫芦口，"], ["徐以杓酌油沥之，自钱孔入，而钱不湿。", "徐：慢慢地。杓（sháo）：同“勺”。沥：注入。", "慢慢地用勺子舀油倒进葫芦，油从铜钱的方孔注入，铜钱却没有沾湿。"], ["因曰：“我亦无他，惟手熟尔。”康肃笑而遣之。", "因：于是。遣：打发。", "接着说：“我也没有别的奥妙，只不过是手法熟练罢了。”陈尧咨笑着打发他走了。"], ["此与庄生所谓解牛斫轮者何异？", "庄生：庄子。解牛：庖丁解牛。斫（zhuó）轮：轮扁砍木做车轮。", "这和庄子所说的庖丁解牛、轮扁斫轮的故事有什么不同呢？"]], "tip": "射箭 → 颔之 → 问答（手熟）→ 酌油 → 笑遣——成语“熟能生巧”", "moral": "熟能生巧；有本事也不要骄傲。"}, {"t": "陋室铭", "g": "初中 · 七年级下册", "s": "刘禹锡", "read": "山/不在高，有仙/则名。水/不在深，有龙/则灵。斯是陋室，惟吾德馨。苔痕/上阶绿，草色/入帘青。谈笑/有鸿儒，往来/无白丁。可以/调素琴，阅金经。无丝竹/之乱耳，无案牍/之劳形。南阳/诸葛庐，西蜀/子云亭。孔子云：何陋之有？", "hard": "馨 xīn　鸿 hóng　牍 dú", "lines": [["山不在高，有仙则名。水不在深，有龙则灵。", "名：出名。灵：神奇。", "山不在于高，有了仙人就出名；水不在于深，有了龙就显得神奇。"], ["斯是陋室，惟吾德馨。", "斯：这。陋室：简陋的屋子。惟：只。馨：香气，指品德高尚。", "这是一间简陋的屋子，只是因为我的品德高尚（就不觉得简陋了）。"], ["苔痕上阶绿，草色入帘青。", "", "苔藓长到台阶上，一片碧绿；草色映入帘子里，满眼青翠。"], ["谈笑有鸿儒，往来无白丁。", "鸿儒：博学的人。白丁：没有学问的人。", "和我谈笑的都是博学的人，来往的没有没学问的人。"], ["可以调素琴，阅金经。", "调：弹奏。素琴：不加装饰的琴。金经：佛经。", "可以弹弹朴素的琴，读读佛经。"], ["无丝竹之乱耳，无案牍之劳形。", "丝竹：琴瑟、箫笛等乐器，指音乐。案牍：官府公文。劳形：使身体劳累。", "没有嘈杂的音乐扰乱耳朵，没有官府的公文劳累身心。"], ["南阳诸葛庐，西蜀子云亭。", "诸葛庐：诸葛亮的草庐。子云亭：扬雄的屋子。", "（这间屋子就像）南阳诸葛亮的草庐，西蜀扬子云的亭子。"], ["孔子云：何陋之有？", "何陋之有：有什么简陋的呢。", "孔子说：（君子住在这里）有什么简陋的呢？"]], "tip": "山 → 水 → 室（类比开头）；景 → 人 → 事；最后用诸葛庐、子云亭和孔子的话收尾", "moral": "住得简陋不要紧，品德高尚才最重要。"}, {"t": "爱莲说", "g": "初中 · 七年级下册", "s": "周敦颐", "read": "水陆/草木之花，可爱者/甚蕃。晋/陶渊明/独爱菊。自李唐来，世人/甚爱牡丹。予/独爱莲之/出淤泥/而不染，濯清涟/而不妖，中通/外直，不蔓/不枝，香远/益清，亭亭/净植，可远观/而不可/亵玩焉。予谓/菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后/鲜有闻。莲之爱，同予者/何人？牡丹之爱，宜乎众矣。", "hard": "蕃 fán　濯 zhuó　涟 lián　蔓 màn　亵 xiè　鲜 xiǎn", "lines": [["水陆草木之花，可爱者甚蕃。", "蕃（fán）：多。", "水上、陆地上各种草木的花，值得喜爱的非常多。"], ["晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。", "李唐：唐朝皇帝姓李，所以称李唐。", "晋朝的陶渊明唯独喜爱菊花。从唐朝以来，世人很喜爱牡丹。"], ["予独爱莲之出淤泥而不染，濯清涟而不妖，", "淤泥：河底的泥。濯（zhuó）：洗。清涟：清水。妖：美丽而不端庄。", "我唯独喜爱莲花从淤泥里长出来却不被沾染，在清水里洗过却不显得妖艳，"], ["中通外直，不蔓不枝，香远益清，亭亭净植，", "蔓：生枝蔓。益：更加。亭亭：耸立的样子。植：立。", "茎内空外直，不生枝蔓、不长枝节，香气传得越远越清幽，笔直洁净地立在水中，"], ["可远观而不可亵玩焉。", "亵（xiè）玩：亲近而不庄重地玩弄。", "只可以远远地观赏，却不能靠近随便玩弄。"], ["予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。", "隐逸者：隐居的人。", "我认为菊花是花中的隐士，牡丹是花中的富贵者，莲花是花中的君子。"], ["噫！菊之爱，陶后鲜有闻。", "噫：叹词。鲜（xiǎn）：少。", "唉！对菊花的喜爱，陶渊明以后就很少听说了。"], ["莲之爱，同予者何人？牡丹之爱，宜乎众矣。", "宜乎：当然。", "对莲花的喜爱，和我一样的还有谁呢？对牡丹的喜爱，人当然就很多了。"]], "tip": "菊（隐士）· 牡丹（富贵）· 莲（君子）——借花写人", "moral": "做人要像莲花一样，在不好的环境里也保持纯洁正直。"}, {"t": "河中石兽", "g": "初中 · 七年级下册", "s": "纪昀《阅微草堂笔记》", "read": "沧州南/一寺临河干，山门/圮于河，二石兽/并沉焉。阅十余岁，僧募金重修，求二石兽于水中，竟不可得。以为/顺流下矣，棹数小舟，曳铁钯，寻十余里，无迹。一讲学家/设帐寺中，闻之笑曰：“尔辈/不能究物理。是非木柿，岂能为暴涨/携之去？乃石性坚重，沙性松浮，湮于沙上，渐沉渐深耳。沿河求之，不亦颠乎？”众服为确论。一老河兵/闻之，又笑曰：“凡河中失石，当求之于上流。盖石性坚重，沙性松浮，水不能冲石，其反激之力，必于石下迎水处/啮沙为坎穴，渐激渐深，至石之半，石必倒掷坎穴中。如是再啮，石又再转。转转不已，遂反溯流逆上矣。求之下流，固颠；求之地中，不更颠乎？”如其言，果得于数里外。然则/天下之事，但知其一，不知其二者/多矣，可据理臆断欤？", "hard": "圮 pǐ　棹 zhào　曳 yè　钯 pá　柿 fèi　湮 yān　啮 niè　溯 sù　臆 yì", "lines": [["沧州南一寺临河干，山门圮于河，二石兽并沉焉。", "河干：河岸。圮（pǐ）：倒塌。", "沧州南边有一座寺庙靠近河岸，寺庙的大门倒塌在河里，门前的两个石兽一起沉到了河底。"], ["阅十余岁，僧募金重修，求二石兽于水中，竟不可得。", "阅：经过。募金：募集钱财。竟：终于。", "过了十多年，和尚募集钱财重修寺庙，在河里寻找两个石兽，终究没有找到。"], ["以为顺流下矣，棹数小舟，曳铁钯，寻十余里，无迹。", "棹（zhào）：划船。曳（yè）：拖着。", "和尚们认为石兽顺着水流到下游去了，就划着几只小船，拖着铁耙，往下游找了十多里，没有一点踪迹。"], ["一讲学家设帐寺中，闻之笑曰：“尔辈不能究物理。", "设帐：设馆教书。究：推究。物理：事物的道理。", "一位讲学家在寺里教书，听了这事笑着说：“你们这些人不懂得推究事物的道理。"], ["是非木柿，岂能为暴涨携之去？", "木柿（fèi）：削下的木片。", "石兽不是木片，怎么能被暴涨的河水冲走呢？"], ["乃石性坚重，沙性松浮，湮于沙上，渐沉渐深耳。", "湮（yān）：埋没。", "石头的特性坚硬沉重，沙子的特性松软浮动，石兽埋没在沙里，只会越沉越深罢了。"], ["沿河求之，不亦颠乎？”众服为确论。", "颠：同“癫”，荒唐。确论：正确的言论。", "顺着河往下找，不是很荒唐吗？”大家都很佩服，认为这是正确的结论。"], ["一老河兵闻之，又笑曰：“凡河中失石，当求之于上流。", "河兵：巡河守堤的士兵。", "一个老河兵听了，又笑着说：“凡是掉在河里的石头，都应当到上游去找。"], ["盖石性坚重，沙性松浮，水不能冲石，其反激之力，必于石下迎水处啮沙为坎穴，", "啮（niè）：咬，这里指冲刷。坎穴：坑洞。", "因为石头坚硬沉重，沙子松软浮动，水冲不动石头，水流的反冲力，一定会在石头下面迎水的地方冲刷沙子形成坑洞，"], ["渐激渐深，至石之半，石必倒掷坎穴中。", "倒掷：翻倒。", "越冲越深，冲到石头底部的一半时，石头必定翻倒在坑洞里。"], ["如是再啮，石又再转。转转不已，遂反溯流逆上矣。", "已：停止。溯（sù）流：逆着水流。", "像这样再冲刷，石头又会再翻转。不停地翻转，于是反而逆着水流到上游去了。"], ["求之下流，固颠；求之地中，不更颠乎？”", "固：本来。", "到下游找石兽，本来就荒唐；在原地往下挖，不是更荒唐吗？”"], ["如其言，果得于数里外。", "", "按照老河兵的话去找，果然在上游几里外找到了石兽。"], ["然则天下之事，但知其一，不知其二者多矣，可据理臆断欤？", "然则：既然这样，那么。臆断：主观判断。", "既然这样，那么天下的事情，只知道表面、不知道深层原因的情况太多了，怎么能根据某个道理就主观判断呢？"]], "tip": "三种找法：下游（和尚）→ 原地（讲学家）→ 上游（老河兵，找到了）", "moral": "看问题要全面，实践出真知，不能只凭书本道理想当然。"}, {"t": "三峡", "g": "初中 · 八年级上册", "s": "郦道元《水经注》", "read": "自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。春冬之时，则素湍绿潭，回清倒影。绝巘多生怪柏，悬泉瀑布，飞漱其间，清荣峻茂，良多趣味。每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰：“巴东三峡巫峡长，猿鸣三声泪沾裳。”", "hard": "阙 quē　嶂 zhàng　曦 xī　襄 xiāng　溯 sù　湍 tuān　巘 yǎn　漱 shù　涧 jiàn　属 zhǔ　裳 cháng", "lines": [["自三峡七百里中，两岸连山，略无阙处。", "自：在，从。略无：毫无。阙：同“缺”，空缺。", "在三峡七百里之间，两岸都是连绵的高山，没有一点空缺的地方。"], ["重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。", "嶂：像屏障一样的山峰。自非：如果不是。亭午：正午。夜分：半夜。曦：日光。", "重重叠叠的悬崖峭壁，遮蔽了天空和太阳，如果不是正午和半夜，就看不到太阳和月亮。"], ["至于夏水襄陵，沿溯阻绝。", "襄：漫上。陵：大的土山。沿：顺流而下。溯：逆流而上。", "到了夏天江水漫上山陵的时候，上行和下行的船只都被阻断了。"], ["或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，", "或：有时。宣：宣布。", "有时皇帝的命令要紧急传达，有时早上从白帝城出发，傍晚就到了江陵，这中间有一千二百里，"], ["虽乘奔御风，不以疾也。", "奔：奔驰的快马。御风：驾着风。疾：快。", "即使骑着飞奔的快马、驾着风，也没有这么快。"], ["春冬之时，则素湍绿潭，回清倒影。", "素湍：白色的急流。回清：回旋的清波。", "春天和冬天的时候，白色的急流、碧绿的深潭，回旋的清波倒映着各种景物的影子。"], ["绝巘多生怪柏，悬泉瀑布，飞漱其间，", "绝巘（yǎn）：极高的山峰。飞漱（shù）：飞速地冲荡。", "极高的山峰上生长着许多奇形怪状的柏树，悬泉和瀑布在山峰之间飞流冲荡，"], ["清荣峻茂，良多趣味。", "清荣峻茂：水清、树荣、山高、草茂。良：实在，很。", "水清、树荣、山高、草盛，实在有很多趣味。"], ["每至晴初霜旦，林寒涧肃，", "晴初：天刚放晴。霜旦：下霜的早晨。肃：寂静。", "每到天刚放晴或下霜的早晨，树林和山涧一片清冷寂静，"], ["常有高猿长啸，属引凄异，空谷传响，哀转久绝。", "属（zhǔ）引：连续不断。凄异：凄凉怪异。", "常常有高处的猿猴长声啼叫，声音连续不断，非常凄凉，空荡的山谷传来回声，悲哀婉转，很久才消失。"], ["故渔者歌曰：“巴东三峡巫峡长，猿鸣三声泪沾裳。”", "", "所以打鱼的人唱道：“巴东三峡中巫峡最长，猿猴啼叫几声，泪水就沾湿了衣裳。”"]], "tip": "山（连山）→ 夏水（急）→ 春冬（清）→ 秋（凄）——四季不同的三峡", "moral": "抓住景物的特点写景，景中带情。"}, {"t": "答谢中书书", "g": "初中 · 八年级上册", "s": "陶弘景", "read": "山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。实是欲界之仙都。自康乐以来，未复有能与其奇者。", "hard": "颓 tuí　与 yù", "lines": [["山川之美，古来共谈。", "共谈：共同谈赏。", "山川景色的美丽，自古以来就是人们共同谈赏的。"], ["高峰入云，清流见底。", "", "高高的山峰耸入云端，清澈的溪流可以看见水底。"], ["两岸石壁，五色交辉。青林翠竹，四时俱备。", "交辉：交相辉映。四时：四季。", "两岸的石壁色彩斑斓，交相辉映。青葱的树林、翠绿的竹子，四季常存。"], ["晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。", "歇：消散。颓：坠落。沉鳞：潜游在水中的鱼。", "清晨的薄雾将要消散时，猿猴和鸟儿此起彼伏地鸣叫；夕阳快要落山时，水中的鱼儿争相跃出水面。"], ["实是欲界之仙都。", "欲界：佛教指有饮食男女之欲的世界，这里指人间。仙都：神仙居住的地方。", "这里实在是人间的仙境啊。"], ["自康乐以来，未复有能与其奇者。", "康乐：谢灵运，袭封康乐公。与（yù）：参与，这里指欣赏。", "自从谢灵运以来，就再也没有人能够欣赏这奇丽的景色了。"]], "tip": "总（山川之美）→ 分（高峰、清流、石壁、林竹、晓、夕）→ 总（仙都）", "moral": "热爱自然，从山水中发现美。"}, {"t": "记承天寺夜游", "g": "初中 · 八年级上册", "s": "苏轼", "read": "元丰六年/十月十二日夜，解衣/欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺/寻张怀民。怀民/亦未寝，相与/步于中庭。庭下/如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人/如吾两人者耳。", "hard": "藻 zǎo　荇 xìng", "lines": [["元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。", "户：门。欣然：高兴的样子。", "元丰六年十月十二日夜晚，我脱下衣服准备睡觉，月光照进门里，我高兴地起身出门散步。"], ["念无与为乐者，遂至承天寺寻张怀民。", "念：考虑，想到。遂：于是。", "想到没有可以和我一起游乐的人，于是到承天寺找张怀民。"], ["怀民亦未寝，相与步于中庭。", "寝：睡觉。相与：共同，一起。中庭：庭院里。", "张怀民也没有睡，我们就一起在庭院里散步。"], ["庭下如积水空明，水中藻、荇交横，盖竹柏影也。", "空明：形容水澄澈透明。藻、荇（xìng）：水草。盖：原来是。", "庭院里的月光像积满了清澈透明的水，水中好像有水草交错纵横，原来是竹子和柏树的影子。"], ["何夜无月？何处无竹柏？但少闲人如吾两人者耳。", "但：只是。闲人：清闲的人。", "哪一个夜晚没有月光？哪个地方没有竹子和柏树？只是缺少像我们两个这样清闲的人罢了。"]], "tip": "记事（夜起寻友）→ 写景（月光如水）→ 抒情（闲人）", "moral": "心境乐观的人，在平常的生活里也能发现美。"}, {"t": "与朱元思书", "g": "初中 · 八年级上册", "s": "吴均", "read": "风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐一百许里，奇山异水，天下独绝。水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。横柯上蔽，在昼犹昏；疏条交映，有时见日。", "hard": "缥 piǎo　湍 tuān　轩 xuān　邈 miǎo　泠 líng　嘤 yīng　转 zhuàn　鸢 yuān　戾 lì　柯 kē　反 fǎn", "lines": [["风烟俱净，天山共色。从流飘荡，任意东西。", "风烟：烟雾。共色：一样的颜色。从流：随着江流。", "风停了，烟雾都消散了，天空和群山呈现出同样的颜色。我乘着船随江流飘荡，任凭船儿时东时西。"], ["自富阳至桐庐一百许里，奇山异水，天下独绝。", "许：表示约数。独绝：独一无二。", "从富阳到桐庐大约一百里，奇异的山、奇异的水，是天下独一无二的。"], ["水皆缥碧，千丈见底。游鱼细石，直视无碍。", "缥（piǎo）碧：青白色。", "江水都是青白色的，很深的地方也能看到水底。游动的鱼儿和细小的石子，可以一直看清，毫无阻碍。"], ["急湍甚箭，猛浪若奔。", "急湍：湍急的水流。甚箭：比箭还快。奔：飞奔的马。", "湍急的水流比箭还快，凶猛的波浪像飞奔的骏马。"], ["夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。", "寒树：耐寒常绿的树。负势：凭借地势。轩邈：向高处和远处伸展。", "江两岸的高山上都长着耐寒的树，高山凭借地势争着向上，好像在相互比高比远，争着向上，笔直地指向天空，形成了成百上千座山峰。"], ["泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。", "泠（líng）泠：形容水声清越。嘤嘤：鸟鸣声。", "泉水冲击着石头，发出泠泠的声响；美丽的鸟儿互相应和地鸣叫，叫声和谐动听。"], ["蝉则千转不穷，猿则百叫无绝。", "转（zhuàn）：同“啭”，鸟婉转地鸣叫，这里指蝉鸣。穷：尽。", "蝉长时间地叫个不停，猿猴也长时间地叫个不停。"], ["鸢飞戾天者，望峰息心；", "鸢（yuān）飞戾（lì）天：老鹰高飞到天上，比喻追求高位的人。息心：平息追逐名利的心。", "那些像老鹰飞到天上一样极力追求名利的人，看到这些雄奇的山峰，就会平息热衷名利的心；"], ["经纶世务者，窥谷忘反。", "经纶：筹划、治理。反：同“返”。", "那些忙于治理国家事务的人，看到这些幽美的山谷，就会流连忘返。"], ["横柯上蔽，在昼犹昏；疏条交映，有时见日。", "柯：树枝。", "横斜的树枝在上面遮蔽着，即使在白天也像黄昏时那样昏暗；稀疏的枝条交相掩映，有时也可以见到阳光。"]], "tip": "总写（奇山异水）→ 异水（清、急）→ 奇山（高、声、情）", "moral": "大自然的美能让人放下名利、心境开阔。"}, {"t": "富贵不能淫", "g": "初中 · 八年级上册", "s": "《孟子·滕文公下》", "read": "景春曰：“公孙衍、张仪/岂不诚/大丈夫哉？一怒/而诸侯惧，安居/而天下熄。”孟子曰：“是/焉得为大丈夫乎？子/未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：‘往之女家，必敬必戒，无违夫子！’以顺为正者，妾妇之道也。居/天下之广居，立/天下之正位，行/天下之大道。得志，与民由之；不得志，独行其道。富贵/不能淫，贫贱/不能移，威武/不能屈。此之谓/大丈夫。”", "hard": "冠 guàn　女 rǔ　淫 yín", "lines": [["景春曰：“公孙衍、张仪岂不诚大丈夫哉？", "景春：战国时的纵横家。诚：真正，确实。", "景春说：“公孙衍和张仪难道不是真正的大丈夫吗？"], ["一怒而诸侯惧，安居而天下熄。”", "熄：平息，指战火平息。", "他们一发怒，诸侯都害怕；他们安静下来，天下就太平无事。”"], ["孟子曰：“是焉得为大丈夫乎？子未学礼乎？", "是：这。焉得：怎么能。", "孟子说：“这怎么能算是大丈夫呢？你没有学过礼吗？"], ["丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，", "冠（guàn）：男子成年时举行加冠礼。命：教导、训诲。", "男子举行加冠礼时，父亲给予训导；女子出嫁时，母亲给予训导，送她到门口，"], ["戒之曰：‘往之女家，必敬必戒，无违夫子！’", "戒：告诫。女（rǔ）：同“汝”，你。夫子：这里指丈夫。", "告诫她说：‘到了你丈夫家里，一定要恭敬，一定要谨慎，不要违背你的丈夫！’"], ["以顺为正者，妾妇之道也。", "", "把顺从当作正道，是妇人家的为人之道。（公孙衍、张仪只会顺从诸侯，算不上大丈夫。）"], ["居天下之广居，立天下之正位，行天下之大道。", "广居：宽广的住宅，指“仁”。正位：正确的位置，指“礼”。大道：光明的大道，指“义”。", "居住在天下最宽广的住宅“仁”里，站立在天下最正确的位置“礼”上，行走在天下最光明的大道“义”上。"], ["得志，与民由之；不得志，独行其道。", "由：遵循。", "能实现志向时，就和百姓一起遵循正道；不能实现志向时，就独自坚持自己的原则。"], ["富贵不能淫，贫贱不能移，威武不能屈。此之谓大丈夫。”", "淫：使……迷惑。移：使……改变。屈：使……屈服。", "富贵不能使他的思想迷惑，贫贱不能使他的志向改变，威武不能使他的意志屈服，这才叫作大丈夫。”"]], "tip": "景春问（衍、仪是大丈夫？）→ 孟子驳（妾妇之道）→ 立（仁、礼、义 + 三不能）", "moral": "真正的大丈夫，有原则、有骨气，不被富贵、贫贱、威武改变。"}, {"t": "生于忧患，死于安乐", "g": "初中 · 八年级上册", "s": "《孟子·告子下》", "read": "舜/发于畎亩之中，傅说/举于版筑之间，胶鬲/举于鱼盐之中，管夷吾/举于士，孙叔敖/举于海，百里奚/举于市。故/天将降大任于是人也，必先/苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以/动心忍性，曾益其所不能。人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。然后知/生于忧患，而死于安乐也。", "hard": "畎 quǎn　说 yuè　鬲 gé　拂 fú　曾 zēng　衡 héng　拂 bì", "lines": [["舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，", "发：兴起，指被任用。畎（quǎn）亩：田地。傅说（yuè）：商王武丁的大臣。版筑：筑墙。举：选拔。", "舜从田野之中被起用，傅说从筑墙的工作中被选拔，胶鬲从鱼盐贩卖中被选拔，"], ["管夷吾举于士，孙叔敖举于海，百里奚举于市。", "士：狱官。海：海边。市：集市。", "管夷吾从狱官手里被释放并被任用，孙叔敖从海边被选拔，百里奚从集市上被赎回并被任用。"], ["故天将降大任于是人也，必先苦其心志，劳其筋骨，", "是人：这样的人。", "所以上天将要把重大的使命降落到这样的人身上，一定要先使他的内心痛苦，使他的筋骨劳累，"], ["饿其体肤，空乏其身，行拂乱其所为，", "空乏：资财缺乏。拂：违背。", "使他经受饥饿以致肌肤消瘦，使他受贫困之苦，使他做事总不顺利，"], ["所以动心忍性，曾益其所不能。", "动心忍性：使他的内心受到震撼，使他的性格坚韧起来。曾（zēng）益：增加。曾，同“增”。", "用这些来震撼他的心灵，坚韧他的性情，增加他原本不具备的才能。"], ["人恒过，然后能改；困于心，衡于虑，而后作；", "恒：常常。衡：同“横”，梗塞，不顺。作：奋起。", "一个人常常犯错误，然后才能改正；内心困苦、思虑阻塞，然后才能奋发有为；"], ["征于色，发于声，而后喻。", "征：表现。喻：明白。", "表现在脸色上，流露在言谈中，然后才能被人了解。"], ["入则无法家拂士，出则无敌国外患者，国恒亡。", "法家：守法度的大臣。拂（bì）士：辅佐君主的贤士。拂，同“弼”。", "一个国家，内没有守法度的大臣和辅佐君主的贤士，外没有敌对国家和外患的威胁，这个国家就常常会灭亡。"], ["然后知生于忧患，而死于安乐也。", "", "这样，就知道忧愁祸患能使人生存发展，而安逸享乐会使人萎靡死亡。"]], "tip": "六个人的例子 → 天降大任（苦、劳、饿、空乏、拂乱）→ 个人 → 国家 → 结论", "moral": "逆境能磨炼人，太安逸反而会让人和国家衰亡。"}, {"t": "愚公移山", "g": "初中 · 八年级上册", "s": "《列子·汤问》", "read": "太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：“吾与汝毕力平险，指通豫南，达于汉阴，可乎？”杂然相许。其妻献疑曰：“以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？”杂曰：“投诸渤海之尾，隐土之北。”遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。河曲智叟笑而止之曰：“甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？”北山愚公长息曰：“汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉；子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？”河曲智叟亡以应。操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。", "hard": "仞 rèn　惩 chéng　曾 céng　荷 hè　畚 běn　孀 shuāng　龀 chèn　反 fǎn　叟 sǒu　亡 wú　厝 cuò　陇 lǒng", "lines": [["太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。", "方：指面积。仞（rèn）：古代长度单位。", "太行、王屋两座山，方圆七百里，高七八万尺，本来在冀州的南边，黄河北岸的北边。"], ["北山愚公者，年且九十，面山而居。", "且：将近。面：面对。", "北山有个叫愚公的人，年纪将近九十岁，面对着山居住。"], ["惩山北之塞，出入之迂也，聚室而谋曰：", "惩：苦于。塞：阻塞。迂：曲折、绕远。", "他苦于山北面的道路阻塞，出来进去都要绕远路，就召集全家人来商量说："], ["“吾与汝毕力平险，指通豫南，达于汉阴，可乎？”杂然相许。", "毕力：尽全力。平险：铲平险峻的大山。杂然：纷纷的样子。许：赞同。", "“我和你们尽全力铲平险峻的大山，使道路一直通到豫州南部，到达汉水南岸，好吗？”大家纷纷表示赞同。"], ["其妻献疑曰：“以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？”", "献疑：提出疑问。曾（céng）：连……都。魁父：小山名。如……何：把……怎么样。焉：哪里。", "他的妻子提出疑问说：“凭你的力气，连魁父这样的小山都削平不了，能把太行、王屋怎么样呢？况且，把土石放到哪里去呢？”"], ["杂曰：“投诸渤海之尾，隐土之北。”", "诸：“之于”的合音。", "大家纷纷说：“把土石扔到渤海的边上，隐土的北面。”"], ["遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。", "荷（hè）：挑。叩：敲，凿。箕畚（běn）：簸箕、土筐之类的工具。", "于是愚公率领子孙中能挑担子的三个人，凿石头，挖泥土，用簸箕、土筐运到渤海边上。"], ["邻人京城氏之孀妻有遗男，始龀，跳往助之。", "孀（shuāng）妻：寡妇。遗男：遗孤。龀（chèn）：换牙。", "邻居京城氏的寡妇有个孤儿，刚七八岁，蹦蹦跳跳地去帮助他们。"], ["寒暑易节，始一反焉。", "易节：季节交换。反：同“返”。", "冬夏换季，才往返一次。"], ["河曲智叟笑而止之曰：“甚矣，汝之不惠！", "叟（sǒu）：老头。惠：同“慧”，聪明。", "河湾上的智叟讥笑并阻止愚公说：“你太不聪明了！"], ["以残年余力，曾不能毁山之一毛，其如土石何？”", "毛：草木。", "凭你余下的岁月和剩下的力气，连山上的一棵草都动不了，又能把泥土和石头怎么样呢？”"], ["北山愚公长息曰：“汝心之固，固不可彻，曾不若孀妻弱子。", "长息：长叹。固：顽固。彻：通，这里指改变。", "北山愚公长叹一声说：“你思想顽固，顽固到不能改变的地步，还比不上寡妇和小孩。"], ["虽我之死，有子存焉；子又生孙，孙又生子；子又有子，子又有孙；", "", "即使我死了，还有儿子在；儿子又生孙子，孙子又生儿子；儿子又有儿子，儿子又有孙子；"], ["子子孙孙无穷匮也，而山不加增，何苦而不平？”", "匮：尽。", "子子孙孙是没有穷尽的，可是山不会再增高，何必担心挖不平呢？”"], ["河曲智叟亡以应。", "亡（wú）：同“无”。", "河湾上的智叟无话可答。"], ["操蛇之神闻之，惧其不已也，告之于帝。", "操蛇之神：神话中拿着蛇的山神。已：停止。", "拿着蛇的山神听说了这件事，怕愚公不停地挖下去，就向天帝报告了。"], ["帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。", "感：被……感动。厝（cuò）：放置。", "天帝被愚公的诚心感动，命令夸娥氏的两个儿子背走了两座山，一座放在朔方东部，一座放在雍州南部。"], ["自此，冀之南，汉之阴，无陇断焉。", "陇断：山冈高地。", "从此，冀州的南部，汉水的南岸，再也没有高山阻隔了。"]], "tip": "移山缘起 → 商量（妻献疑）→ 动工（孀妻遗男助）→ 驳智叟（子子孙孙）→ 天帝移山", "moral": "认定的目标就要坚持不懈地干下去，困难总会被克服。"}, {"t": "周亚夫军细柳", "g": "初中 · 八年级上册", "s": "司马迁《史记·绛侯周勃世家》", "read": "文帝之后六年，匈奴大入边。乃以宗正刘礼为将军，军霸上；祝兹侯徐厉为将军，军棘门；以河内守亚夫为将军，军细柳：以备胡。上自劳军。至霸上及棘门军，直驰入，将以下骑送迎。已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。天子先驱至，不得入。先驱曰：“天子且至！”军门都尉曰：“将军令曰：‘军中闻将军令，不闻天子之诏。’”居无何，上至，又不得入。于是上乃使使持节诏将军：“吾欲入劳军。”亚夫乃传言开壁门。壁门士吏谓从属车骑曰：“将军约，军中不得驱驰。”于是天子乃按辔徐行。至营，将军亚夫持兵揖曰：“介胄之士不拜，请以军礼见。”天子为动，改容式车。使人称谢：“皇帝敬劳将军。”成礼而去。既出军门，群臣皆惊。文帝曰：“嗟乎，此真将军矣！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。至于亚夫，可得而犯邪！”称善者久之。", "hard": "棘 jí　劳 lào　被 pī　彀 gòu　弩 nǔ　使 shǐ　辔 pèi　揖 yī　胄 zhòu　式 shì　曩 nǎng", "lines": [["文帝之后六年，匈奴大入边。", "文帝之后六年：汉文帝后元六年（前158年）。", "汉文帝后元六年，匈奴大规模侵犯边境。"], ["乃以宗正刘礼为将军，军霸上；祝兹侯徐厉为将军，军棘门；", "军：驻军。", "于是朝廷任命宗正刘礼为将军，驻军在霸上；任命祝兹侯徐厉为将军，驻军在棘门；"], ["以河内守亚夫为将军，军细柳：以备胡。", "备胡：防备匈奴。", "任命河内郡守周亚夫为将军，驻军在细柳：用来防备匈奴。"], ["上自劳军。至霸上及棘门军，直驰入，将以下骑送迎。", "劳（lào）：慰劳。将以下：将军和他的部下。", "皇上亲自去慰劳军队。到了霸上和棘门的军营，皇上的车马直接驰入，将军和他的部下骑着马迎送。"], ["已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。", "已而：不久。之：到。被（pī）：同“披”。彀（gòu）：张满弓。", "不久皇上来到细柳军营，只见官兵都披着铠甲，刀刃锋利，弓弩拉满，戒备森严。"], ["天子先驱至，不得入。先驱曰：“天子且至！”", "先驱：先行引导的人员。且：将要。", "天子的先行人员到了，不能进入军营。先行人员说：“天子就要到了！”"], ["军门都尉曰：“将军令曰：‘军中闻将军令，不闻天子之诏。’”", "诏：皇帝的命令。", "守卫营门的都尉说：“将军有令：‘军中只听将军的命令，不听天子的诏令。’”"], ["居无何，上至，又不得入。", "居无何：过了不久。", "过了不久，皇上到了，又不能进入军营。"], ["于是上乃使使持节诏将军：“吾欲入劳军。”亚夫乃传言开壁门。", "使使：派使者。节：符节，皇帝派遣使者的凭证。壁门：营门。", "于是皇上就派使者拿着符节下诏给将军：“我要进入军营慰劳军队。”周亚夫这才传令打开营门。"], ["壁门士吏谓从属车骑曰：“将军约，军中不得驱驰。”", "约：规定。驱驰：车马疾行。", "守卫营门的官兵对随从皇上的车马人员说：“将军规定，军营中不准车马奔驰。”"], ["于是天子乃按辔徐行。", "按辔（pèi）：控制住马缰绳。徐行：慢慢地走。", "于是天子就拉紧缰绳，让车马慢慢地前进。"], ["至营，将军亚夫持兵揖曰：“介胄之士不拜，请以军礼见。”", "揖（yī）：拱手行礼。介胄（zhòu）：铠甲和头盔。", "到了大营，将军周亚夫手拿兵器向皇上拱手行礼说：“穿着铠甲戴着头盔的将士不能跪拜，请允许我按照军礼参见。”"], ["天子为动，改容式车。使人称谢：“皇帝敬劳将军。”成礼而去。", "改容：改变神情。式车：扶着车前横木，表示敬意。式，同“轼”。称谢：致意。", "天子被感动了，神情变得严肃，扶着车前横木向官兵致敬。派人致意说：“皇帝敬重地慰劳将军。”完成了劳军的礼仪就离开了。"], ["既出军门，群臣皆惊。", "", "出了营门，大臣们都很惊讶。"], ["文帝曰：“嗟乎，此真将军矣！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。", "曩（nǎng）者：以往，先前。固：本来。", "汉文帝说：“啊，这才是真正的将军！先前霸上和棘门的军营，简直就像儿戏一样，那里的将军本来就可以通过偷袭而俘虏他们。"], ["至于亚夫，可得而犯邪！”称善者久之。", "犯：侵犯。", "至于周亚夫，谁能够侵犯他呢！”汉文帝称赞周亚夫很久。"]], "tip": "备胡 → 劳军（霸上、棘门 vs 细柳）→ 先驱不得入 → 天子不得入 → 按辔徐行 → 军礼见 → 真将军", "moral": "做事要守规矩、讲原则，认真严谨才能担当大任。"}, {"t": "桃花源记", "g": "初中 · 八年级下册", "s": "陶渊明", "read": "晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：“不足为外人道也。”既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。", "hard": "缘 yuán　俨 yǎn　阡陌 qiān mò　髫 tiáo　要 yāo　邑 yì　间 jiàn　惋 wǎn　诣 yì　骥 jì", "lines": [["晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。", "太元：东晋孝武帝的年号。为业：作为职业。缘：沿着。", "东晋太元年间，武陵郡有个人以打鱼为生。一天他沿着溪水划船，忘记了路程的远近。"], ["忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。", "落英：落花。缤纷：繁多交杂的样子。", "忽然遇到一片桃花林，生长在溪水两岸几百步的范围内，中间没有别的树，花草鲜嫩美丽，落花纷纷。"], ["渔人甚异之，复前行，欲穷其林。", "异：对……感到惊异。穷：尽，走完。", "渔人对此感到非常惊异，又继续往前划，想要走到林子的尽头。"], ["林尽水源，便得一山，山有小口，仿佛若有光。", "林尽水源：桃林在溪水发源的地方就到头了。仿佛：隐隐约约。", "桃林在溪水发源的地方到了尽头，就看到一座山，山上有个小洞口，洞里隐隐约约好像有光亮。"], ["便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。", "舍：舍弃，丢下。才：仅仅。豁然开朗：形容由狭窄幽暗突然变得开阔明亮。", "渔人就下了船，从洞口进去。起初洞口很狭窄，仅能容一个人通过。又走了几十步，突然变得开阔明亮。"], ["土地平旷，屋舍俨然，有良田、美池、桑竹之属。", "平旷：平坦宽阔。俨（yǎn）然：整齐的样子。属：类。", "这里土地平坦宽广，房屋整整齐齐，有肥沃的田地、美丽的池塘和桑树、竹子之类的东西。"], ["阡陌交通，鸡犬相闻。", "阡陌（qiān mò）：田间小路。交通：交错相通。", "田间小路交错相通，鸡鸣狗叫的声音彼此都能听到。"], ["其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。", "悉：全，都。黄发：指老人。垂髫（tiáo）：指小孩。怡然：愉快、高兴的样子。", "人们在田野里来来往往耕种劳作，男男女女的穿戴，完全像桃花源以外的世人。老人和小孩，都悠闲愉快、自得其乐。"], ["见渔人，乃大惊，问所从来。具答之。", "具：同“俱”，详细。", "他们看见渔人，竟然大吃一惊，问他是从哪里来的。渔人详细地作了回答。"], ["便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。", "要（yāo）：同“邀”，邀请。咸：都。", "有人就邀请渔人到自己家里去，摆酒杀鸡做饭来款待他。村里人听说来了这么一个人，都来打听消息。"], ["自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。", "先世：祖先。妻子：妻子儿女。邑人：同乡人。绝境：与人世隔绝的地方。间（jiàn）隔：隔绝。", "他们自己说祖先为了躲避秦时的战乱，带领妻子儿女和乡邻来到这个与人世隔绝的地方，再也没有出去过，于是就同外界的人隔绝了。"], ["问今是何世，乃不知有汉，无论魏晋。", "无论：更不必说。", "他们问现在是什么朝代，竟然不知道有汉朝，更不用说魏朝和晋朝了。"], ["此人一一为具言所闻，皆叹惋。", "叹惋：感叹、惋惜。", "渔人把自己知道的事一一详细地告诉了他们，他们听了都感叹惋惜。"], ["余人各复延至其家，皆出酒食。停数日，辞去。", "延：邀请。", "其余的人也各自又把渔人请到自己家中，都拿出酒饭来款待他。渔人住了几天，告辞离开。"], ["此中人语云：“不足为外人道也。”", "不足：不值得。", "桃花源里的人告诉他说：“这里的情况不值得对外面的人说啊。”"], ["既出，得其船，便扶向路，处处志之。", "扶：沿着。向：从前的、旧的。志：做标记。", "渔人出来以后，找到了他的船，就沿着旧路回去，处处做了标记。"], ["及郡下，诣太守，说如此。", "及：到达。郡下：郡城。诣（yì）：拜见。", "到了郡城，渔人去拜见太守，报告了这些情况。"], ["太守即遣人随其往，寻向所志，遂迷，不复得路。", "", "太守立即派人跟着他去，寻找先前所做的标记，结果迷失了方向，再也找不到通往桃花源的路了。"], ["南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。", "规：计划。未果：没有实现。寻：不久。", "南阳有个叫刘子骥的人，是个志向高洁的隐士，听到这件事，高兴地计划前往。但没有实现，不久就病死了。"], ["后遂无问津者。", "问津：探访，问路。津，渡口。", "此后就再也没有探访桃花源的人了。"]], "tip": "发现（桃林）→ 进入（小口）→ 做客（良田美池、热情招待）→ 离开（不足为外人道）→ 再寻（迷、无问津）", "moral": "作者向往没有战乱、人人安居乐业的美好社会。"}, {"t": "小石潭记", "g": "初中 · 八年级下册", "s": "柳宗元", "read": "从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。伐竹取道，下见小潭，水尤清冽。全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。潭中鱼可百许头，皆若空游无所依。日光下澈，影布石上，佁然不动；俶尔远逝，往来翕忽，似与游者相乐。潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生：曰恕己，曰奉壹。", "hard": "篁 huáng　珮 pèi　冽 liè　坻 chí　嵁 kān　缀 zhuì　参差 cēn cī　佁 yǐ　俶 chù　翕 xī　邃 suì", "lines": [["从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。", "篁（huáng）竹：成片的竹林。珮环：佩环，玉制的装饰品。乐之：以之为乐。", "从小土丘向西走一百二十步，隔着竹林，听到水声，好像人身上佩带的玉佩、玉环相碰发出的声音，心里感到很快乐。"], ["伐竹取道，下见小潭，水尤清冽。", "取道：开辟道路。清冽：清凉。", "砍倒竹子开辟出一条道路，往下看见一个小潭，潭水格外清凉。"], ["全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。", "以为：把……作为。卷：弯曲。坻（chí）：水中高地。嵁（kān）：不平的岩石。", "小潭以整块石头为底，靠近岸边，石底有些部分翻卷过来露出水面，形成了水中高地、小岛、不平的岩石和石岩等各种形状。"], ["青树翠蔓，蒙络摇缀，参差披拂。", "蒙络摇缀：覆盖缠绕，摇动下垂。参差（cēn cī）：长短不齐。披拂：随风飘荡。", "青葱的树木，翠绿的藤蔓，覆盖缠绕，摇动下垂，参差不齐，随风飘拂。"], ["潭中鱼可百许头，皆若空游无所依。", "可：大约。许：表示约数。", "潭中的鱼大约有一百来条，都好像在空中游动，什么依靠都没有。"], ["日光下澈，影布石上，佁然不动；俶尔远逝，往来翕忽，似与游者相乐。", "下澈：照到水底。佁（yǐ）然：呆呆的样子。俶（chù）尔：忽然。翕（xī）忽：轻快敏捷的样子。", "阳光直照到水底，鱼的影子映在石上，呆呆地一动不动；忽然又向远处游去，来来往往，轻快敏捷，好像在和游人互相取乐。"], ["潭西南而望，斗折蛇行，明灭可见。", "斗折蛇行：像北斗七星那样曲折，像蛇那样蜿蜒前行。明灭可见：时隐时现。", "向小潭的西南方望去，溪水像北斗七星那样曲折，像蛇那样蜿蜒前行，时隐时现。"], ["其岸势犬牙差互，不可知其源。", "犬牙差互：像狗的牙齿那样相互交错。", "溪岸的形状像狗的牙齿那样相互交错，不知道溪水的源头在哪里。"], ["坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。", "寂寥：寂静。悄怆（qiǎo chuàng）：寂静得使人忧伤。邃（suì）：深。", "坐在潭边，四面被竹林和树木包围着，寂静冷落，没有人，使人感到心情凄凉，寒气透骨，寂静得令人忧伤。"], ["以其境过清，不可久居，乃记之而去。", "以：因为。清：凄清。", "因为这里的环境过于凄清，不能长时间停留，于是记下了这里的情景就离开了。"], ["同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生：曰恕己，曰奉壹。", "隶而从者：跟着同去的。", "一起游玩的人有：吴武陵，龚古，我的弟弟宗玄。跟着同去的，有姓崔的两个年轻人：一个叫恕己，一个叫奉壹。"]], "tip": "发现（闻水声）→ 潭（水清、石奇、树翠）→ 鱼 → 溪 → 气氛（凄清）→ 同游者", "moral": "移步换景写景物，景物凄清也写出了作者孤寂的心情。"}, {"t": "核舟记", "g": "初中 · 八年级下册", "s": "魏学洢", "read": "明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。尝贻余核舟一，盖大苏泛赤壁云。舟首尾长约八分有奇，高可二黍许。中轩敞者为舱，箬篷覆之。旁开小窗，左右各四，共八扇。启窗而观，雕栏相望焉。闭之，则右刻“山高月小，水落石出”，左刻“清风徐来，水波不兴”，石青糁之。船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。苏、黄共阅一手卷。东坡右手执卷端，左手抚鲁直背。鲁直左手执卷末，右手指卷，如有所语。东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之——珠可历历数也。舟尾横卧一楫。楫左右舟子各一人。居右者椎髻仰面，左手倚一衡木，右手攀右趾，若啸呼状。居左者右手执蒲葵扇，左手抚炉，炉上有壶，其人视端容寂，若听茶声然。其船背稍夷，则题名其上，文曰“天启壬戌秋日，虞山王毅叔远甫刻”，细若蚊足，钩画了了，其色墨。又用篆章一，文曰“初平山人”，其色丹。通计一舟，为人五；为窗八；为箬篷，为楫，为炉，为壶，为手卷，为念珠各一；对联、题名并篆文，为字共三十有四。而计其长曾不盈寸。盖简桃核修狭者为之。嘻，技亦灵怪矣哉！", "hard": "罔 wǎng　贻 yí　黍 shǔ　箬 ruò　糁 shēn　髯 rán　褶 zhě　矫 jiǎo　诎 qū　楫 jí　椎 chuí　髻 jì　夷 yí　篆 zhuàn", "lines": [["明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，", "奇巧人：技艺精巧的人。径寸：直径一寸。", "明朝有个技艺奇妙精巧的人叫王叔远，能用直径一寸的木头，雕刻出宫殿、器具、人物，以至飞鸟、走兽、树木、石头，"], ["罔不因势象形，各具情态。", "罔（wǎng）不：无不。因：顺着。象：模仿。", "无不顺着木头本来的样子雕刻成各种形象，各有各的神情姿态。"], ["尝贻余核舟一，盖大苏泛赤壁云。", "贻（yí）：赠。大苏：苏轼。泛：泛舟。", "他曾经送给我一个用桃核雕成的小船，刻的是苏东坡乘船游赤壁。"], ["舟首尾长约八分有奇，高可二黍许。", "有（yòu）奇（jī）：多一点。黍（shǔ）：古代以黍粒排列计算长度。", "船从头到尾大约长八分多一点，大约有两个黄米粒那么高。"], ["中轩敞者为舱，箬篷覆之。", "轩敞：高起而宽敞。箬（ruò）篷：用箬竹叶做的船篷。", "中间高起而宽敞的部分是船舱，上面用箬竹叶做的船篷覆盖着。"], ["旁开小窗，左右各四，共八扇。启窗而观，雕栏相望焉。", "", "船舱旁边开有小窗，左右各四扇，一共八扇。打开窗户来看，雕刻着花纹的栏杆左右相对。"], ["闭之，则右刻“山高月小，水落石出”，左刻“清风徐来，水波不兴”，石青糁之。", "石青：一种矿物颜料。糁（shēn）：用颜料涂上。", "关上窗户，就看到右边刻着“山高月小，水落石出”，左边刻着“清风徐来，水波不兴”，字上涂着石青。"], ["船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。", "峨冠：高高的帽子。髯（rán）：胡须。鲁直：黄庭坚。", "船头坐着三个人，中间戴着高帽子、胡须浓密的是苏东坡，佛印在右边，黄鲁直在左边。"], ["苏、黄共阅一手卷。东坡右手执卷端，左手抚鲁直背。", "手卷：横幅的书画卷子。", "苏东坡和黄鲁直一起看一幅横幅书画卷子。苏东坡右手拿着卷子的右端，左手轻按在黄鲁直的背上。"], ["鲁直左手执卷末，右手指卷，如有所语。", "", "黄鲁直左手拿着卷子的末端，右手指着卷子，好像在说什么。"], ["东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。", "比：靠近。衣褶（zhě）：衣服的褶皱。", "苏东坡露出右脚，黄鲁直露出左脚，身子都略微侧斜，他们互相靠近的两膝，都被隐蔽在手卷下边的衣褶里。"], ["佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。", "绝类：极像。矫首：抬头。不属（zhǔ）：不相类似。", "佛印极像弥勒菩萨，袒露胸脯，抬头仰望，神情和苏东坡、黄鲁直不相同。"], ["卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之——珠可历历数也。", "诎（qū）：同“屈”，弯曲。历历：清楚分明的样子。", "佛印平放着右膝，弯着右臂支撑在船上，竖着他的左膝，左臂挂着念珠靠在左膝上——念珠清清楚楚地可以数出来。"], ["舟尾横卧一楫。楫左右舟子各一人。", "楫（jí）：船桨。舟子：船夫。", "船尾横放着一支船桨。船桨的左右两边各有一个撑船的人。"], ["居右者椎髻仰面，左手倚一衡木，右手攀右趾，若啸呼状。", "椎（chuí）髻（jì）：椎形的发髻。衡木：横木。", "在右边的人梳着椎形发髻，仰着脸，左手靠着一根横木，右手扳着右脚趾，好像在大声呼喊的样子。"], ["居左者右手执蒲葵扇，左手抚炉，炉上有壶，其人视端容寂，若听茶声然。", "视端容寂：眼睛正视，神色平静。", "在左边的人右手拿着蒲葵扇，左手抚着炉子，炉上有个水壶，那个人眼睛正视着茶炉，神色平静，好像在听茶水烧开了没有。"], ["其船背稍夷，则题名其上，文曰“天启壬戌秋日，虞山王毅叔远甫刻”，", "夷：平。甫：古代对男子的美称。", "船的背面较平，就在上面刻上题名，文字是“天启壬戌秋日，虞山王毅叔远甫刻”，"], ["细若蚊足，钩画了了，其色墨。又用篆章一，文曰“初平山人”，其色丹。", "了了：清楚。篆章：篆体字的图章。丹：红色。", "字迹细小得像蚊子的脚，笔画清清楚楚，颜色是黑的。还刻着一枚篆字图章，文字是“初平山人”，颜色是红的。"], ["通计一舟，为人五；为窗八；为箬篷，为楫，为炉，为壶，为手卷，为念珠各一；", "通计：总计。", "总计一条船上，刻了五个人；刻了八扇窗；刻了箬竹叶做的船篷、船桨、炉子、茶壶、手卷、念珠各一件；"], ["对联、题名并篆文，为字共三十有四。", "有（yòu）：同“又”。", "对联、题名和篆文，刻的字共有三十四个。"], ["而计其长曾不盈寸。盖简桃核修狭者为之。", "曾（céng）不盈寸：还不满一寸。简：挑选。修狭：长而窄。", "可是计算它的长度，竟然还不满一寸。原来是挑选长而窄的桃核刻成的。"], ["嘻，技亦灵怪矣哉！", "灵怪：神奇。", "啊，技艺也真是神奇啊！"]], "tip": "总写（奇巧人）→ 船舱（窗、对联）→ 船头（三人）→ 船尾（两舟子）→ 船背（题名）→ 总计 → 赞叹", "moral": "按空间顺序介绍事物；匠人的精湛技艺来自专注和巧思。"}, {"t": "北冥有鱼", "g": "初中 · 八年级下册", "s": "《庄子·逍遥游》（节选）", "read": "北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。《齐谐》者，志怪者也。《谐》之言曰：“鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。”野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。", "hard": "冥 míng　鲲 kūn　徙 xǐ　抟 tuán　邪 yé", "lines": [["北冥有鱼，其名为鲲。鲲之大，不知其几千里也；", "冥：同“溟”，海。", "北方的大海里有一条鱼，它的名字叫鲲。鲲的巨大，不知道有几千里；"], ["化而为鸟，其名为鹏。鹏之背，不知其几千里也；", "", "变化成为鸟，它的名字叫鹏。鹏的背，不知道有几千里；"], ["怒而飞，其翼若垂天之云。", "怒：奋起的样子。垂天之云：悬挂在天边的云。", "它奋起而飞的时候，翅膀就像挂在天边的云。"], ["是鸟也，海运则将徙于南冥。南冥者，天池也。", "海运：海水运动。徙（xǐ）：迁移。天池：天然形成的大池。", "这只鸟，海水运动的时候就要迁往南方的大海。南方的大海，是一个天然形成的大池。"], ["《齐谐》者，志怪者也。", "志怪：记载怪异的事物。", "《齐谐》是一部记载怪异事物的书。"], ["《谐》之言曰：“鹏之徙于南冥也，水击三千里，", "水击：击水，指拍打水面。", "这本书上记载说：“鹏迁往南方大海的时候，翅膀拍击水面激起三千里的波涛，"], ["抟扶摇而上者九万里，去以六月息者也。”", "抟（tuán）：盘旋。扶摇：旋风。息：气息，指风。", "环绕着旋风飞上了九万里的高空，凭借着六月的风离开了北海。”"], ["野马也，尘埃也，生物之以息相吹也。", "野马：游动的雾气。", "像野马奔腾一样的雾气，飞扬的尘埃，都是由生物的气息吹拂所致。"], ["天之苍苍，其正色邪？其远而无所至极邪？", "苍苍：深蓝色。正色：真正的颜色。", "天色深蓝，难道是它真正的颜色吗？还是因为天空高远而看不到尽头呢？"], ["其视下也，亦若是则已矣。", "其：指鹏。", "鹏从高空往下看，看到的也像这个样子罢了。"]], "tip": "鲲（大鱼）→ 化鹏 → 徙于南冥 →《齐谐》为证 → 天之苍苍（换个角度看世界）", "moral": "要有远大的理想；站得高，眼界就宽。"}, {"t": "庄子与惠子游于濠梁之上", "g": "初中 · 八年级下册", "s": "《庄子·秋水》", "read": "庄子与惠子游于濠梁之上。庄子曰：“鯈鱼出游从容，是鱼之乐也。”惠子曰：“子非鱼，安知鱼之乐？”庄子曰：“子非我，安知我不知鱼之乐？”惠子曰：“我非子，固不知子矣；子固非鱼也，子之不知鱼之乐，全矣。”庄子曰：“请循其本。子曰‘汝安知鱼乐’云者，既已知吾知之而问我。我知之濠上也。”", "hard": "濠 háo　鯈 tiáo", "lines": [["庄子与惠子游于濠梁之上。", "濠梁：濠水上的桥。", "庄子和惠子在濠水的桥上游玩。"], ["庄子曰：“鯈鱼出游从容，是鱼之乐也。”", "鯈（tiáo）鱼：白鲦鱼。从容：悠闲自在。", "庄子说：“白鲦鱼在河水中游得多么悠闲自得，这是鱼的快乐啊。”"], ["惠子曰：“子非鱼，安知鱼之乐？”", "安：怎么。", "惠子说：“你又不是鱼，怎么知道鱼是快乐的呢？”"], ["庄子曰：“子非我，安知我不知鱼之乐？”", "", "庄子说：“你又不是我，怎么知道我不知道鱼是快乐的呢？”"], ["惠子曰：“我非子，固不知子矣；子固非鱼也，子之不知鱼之乐，全矣。”", "固：本来。全：完全，确定无疑。", "惠子说：“我不是你，本来就不了解你；你本来也不是鱼，你不知道鱼的快乐，这是完全可以确定的。”"], ["庄子曰：“请循其本。", "循其本：从最初的话题说起。", "庄子说：“请回到我们最开始的话题。"], ["子曰‘汝安知鱼乐’云者，既已知吾知之而问我。我知之濠上也。”", "云者：如此等等。", "你说‘你怎么知道鱼快乐’这句话，说明你已经知道我知道鱼的快乐才来问我。我是在濠水的桥上知道的。”"]], "tip": "庄子：鱼乐 → 惠子：你不是鱼 → 庄子：你不是我 → 惠子：所以你不知 → 庄子：循其本（濠上知之）", "moral": "看事物的角度不同，感受就不同；庄子重感受，惠子重逻辑。"}, {"t": "虽有嘉肴", "g": "初中 · 八年级下册", "s": "《礼记·学记》", "read": "虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。《兑命》曰“学学半”，其此之谓乎？", "hard": "肴 yáo　旨 zhǐ　长 zhǎng　兑 yuè　学 xiào", "lines": [["虽有嘉肴，弗食，不知其旨也；", "嘉肴（yáo）：美味的菜。旨：味美。", "即使有美味的菜，不吃，就不知道它的味道鲜美；"], ["虽有至道，弗学，不知其善也。", "至道：最好的道理。", "即使有最好的道理，不学，就不知道它的好处。"], ["是故学然后知不足，教然后知困。", "困：困惑。", "所以学习之后才知道自己的不足，教人之后才知道自己有困惑不通的地方。"], ["知不足，然后能自反也；知困，然后能自强也。", "自反：反省自己。自强：自我勉励。", "知道自己的不足，然后才能反省自己；知道自己的困惑，然后才能自我勉励。"], ["故曰：教学相长也。", "教学相长（zhǎng）：教和学互相促进。", "所以说：教和学是互相促进的。"], ["《兑命》曰“学学半”，其此之谓乎？", "《兑（yuè）命》：《尚书》中的一篇。学（xiào）学半：教人是学习的一半。", "《兑命》说：“教人是学习的一半。”大概说的就是这个道理吧？"]], "tip": "类比（嘉肴 → 至道）→ 学知不足、教知困 → 教学相长", "moral": "学习和教别人都是进步；把学会的讲给别人听，学得更好。"}, {"t": "大道之行也", "g": "初中 · 八年级下册", "s": "《礼记·礼运》", "read": "大道之行也，天下为公，选贤与能，讲信修睦。故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭，是谓大同。", "hard": "与 jǔ　长 zhǎng　矜 guān　分 fèn　恶 wù", "lines": [["大道之行也，天下为公，选贤与能，讲信修睦。", "大道：指古代政治上的最高理想。与（jǔ）：同“举”，推举。修睦：培养和睦精神。", "在理想社会实现的时候，天下是人们所共有的，选拔品德高尚、有才能的人，讲求诚信，培养和睦精神。"], ["故人不独亲其亲，不独子其子，", "亲其亲：以其亲为亲，奉养自己的父母。子其子：以其子为子，抚育自己的子女。", "所以人们不只奉养自己的父母，不只抚育自己的子女，"], ["使老有所终，壮有所用，幼有所长，", "", "使老年人能终其天年，壮年人能为社会效力，孩子能健康成长，"], ["矜、寡、孤、独、废疾者皆有所养，男有分，女有归。", "矜（guān）：同“鳏”，老而无妻的人。分（fèn）：职分。归：女子出嫁。", "老而无妻的人、老而无夫的人、幼而无父的人、老而无子的人、残疾人都能得到供养，男子有职业，女子适时而嫁。"], ["货恶其弃于地也，不必藏于己；", "恶（wù）：憎恶。", "对于财物，人们憎恶把它扔在地上，却不一定要自己私藏；"], ["力恶其不出于身也，不必为己。", "", "对于力气，人们憎恶它不从自己身上使出来，却不一定是为了自己。"], ["是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭，是谓大同。", "谋：阴谋。闭：杜绝。兴：发生。外户：泛指大门。大同：指理想社会。", "因此奸邪之谋不会发生，盗窃、造反和害人的事情不会出现，所以家家户户都不用关大门，这叫作理想社会。"]], "tip": "总（天下为公）→ 人人有所养 → 人人出力 → 无盗无贼 → 大同", "moral": "古人理想的社会：人人互相关爱、人尽其才。"}, {"t": "马说", "g": "初中 · 八年级下册", "s": "韩愈", "read": "世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祇辱于奴隶人之手，骈死于槽枥之间，不以千里称也。马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：“天下无马！”呜呼！其真无马邪？其真不知马也。", "hard": "祇 zhǐ　骈 pián　枥 lì　食 sì　石 dàn　见 xiàn　邪 yé", "lines": [["世有伯乐，然后有千里马。千里马常有，而伯乐不常有。", "伯乐：善于相马的人。", "世上有了伯乐，然后才有千里马。千里马经常有，可是伯乐不常有。"], ["故虽有名马，祇辱于奴隶人之手，骈死于槽枥之间，不以千里称也。", "祇（zhǐ）：只是。奴隶人：指仆役。骈（pián）死：一起死。槽枥：喂牲口的食槽。", "所以即使有很名贵的马，也只能在仆役的手里受辱，和普通的马一起死在马厩里，不能以千里马著称。"], ["马之千里者，一食或尽粟一石。", "一食：吃一顿。或：有时。石（dàn）：容量单位。", "能日行千里的马，吃一顿有时能吃完一石粮食。"], ["食马者不知其能千里而食也。", "食（sì）马者：喂马的人。", "喂马的人不懂得要根据它日行千里的本领来喂养它。"], ["是马也，虽有千里之能，食不饱，力不足，才美不外见，", "见（xiàn）：同“现”，表现。", "这样的马，虽然有日行千里的才能，但吃不饱，力气不足，才能和美好的素质不能表现出来，"], ["且欲与常马等不可得，安求其能千里也？", "等：相同。安：怎么。", "想要和普通的马一样尚且办不到，又怎么能要求它日行千里呢？"], ["策之不以其道，食之不能尽其材，鸣之而不能通其意，", "策：鞭打，驱使。以其道：按照正确的方法。材：同“才”，才能。", "驱使它不按正确的方法，喂养它又不足以使它充分发挥才能，它嘶叫却不能明白它的意思，"], ["执策而临之，曰：“天下无马！”", "执策：拿着马鞭。临：面对。", "却拿着鞭子对着它说：“天下没有千里马！”"], ["呜呼！其真无马邪？其真不知马也。", "其：难道。邪（yé）：同“耶”，吗。", "唉！难道真的没有千里马吗？其实是他们真不识得千里马啊！"]], "tip": "伯乐与千里马的关系 → 千里马的遭遇（食不饱）→ 食马者的无知 → 其真不知马", "moral": "人才需要被发现和重用；也要努力让自己成为“千里马”。"}, {"t": "岳阳楼记", "g": "初中 · 九年级上册", "s": "范仲淹", "read": "庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，属予作文以记之。予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空；日星隐曜，山岳潜形；商旅不行，樯倾楫摧；薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。至若春和景明，波澜不惊，上下天光，一碧万顷；沙鸥翔集，锦鳞游泳；岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲；居庙堂之高则忧其民；处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先天下之忧而忧，后天下之乐而乐”乎。噫！微斯人，吾谁与归？时六年九月十五日。", "hard": "谪 zhé　属 zhǔ　浩 hào　汤 shāng　霏 fēi　樯 qiáng　楫 jí　冥 míng　啸 xiào　郁 yù　汀 tīng　璧 bì　噫 yī", "lines": [["庆历四年春，滕子京谪守巴陵郡。", "谪（zhé）守：被贬官出任地方长官。", "庆历四年的春天，滕子京被贬到巴陵郡做太守。"], ["越明年，政通人和，百废具兴。", "越：及，到。具：同“俱”，全，都。", "到了第二年，政事顺利，百姓和乐，各种荒废的事业都兴办起来了。"], ["乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，属予作文以记之。", "制：规模。属（zhǔ）：同“嘱”，嘱托。", "于是重新修建岳阳楼，扩大它原有的规模，把唐代名人和当代人的诗赋刻在上面，嘱托我写一篇文章来记述这件事。"], ["予观夫巴陵胜状，在洞庭一湖。", "胜状：胜景，好景色。", "我看那巴陵郡的美好景色，全在洞庭湖上。"], ["衔远山，吞长江，浩浩汤汤，横无际涯；", "汤（shāng）汤：水流大而急。际涯：边际。", "洞庭湖连接着远处的山，吞吐着长江的水，水势浩大，宽阔无边；"], ["朝晖夕阴，气象万千。此则岳阳楼之大观也，前人之述备矣。", "大观：雄伟景象。备：详尽。", "早晨阳光照耀，傍晚天色昏暗，景象千变万化。这就是岳阳楼的雄伟景象，前人的记述已经很详尽了。"], ["然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？", "南极潇湘：南面直到潇水、湘水。迁客：被贬谪的人。骚人：诗人。得无……乎：恐怕……吧。", "既然这样，那么它北面通向巫峡，南面直到潇水和湘水，被贬的官员和诗人大多在这里聚会，他们观赏自然景物而触发的感情，恐怕会有所不同吧？"], ["若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空；", "若夫：像那。淫雨：连绵不断的雨。霏（fēi）霏：雨雪纷飞的样子。开：放晴。", "像那连绵的阴雨纷纷下个不停，一连几个月都不放晴，阴冷的风怒吼着，浑浊的浪冲向天空；"], ["日星隐曜，山岳潜形；商旅不行，樯倾楫摧；", "曜：光辉。樯（qiáng）：桅杆。楫：船桨。", "太阳和星星隐藏起光辉，山岳隐没了形体；商人和旅客无法通行，桅杆倒下，船桨折断；"], ["薄暮冥冥，虎啸猿啼。", "薄暮：傍晚。冥冥：天色昏暗。", "傍晚时天色昏暗，虎在长啸，猿在悲啼。"], ["登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。", "去国：离开国都。萧然：萧条的样子。", "这时登上这座楼，就会有离开国都、怀念家乡，担心被人说坏话、害怕被人批评指责的心情，满眼都是萧条的景象，感慨到了极点而悲伤起来。"], ["至若春和景明，波澜不惊，上下天光，一碧万顷；", "景：日光。不惊：不起波浪。", "到了春风和煦、阳光明媚的时候，湖面平静，没有波浪，天色湖光相连，一片碧绿，广阔无边；"], ["沙鸥翔集，锦鳞游泳；岸芷汀兰，郁郁青青。", "翔集：时而飞翔，时而停歇。锦鳞：美丽的鱼。芷：香草。汀（tīng）：小洲。郁郁：形容香气浓郁。", "沙鸥时而飞翔，时而停歇，美丽的鱼儿游来游去；岸上的香草和小洲上的兰花，香气浓郁，颜色青翠。"], ["而或长烟一空，皓月千里，浮光跃金，静影沉璧，", "或：有时。一空：全都消散。静影沉璧：静静的月影像沉入水中的玉璧。", "有时湖上的大片烟雾完全消散，皎洁的月光照耀千里，湖水波动时，浮动的月光闪着金光；湖水平静时，明月的倒影像沉在水中的玉璧，"], ["渔歌互答，此乐何极！", "何极：哪有穷尽。", "渔夫的歌声你唱我和，这种乐趣哪有穷尽！"], ["登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。", "宠辱偕忘：荣耀和屈辱一并忘了。把酒：端着酒杯。", "这时登上这座楼，就会有心胸开阔、精神愉快，荣耀和屈辱一并忘了，端着酒杯，吹着微风，那种喜气洋洋的心情了。"], ["嗟夫！予尝求古仁人之心，或异二者之为，何哉？", "古仁人：古代品德高尚的人。或：近于，或许。为：心理活动。", "唉！我曾经探求古代品德高尚的人的思想感情，或许不同于以上两种表现，为什么呢？"], ["不以物喜，不以己悲；", "", "他们不因外物好坏和自己得失而或喜或悲；"], ["居庙堂之高则忧其民；处江湖之远则忧其君。", "庙堂：朝廷。江湖：指偏远的地方。", "在朝廷做官时就为百姓担忧；在偏远的江湖时就为国君担忧。"], ["是进亦忧，退亦忧。然则何时而乐耶？", "进：在朝廷做官。退：不在朝廷做官。", "这样，他们做官也担忧，不做官也担忧。那么什么时候才快乐呢？"], ["其必曰“先天下之忧而忧，后天下之乐而乐”乎。", "", "他们一定会说“在天下人忧虑之前先忧虑，在天下人快乐之后才快乐”吧。"], ["噫！微斯人，吾谁与归？", "微：没有。斯人：这样的人。谁与归：就是“与谁归”，和谁一道呢。", "唉！如果没有这种人，我同谁一道呢？"], ["时六年九月十五日。", "", "写于庆历六年九月十五日。"]], "tip": "作记缘由 → 洞庭大观 → 阴雨之悲 → 晴明之喜 → 古仁人之心（先忧后乐）", "moral": "心中装着别人和国家，不因自己的得失而大喜大悲。"}, {"t": "醉翁亭记", "g": "初中 · 九年级上册", "s": "欧阳修", "read": "环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺，而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。", "hard": "琅琊 láng yá　潺 chán　辄 zhé　霏 fēi　暝 míng　伛偻 yǔ lǚ　洌 liè　肴 yáo　蔌 sù　弈 yì　觥 gōng　翳 yì", "lines": [["环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。", "环：环绕。滁：滁州。壑：山谷。蔚然：草木茂盛的样子。", "环绕着滁州城的都是山。它西南方向的各个山峰，树林和山谷尤其优美，远远望去树木茂盛、幽深秀丽的，是琅琊山。"], ["山行六七里，渐闻水声潺潺，而泻出于两峰之间者，酿泉也。", "潺（chán）潺：流水声。", "沿着山路走六七里，渐渐听到潺潺的流水声，从两座山峰之间倾泻出来的，是酿泉。"], ["峰回路转，有亭翼然临于泉上者，醉翁亭也。", "翼然：像鸟张开翅膀一样。临：靠近。", "山势回环，路也跟着拐弯，有一座亭子四角翘起，像鸟张开翅膀一样，坐落在泉水边上，这就是醉翁亭。"], ["作亭者谁？山之僧智仙也。名之者谁？太守自谓也。", "名：命名。自谓：用自己的号来命名。", "建造亭子的是谁？是山中的和尚智仙。给它命名的是谁？是太守用自己的别号来命名的。"], ["太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。", "辄（zhé）：就。", "太守和宾客来这里喝酒，喝一点就醉了，而且年龄又最大，所以给自己起了个别号叫“醉翁”。"], ["醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。", "寓：寄托。", "醉翁的心思不在喝酒上，而在欣赏山水美景。欣赏山水的乐趣，领会在心里，寄托在酒上。"], ["若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。", "若夫：像那。林霏：树林中的雾气。暝（míng）：昏暗。晦明：昏暗与明亮。", "像那太阳出来，树林里的雾气散了；烟云聚拢，山谷就显得昏暗了；明暗交替变化，这就是山间的早晨和傍晚。"], ["野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。", "芳：花。秀：茂盛。", "野花开放，散发出清幽的香味；好的树木枝繁叶茂，形成一片浓郁的绿荫；天高气爽，霜色洁白；溪水低落，石头露出水面，这就是山中的四季。"], ["朝而往，暮而归，四时之景不同，而乐亦无穷也。", "", "早晨前往，傍晚归来，四季的景色不同，乐趣也是无穷无尽的。"], ["至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。", "负者：背着东西的人。伛偻（yǔ lǚ）：弯腰曲背，指老人。提携：指小孩。", "至于背着东西的人在路上唱歌，走路的人在树下休息，前面的人呼喊，后面的人应答，老老少少，来来往往不断的，是滁州人在游玩。"], ["临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。", "洌（liè）：清。山肴：野味。野蔌（sù）：野菜。陈：摆开。", "到溪边钓鱼，溪水深，鱼儿肥；用酿泉的水酿酒，泉水香，酒也清；野味野菜，横七竖八地摆在面前，这是太守在宴请宾客。"], ["宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。", "酣：尽情地喝酒。丝竹：音乐。射：投壶游戏。弈（yì）：下棋。觥（gōng）：酒杯。筹：酒筹。", "宴会喝酒的乐趣，不在于音乐，投壶的人投中了，下棋的人赢了，酒杯和酒筹交互错杂，时起时坐，大声喧闹的，是宾客们在尽情欢乐。"], ["苍颜白发，颓然乎其间者，太守醉也。", "苍颜：苍老的容颜。颓然：醉醺醺的样子。", "脸色苍老、头发花白，醉醺醺地坐在众人中间的，是太守喝醉了。"], ["已而夕阳在山，人影散乱，太守归而宾客从也。", "已而：不久。", "不久，太阳落山，人影散乱，太守回去，宾客们跟随着。"], ["树林阴翳，鸣声上下，游人去而禽鸟乐也。", "阴翳（yì）：枝叶茂密成荫。", "树林里枝叶茂密成荫，鸟儿到处鸣叫，这是游人离开后鸟儿在欢乐地跳跃。"], ["然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。", "乐其乐：以他们的快乐为快乐。", "然而鸟儿只知道山林的乐趣，却不知道人们的乐趣；人们只知道跟着太守游玩的乐趣，却不知道太守是以他们的快乐为快乐。"], ["醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。", "", "醉了能够和大家一起欢乐，醒来能够用文章记述这乐事的，是太守。太守是谁？是庐陵人欧阳修啊。"]], "tip": "亭（环境、命名）→ 景（朝暮、四时）→ 游（滁人游、太守宴、众宾欢、太守醉）→ 归（禽鸟乐、太守之乐）——全文一个“乐”字", "moral": "与民同乐，从山水中得到快乐。"}, {"t": "湖心亭看雪", "g": "初中 · 九年级上册", "s": "张岱《陶庵梦忆》", "read": "崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余，大喜曰：“湖中焉得更有此人！”拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。及下船，舟子喃喃曰：“莫说相公痴，更有痴似相公者！”", "hard": "更 gēng　拏 ná　毳 cuì　凇 sōng　沆砀 hàng dàng　强 qiǎng　喃 nán", "lines": [["崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。", "崇祯：明思宗的年号。俱绝：都消失了。", "崇祯五年十二月，我住在西湖。大雪接连下了三天，湖中游人和飞鸟的声音都消失了。"], ["是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。", "更（gēng）定：晚上八点左右。拏（ná）：撑船。毳（cuì）衣：毛皮衣服。", "这一天晚上八点左右，我撑着一只小船，穿着毛皮衣服，带着火炉，独自前往湖心亭看雪。"], ["雾凇沆砀，天与云与山与水，上下一白。", "雾凇（sōng）：冰花。沆砀（hàng dàng）：白气弥漫的样子。", "湖上冰花一片弥漫，天与云与山与水，上上下下全是白茫茫的。"], ["湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。", "芥：小草，比喻小。", "湖上的影子，只有一道长堤的痕迹、一点湖心亭的轮廓、和我的一叶小舟，船中的两三粒人影罢了。"], ["到亭上，有两人铺毡对坐，一童子烧酒炉正沸。", "毡：毛毡。", "到了湖心亭上，看见有两个人铺好毡子，相对而坐，一个童子正把酒炉里的酒烧得滚沸。"], ["见余，大喜曰：“湖中焉得更有此人！”拉余同饮。", "焉得：哪能。更：还。", "他们看见我，非常高兴地说：“想不到在湖中还会有您这样的人！”拉着我一同饮酒。"], ["余强饮三大白而别。问其姓氏，是金陵人，客此。", "强（qiǎng）：尽力。大白：大酒杯。客：客居。", "我尽力喝了三大杯酒，然后和他们道别。问他们的姓氏，得知他们是金陵人，在这里客居。"], ["及下船，舟子喃喃曰：“莫说相公痴，更有痴似相公者！”", "舟子：船夫。喃喃：小声嘟囔。相公：对读书人的尊称。痴：痴迷。", "等到下船的时候，船夫嘟囔着说：“不要说相公您痴迷，还有像您一样痴迷的人呢！”"]], "tip": "时间地点 → 看雪（上下一白，痕·点·芥·粒）→ 亭上遇知音 → 舟子说“痴”", "moral": "用“痕、点、芥、粒”写出天地之大、人之小；“痴”是对美的执着。"}, {"t": "鱼我所欲也", "g": "初中 · 九年级下册", "s": "《孟子·告子上》", "read": "鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。非独贤者有是心也，人皆有之，贤者能勿丧耳。一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。万钟则不辩礼义而受之，万钟于我何加焉！为宫室之美、妻妾之奉、所识穷乏者得我与？乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎？此之谓失其本心。", "hard": "辟 bì　箪 dān　蹴 cù　乡 xiàng　与 yú", "lines": [["鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。", "得兼：同时得到。", "鱼是我想要的，熊掌也是我想要的。如果这两样东西不能同时得到，那么我就舍弃鱼而选取熊掌。"], ["生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。", "", "生命是我想要的，道义也是我想要的。如果这两样东西不能同时得到，那么我就舍弃生命而选取道义。"], ["生亦我所欲，所欲有甚于生者，故不为苟得也；", "甚于：超过。苟得：苟且偷生。", "生命是我想要的，但我想要的还有比生命更重要的东西，所以我不做苟且偷生的事；"], ["死亦我所恶，所恶有甚于死者，故患有所不辟也。", "恶（wù）：厌恶。患：祸患。辟（bì）：同“避”，躲避。", "死亡是我厌恶的，但我厌恶的还有比死亡更严重的事，所以有的祸患我不躲避。"], ["如使人之所欲莫甚于生，则凡可以得生者何不用也？", "如使：假如，假使。", "假如人们想要的东西没有比生命更重要的，那么凡是能够用来求得生存的手段，有什么不能用呢？"], ["使人之所恶莫甚于死者，则凡可以辟患者何不为也？", "", "假如人们厌恶的事情没有比死亡更严重的，那么凡是能够用来躲避祸患的手段，有什么不能做呢？"], ["由是则生而有不用也，由是则可以辟患而有不为也。", "由是：通过这种方法。", "采用某种手段就能够活命，可是有的人却不肯采用；采用某种办法就能够躲避祸患，可是有的人也不肯采用。"], ["是故所欲有甚于生者，所恶有甚于死者。", "", "由此可见，他们想要的有比生命更宝贵的东西，他们厌恶的有比死亡更严重的东西。"], ["非独贤者有是心也，人皆有之，贤者能勿丧耳。", "是心：这种心，指羞恶之心。丧：丧失。", "不只是贤德的人有这种本心，人人都有，只不过贤德的人能够不丧失罢了。"], ["一箪食，一豆羹，得之则生，弗得则死。", "箪（dān）：古代盛饭的圆竹器。豆：古代盛食物的器具。", "一碗饭，一碗汤，得到它就能活下去，得不到就会饿死。"], ["呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。", "呼尔：大声吆喝。蹴（cù）尔：用脚踢着。不屑：因轻视而不肯接受。", "如果轻蔑地吆喝着给别人吃，饥饿的路人也不会接受；用脚踢给别人吃，乞丐也不屑于接受。"], ["万钟则不辩礼义而受之，万钟于我何加焉！", "万钟：优厚的俸禄。何加：有什么益处。", "可是优厚的俸禄却有人不分辨是否合乎礼义就接受了，优厚的俸禄对我有什么益处呢！"], ["为宫室之美、妻妾之奉、所识穷乏者得我与？", "奉：侍奉。所识穷乏者：认识的穷困的人。得：同“德”，感激。与（yú）：同“欤”，吗。", "是为了住宅的华丽、妻妾的侍奉和认识的穷困的人感激我吗？"], ["乡为身死而不受，今为宫室之美为之；", "乡（xiàng）：同“向”，从前。", "以前宁肯死也不接受，现在却为了住宅的华丽而接受了；"], ["乡为身死而不受，今为妻妾之奉为之；", "", "以前宁肯死也不接受，现在却为了妻妾的侍奉而接受了；"], ["乡为身死而不受，今为所识穷乏者得我而为之：", "", "以前宁肯死也不接受，现在却为了认识的穷困的人感激自己而接受了："], ["是亦不可以已乎？此之谓失其本心。", "已：停止。本心：天性，指羞恶之心。", "这种做法不是可以停止了吗？这就叫作丧失了人的本性。"]], "tip": "比喻（鱼 vs 熊掌）→ 舍生取义 → 本心人皆有之 → 正面（不食嗟来之食）→ 反面（万钟失本心）", "moral": "在生命和道义之间，要守住做人的根本。"}, {"t": "唐雎不辱使命", "g": "初中 · 九年级下册", "s": "《战国策·魏策四》", "read": "秦王使人谓安陵君曰：“寡人欲以五百里之地易安陵，安陵君其许寡人！”安陵君曰：“大王加惠，以大易小，甚善；虽然，受地于先王，愿终守之，弗敢易！”秦王不说。安陵君因使唐雎使于秦。秦王谓唐雎曰：“寡人以五百里之地易安陵，安陵君不听寡人，何也？且秦灭韩亡魏，而君以五十里之地存者，以君为长者，故不错意也。今吾以十倍之地，请广于君，而君逆寡人者，轻寡人与？”唐雎对曰：“否，非若是也。安陵君受地于先王而守之，虽千里不敢易也，岂直五百里哉？”秦王怫然怒，谓唐雎曰：“公亦尝闻天子之怒乎？”唐雎对曰：“臣未尝闻也。”秦王曰：“天子之怒，伏尸百万，流血千里。”唐雎曰：“大王尝闻布衣之怒乎？”秦王曰：“布衣之怒，亦免冠徒跣，以头抢地耳。”唐雎曰：“此庸夫之怒也，非士之怒也。夫专诸之刺王僚也，彗星袭月；聂政之刺韩傀也，白虹贯日；要离之刺庆忌也，仓鹰击于殿上。此三子者，皆布衣之士也，怀怒未发，休祲降于天，与臣而将四矣。若士必怒，伏尸二人，流血五步，天下缟素，今日是也。”挺剑而起。秦王色挠，长跪而谢之曰：“先生坐！何至于此！寡人谕矣：夫韩、魏灭亡，而安陵以五十里之地存者，徒以有先生也。”", "hard": "雎 jū　说 yuè　怫 fú　缟 gǎo　挠 náo　跣 xiǎn　抢 qiāng　祲 jìn　谕 yù", "lines": [["秦王使人谓安陵君曰：“寡人欲以五百里之地易安陵，安陵君其许寡人！”", "易：交换。其：表示祈使语气。", "秦王派人对安陵君说：“我想用五百里的土地交换安陵，安陵君一定要答应我！”"], ["安陵君曰：“大王加惠，以大易小，甚善；虽然，受地于先王，愿终守之，弗敢易！”", "加惠：给予恩惠。虽然：即使这样。", "安陵君说：“大王给予恩惠，用大的交换小的，很好；即使这样，我从先王那里接受了封地，愿意始终守护它，不敢交换！”"], ["秦王不说。安陵君因使唐雎使于秦。", "说（yuè）：同“悦”。", "秦王不高兴。安陵君因此派唐雎出使到秦国。"], ["秦王谓唐雎曰：“寡人以五百里之地易安陵，安陵君不听寡人，何也？", "", "秦王对唐雎说：“我用五百里的土地交换安陵，安陵君不听从我，为什么呢？"], ["且秦灭韩亡魏，而君以五十里之地存者，以君为长者，故不错意也。", "长者：忠厚的人。错意：在意。错，同“措”。", "况且秦国灭了韩国、亡了魏国，而安陵君却凭借五十里的土地幸存下来，是因为我把安陵君当作忠厚的长者，所以才不打他的主意。"], ["今吾以十倍之地，请广于君，而君逆寡人者，轻寡人与？”", "广：扩充。逆：违背。", "现在我用十倍的土地，请安陵君扩大自己的领土，但是他违背我的意愿，是轻视我吗？”"], ["唐雎对曰：“否，非若是也。安陵君受地于先王而守之，虽千里不敢易也，岂直五百里哉？”", "直：只，仅仅。", "唐雎回答说：“不，不是这样的。安陵君从先王那里接受封地并守护它，即使是一千里的土地也不敢交换，何况仅仅是五百里呢？”"], ["秦王怫然怒，谓唐雎曰：“公亦尝闻天子之怒乎？”唐雎对曰：“臣未尝闻也。”", "怫（fú）然：盛怒的样子。", "秦王勃然大怒，对唐雎说：“您也曾听说过天子发怒吗？”唐雎回答说：“我未曾听说过。”"], ["秦王曰：“天子之怒，伏尸百万，流血千里。”", "", "秦王说：“天子发怒，会使上百万人死亡，血流千里。”"], ["唐雎曰：“大王尝闻布衣之怒乎？”", "布衣：平民。", "唐雎说：“大王曾经听说过平民发怒吗？”"], ["秦王曰：“布衣之怒，亦免冠徒跣，以头抢地耳。”", "免冠：摘掉帽子。徒跣（xiǎn）：光着脚。抢（qiāng）：撞。", "秦王说：“平民发怒，不过是摘掉帽子、光着脚，用头撞地罢了。”"], ["唐雎曰：“此庸夫之怒也，非士之怒也。", "庸夫：平庸无能的人。士：有才能有胆识的人。", "唐雎说：“这是平庸无能的人发怒，不是有才能有胆识的人发怒。"], ["夫专诸之刺王僚也，彗星袭月；聂政之刺韩傀也，白虹贯日；要离之刺庆忌也，仓鹰击于殿上。", "专诸、聂政、要离：古代的刺客。", "专诸刺杀吴王僚的时候，彗星的尾巴扫过月亮；聂政刺杀韩傀的时候，一道白光直冲太阳；要离刺杀庆忌的时候，苍鹰扑击到宫殿上。"], ["此三子者，皆布衣之士也，怀怒未发，休祲降于天，与臣而将四矣。", "休祲（jìn）：吉凶的征兆。", "这三个人都是平民中有胆识的人，心里的愤怒还没发作出来，上天就降下了征兆，加上我，将成为四个人了。"], ["若士必怒，伏尸二人，流血五步，天下缟素，今日是也。”挺剑而起。", "缟（gǎo）素：白色的丧服。", "如果有才能有胆识的人一定要发怒，就要使两个人死亡，血流五步远，天下百姓都要穿白色丧服，今天就是这样了。”说完，拔出剑站了起来。"], ["秦王色挠，长跪而谢之曰：“先生坐！何至于此！寡人谕矣：", "色挠（náo）：面露胆怯之色。长跪：直身而跪。谢：道歉。谕：明白。", "秦王变了脸色，直身跪着向唐雎道歉说：“先生请坐！怎么会到这种地步！我明白了："], ["夫韩、魏灭亡，而安陵以五十里之地存者，徒以有先生也。”", "徒以：只是因为。", "韩国、魏国灭亡，而安陵却凭借五十里的土地幸存下来，只是因为有先生您啊。”"]], "tip": "秦王易地 → 安陵君拒 → 唐雎使秦：驳（岂直五百里）→ 斗（天子之怒 vs 布衣之怒）→ 挺剑而起 → 秦王谢", "moral": "面对强权不卑不亢，有勇有谋才能维护尊严。"}, {"t": "送东阳马生序（节选）", "g": "初中 · 九年级下册", "s": "宋濂", "read": "余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。既加冠，益慕圣贤之道。又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。当余之从师也，负箧曳屣，行深山巨谷中。穷冬烈风，大雪深数尺，足肤皲裂而不知。至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。寓逆旅，主人日再食，无鲜肥滋味之享。同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意。以中有足乐者，不知口体之奉不若人也。盖余之勤且艰若此。", "hard": "嗜 shì　假 jiǎ　逾 yú　叱咄 chì duō　俟 sì　箧 qiè　屣 xǐ　皲 jūn　媵 yìng　衾 qīn　缊 yùn　烨 yè", "lines": [["余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。", "嗜（shì）学：爱好读书。致：得到。假借：借。", "我小时候就爱好读书。家里贫穷，没有办法得到书来看，常常向藏书的人家去借，亲手抄录，计算着日期按时归还。"], ["天大寒，砚冰坚，手指不可屈伸，弗之怠。", "弗之怠：即“弗怠之”，不放松抄书。", "天气特别寒冷，砚台里的墨汁都冻成了硬冰，手指不能弯曲和伸直，也不放松抄书。"], ["录毕，走送之，不敢稍逾约。", "走：跑。逾约：超过约定的期限。", "抄写完毕，就跑着把书送还，不敢稍稍超过约定的期限。"], ["以是人多以书假余，余因得遍观群书。", "以是：因此。", "因此人们大多愿意把书借给我，我也因此能够看到各种各样的书。"], ["既加冠，益慕圣贤之道。又患无硕师名人与游，", "加冠：古代男子二十岁举行冠礼，表示成年。硕师：学问渊博的老师。", "成年以后，我更加仰慕古代圣贤的学说。又担心没有学问渊博的老师和名人可以交往请教，"], ["尝趋百里外，从乡之先达执经叩问。", "趋：快走。先达：有道德学问的前辈。叩问：请教。", "曾经赶到百里以外，向同乡有道德学问的前辈拿着经书请教。"], ["先达德隆望尊，门人弟子填其室，未尝稍降辞色。", "德隆望尊：道德高，声望重。辞色：言辞和脸色。", "那位前辈道德高、声望重，向他求教的学生挤满了屋子，他从来没有把言辞放委婉些，把脸色放温和些。"], ["余立侍左右，援疑质理，俯身倾耳以请；", "援疑质理：提出疑难，询问道理。", "我站着陪侍在他左右，提出疑难，询问道理，弯着身子侧着耳朵请教；"], ["或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；", "叱咄（chì duō）：训斥，呵责。至：周到。", "有时遇到他训斥，我的表情更加恭敬，礼节更加周到，不敢说一句话来回答；"], ["俟其欣悦，则又请焉。故余虽愚，卒获有所闻。", "俟（sì）：等待。卒：终于。", "等到他高兴了，就又去请教。所以我虽然愚笨，但最终还是得到了不少教益。"], ["当余之从师也，负箧曳屣，行深山巨谷中。", "箧（qiè）：书箱。曳屣（xǐ）：拖着鞋子。", "当我外出求师的时候，背着书箱，拖着鞋子，行走在深山大谷之中。"], ["穷冬烈风，大雪深数尺，足肤皲裂而不知。", "穷冬：深冬。皲（jūn）裂：皮肤因寒冷干燥而开裂。", "严冬刮着猛烈的寒风，大雪深达几尺，脚上的皮肤冻裂了都不知道。"], ["至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。", "支：同“肢”。媵（yìng）人：陪嫁的人，这里指女仆。汤：热水。衾（qīn）：被子。", "到了客舍，四肢冻僵了不能动弹，女仆拿来热水给我浇洗，用被子裹着我，很久才暖和过来。"], ["寓逆旅，主人日再食，无鲜肥滋味之享。", "逆旅：旅店。日再食：每天提供两顿饭。", "住在旅店里，旅店主人每天提供两顿饭，没有新鲜的鱼肉等美味可以享受。"], ["同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；", "被：同“披”，穿。绮绣：华丽的丝织衣服。容臭（xiù）：香袋。烨（yè）然：光彩照人的样子。", "同住在客舍的同学都穿着华丽的丝绸衣服，戴着有红缨和珠宝装饰的帽子，腰间挂着白玉环，左边佩着刀，右边挂着香袋，光彩照人，像神仙一样；"], ["余则缊袍敝衣处其间，略无慕艳意。", "缊（yùn）袍：粗旧的袍子。敝衣：破旧的衣服。慕艳：羡慕。", "我却穿着粗旧的袍子、破旧的衣服处在他们中间，毫无羡慕的意思。"], ["以中有足乐者，不知口体之奉不若人也。", "以：因为。口体之奉：指吃的穿的。", "因为心中有足以快乐的事，就不觉得吃的穿的不如别人了。"], ["盖余之勤且艰若此。", "", "我求学的勤奋和艰辛大概就是这样。"]], "tip": "借书抄书（勤）→ 从师求教（诚）→ 求学路上（苦）→ 生活对比（乐在其中）", "moral": "学习要勤奋、要虚心，条件艰苦也能乐在其中。"}, {"t": "曹刿论战", "g": "初中 · 九年级下册", "s": "《左传·庄公十年》", "read": "十年春，齐师伐我。公将战，曹刿请见。其乡人曰：“肉食者谋之，又何间焉？”刿曰：“肉食者鄙，未能远谋。”乃入见。问：“何以战？”公曰：“衣食所安，弗敢专也，必以分人。”对曰：“小惠未遍，民弗从也。”公曰：“牺牲玉帛，弗敢加也，必以信。”对曰：“小信未孚，神弗福也。”公曰：“小大之狱，虽不能察，必以情。”对曰：“忠之属也。可以一战。战则请从。”公与之乘，战于长勺。公将鼓之。刿曰：“未可。”齐人三鼓。刿曰：“可矣。”齐师败绩。公将驰之。刿曰：“未可。”下视其辙，登轼而望之，曰：“可矣。”遂逐齐师。既克，公问其故。对曰：“夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。”", "hard": "刿 guì　间 jiàn　鄙 bǐ　牺 xī　孚 fú　狱 yù　辙 zhé　轼 shì　靡 mǐ", "lines": [["十年春，齐师伐我。公将战，曹刿请见。", "十年：鲁庄公十年。我：指鲁国。公：鲁庄公。", "鲁庄公十年的春天，齐国军队攻打我们鲁国。鲁庄公将要迎战，曹刿请求拜见。"], ["其乡人曰：“肉食者谋之，又何间焉？”", "肉食者：指居高位、享厚禄的人。间（jiàn）：参与。", "他的同乡说：“当权的人自会谋划这件事，你又何必参与呢？”"], ["刿曰：“肉食者鄙，未能远谋。”乃入见。", "鄙：鄙陋，指目光短浅。", "曹刿说：“当权的人目光短浅，不能深谋远虑。”于是入朝去见鲁庄公。"], ["问：“何以战？”", "何以：凭借什么。", "曹刿问：“您凭借什么去作战？”"], ["公曰：“衣食所安，弗敢专也，必以分人。”", "安：养。专：独自享有。", "鲁庄公说：“衣食这类养生的东西，我不敢独自享用，一定会分给别人。”"], ["对曰：“小惠未遍，民弗从也。”", "遍：遍及。", "曹刿回答说：“这种小恩惠不能遍及百姓，百姓是不会听从您的。”"], ["公曰：“牺牲玉帛，弗敢加也，必以信。”", "牺牲：祭祀用的猪、牛、羊等。加：虚夸。信：诚实。", "鲁庄公说：“祭祀用的牲畜、玉器和丝织品，我不敢虚报夸大，一定对神诚实。”"], ["对曰：“小信未孚，神弗福也。”", "孚（fú）：为人所信服。福：赐福，保佑。", "曹刿回答说：“小小的诚实不能使神信服，神是不会保佑您的。”"], ["公曰：“小大之狱，虽不能察，必以情。”", "狱：案件。察：明察。情：实情。", "鲁庄公说：“大大小小的案件，即使不能一一明察，但一定根据实情合理裁决。”"], ["对曰：“忠之属也。可以一战。战则请从。”", "忠之属：尽了本职一类的事。", "曹刿回答说：“这是尽了本职的一类事，可以凭借这个条件打一仗。如果作战，请允许我跟随您一同去。”"], ["公与之乘，战于长勺。公将鼓之。刿曰：“未可。”", "鼓：击鼓进军。", "鲁庄公和他共乘一辆战车，在长勺和齐军作战。鲁庄公将要击鼓进军，曹刿说：“不行。”"], ["齐人三鼓。刿曰：“可矣。”齐师败绩。", "败绩：大败。", "齐军三次击鼓之后，曹刿说：“可以击鼓进军了。”齐军大败。"], ["公将驰之。刿曰：“未可。”下视其辙，登轼而望之，曰：“可矣。”遂逐齐师。", "驰：驱车追赶。辙：车轮碾出的痕迹。轼：车前横木。", "鲁庄公又要驱车追击齐军。曹刿说：“还不行。”他下车看了齐军车轮碾出的痕迹，又登上战车，扶着车前横木远望齐军的队形，说：“可以追击了。”于是追击齐军。"], ["既克，公问其故。", "既：已经。克：战胜。", "战胜齐军以后，鲁庄公问他取胜的原因。"], ["对曰：“夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。", "作：振作。再：第二次。竭：尽。盈：充满。", "曹刿回答说：“作战，靠的是勇气。第一次击鼓能够振作士兵们的勇气，第二次击鼓士兵们的勇气就开始衰退，第三次击鼓士兵们的勇气就耗尽了。他们的勇气已经耗尽，而我们的勇气正旺盛，所以才战胜了他们。"], ["夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。”", "伏：埋伏。靡（mǐ）：倒下。", "像齐国这样的大国，他们的情况是难以推测的，怕他们设下埋伏。我看到他们的车轮痕迹混乱，望见他们的旗子倒下了，所以才追击他们。”"]], "tip": "战前（请见、论战：小惠、小信、忠之属）→ 战中（鼓、驰的时机）→ 战后（一鼓作气、辙乱旗靡）", "moral": "得民心是取胜的根本；做事要把握时机、谨慎判断。"}, {"t": "邹忌讽齐王纳谏", "g": "初中 · 九年级下册", "s": "《战国策·齐策一》", "read": "邹忌修八尺有余，而形貌昳丽。朝服衣冠，窥镜，谓其妻曰：“我孰与城北徐公美？”其妻曰：“君美甚，徐公何能及君也！”城北徐公，齐国之美丽者也。忌不自信，而复问其妾曰：“吾孰与徐公美？”妾曰：“徐公何能及君也！”旦日，客从外来，与坐谈，问之客曰：“吾与徐公孰美？”客曰：“徐公不若君之美也。”明日徐公来，孰视之，自以为不如；窥镜而自视，又弗如远甚。暮寝而思之，曰：“吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。”于是入朝见威王，曰：“臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。”王曰：“善。”乃下令：“群臣吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤讥于市朝，闻寡人之耳者，受下赏。”令初下，群臣进谏，门庭若市；数月之后，时时而间进；期年之后，虽欲言，无可进者。燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。", "hard": "讽 fěng　昳 yì　朝 zhāo　孰 shú　间 jiàn　期 jī", "lines": [["邹忌修八尺有余，而形貌昳丽。", "修：长，这里指身高。昳（yì）丽：光艳美丽。", "邹忌身高八尺多，而且体形容貌光艳美丽。"], ["朝服衣冠，窥镜，谓其妻曰：“我孰与城北徐公美？”", "朝（zhāo）：早晨。服：穿戴。窥镜：照镜子。孰与：与……相比怎么样。", "早晨穿戴好衣帽，照着镜子，对他的妻子说：“我和城北的徐公相比，谁更美？”"], ["其妻曰：“君美甚，徐公何能及君也！”", "", "他的妻子说：“您美极了，徐公哪里比得上您呢！”"], ["城北徐公，齐国之美丽者也。忌不自信，而复问其妾曰：“吾孰与徐公美？”", "", "城北的徐公，是齐国的美男子。邹忌不相信自己比徐公美，就又问他的妾说：“我和徐公相比，谁更美？”"], ["妾曰：“徐公何能及君也！”", "", "妾说：“徐公哪里比得上您呢！”"], ["旦日，客从外来，与坐谈，问之客曰：“吾与徐公孰美？”", "旦日：第二天。", "第二天，有位客人从外面来拜访，邹忌和他坐着谈话，问客人说：“我和徐公相比，谁更美？”"], ["客曰：“徐公不若君之美也。”", "", "客人说：“徐公不如您美。”"], ["明日徐公来，孰视之，自以为不如；窥镜而自视，又弗如远甚。", "孰视：仔细地看。孰，同“熟”。", "又过了一天，徐公来了，邹忌仔细地端详他，自认为不如他美；照着镜子看看自己，又觉得自己远远比不上徐公。"], ["暮寝而思之，曰：“吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。”", "美我：认为我美。私：偏爱。", "晚上躺在床上想这件事，说：“我的妻子认为我美，是偏爱我；我的妾认为我美，是害怕我；客人认为我美，是想要有求于我。”"], ["于是入朝见威王，曰：“臣诚知不如徐公美。", "诚：确实。", "于是邹忌上朝拜见齐威王，说：“我确实知道自己不如徐公美。"], ["臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。", "", "我的妻子偏爱我，我的妾害怕我，我的客人想要有求于我，他们都认为我比徐公美。"], ["今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。”", "地方：土地方圆。蔽：受蒙蔽。", "如今齐国的土地方圆千里，有一百二十座城池，宫中的姬妾和身边的近臣没有不偏爱大王的，朝中的大臣没有不害怕大王的，全国范围内的人没有不有求于大王的：由此看来，大王受蒙蔽很严重了。”"], ["王曰：“善。”乃下令：", "", "齐威王说：“好。”于是下了命令："], ["“群臣吏民能面刺寡人之过者，受上赏；", "面刺：当面指责。", "“所有的大臣、官吏、百姓，能够当面指责我的过错的，得上等奖赏；"], ["上书谏寡人者，受中赏；", "谏：规劝。", "上书规劝我的，得中等奖赏；"], ["能谤讥于市朝，闻寡人之耳者，受下赏。”", "谤讥：议论、指责。市朝：公共场所。", "能够在公共场所议论我的过失，传到我耳朵里的，得下等奖赏。”"], ["令初下，群臣进谏，门庭若市；", "门庭若市：门前和院子里人很多，像集市一样。", "命令刚下达，许多大臣都来进言规劝，宫门前和院子里像集市一样热闹；"], ["数月之后，时时而间进；", "时时：不时地。间（jiàn）进：偶然有人进谏。", "几个月以后，不时地偶尔有人进谏；"], ["期年之后，虽欲言，无可进者。", "期（jī）年：满一年。", "满一年以后，即使有人想进言，也没有什么可说的了。"], ["燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。", "朝：朝见。战胜于朝廷：在朝廷上战胜别国。", "燕、赵、韩、魏等国听说了这件事，都到齐国来朝见。这就是人们所说的在朝廷上战胜别国。"]], "tip": "比美（妻、妾、客都说我美）→ 悟（私、畏、有求）→ 讽谏（王之蔽甚）→ 纳谏（三赏）→ 效果（门庭若市 → 战胜于朝廷）", "moral": "要能听得进真话；劝别人时讲究方法，以小见大。"}, {"t": "出师表", "g": "初中 · 九年级下册", "s": "诸葛亮", "read": "先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。宫中府中，俱为一体；陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理；不宜偏私，使内外异法也。侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。先帝知臣谨慎，故临崩寄臣以大事也。受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。至于斟酌损益，进尽忠言，则攸之、祎、允之任也。愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。若无兴德之言，则责攸之、祎、允等之慢，以彰其咎；陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏。臣不胜受恩感激。今当远离，临表涕零，不知所言。", "hard": "崩殂 bēng cú　陟 zhì　臧 zāng　裨 bì　祎 yī　行 háng　长 zhǎng　猥 wěi　驽 nú　攘 rǎng　诹 zōu　涕 tì", "lines": [["先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。", "先帝：刘备。崩殂（cú）：死。疲弊：困苦穷乏。诚：确实。秋：时候。", "先帝开创的大业还没有完成一半就中途去世了。现在天下分为三国，我们蜀汉人力疲惫、物力困乏，这确实是关系到国家生死存亡的危急时刻啊。"], ["然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。", "殊遇：特殊的待遇。", "然而侍卫大臣们在宫廷里毫不懈怠，忠诚有志的将士们在外面奋不顾身，是因为追念先帝对他们的特殊恩遇，想要报答给陛下您啊。"], ["诚宜开张圣听，以光先帝遗德，恢弘志士之气，", "开张圣听：广泛听取意见。恢弘：发扬扩大。", "陛下确实应该广泛听取意见，来发扬光大先帝遗留下来的美德，振奋有远大志向的人的志气，"], ["不宜妄自菲薄，引喻失义，以塞忠谏之路也。", "妄自菲薄：过分地看轻自己。引喻失义：说话不恰当。", "不应当随便看轻自己，说出不恰当的话，以致堵塞了忠臣进谏劝告的道路。"], ["宫中府中，俱为一体；陟罚臧否，不宜异同。", "宫中：皇宫中。府中：丞相府中。陟（zhì）：提升。臧否（zāng pǐ）：善恶，这里用作动词，评论好坏。", "皇宫中和朝廷里的人，都是一个整体；奖惩功过、评论好坏，不应该有所不同。"], ["若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理；", "作奸犯科：做奸邪的事情，触犯法令。有司：主管某种事务的官员。", "如果有做奸邪事情、犯了法令和尽忠行善的人，应当交给主管的官员判定他们受罚或者受赏，来显示陛下公正严明的治理；"], ["不宜偏私，使内外异法也。", "", "不应当有偏袒和私心，使宫内和朝廷的赏罚标准不同。"], ["侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，", "良实：善良诚实。", "侍中、侍郎郭攸之、费祎、董允等人，这些都是善良诚实的人，他们的志向和心思忠诚无二，"], ["是以先帝简拔以遗陛下。", "简拔：选拔。遗（wèi）：给予。", "因此先帝选拔他们留给陛下。"], ["愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。", "悉：全，都。咨：询问。裨（bì）补阙漏：弥补缺点和疏漏。", "我认为宫中的事情，无论大小，都拿来征询他们的意见，然后再去实施，一定能够弥补缺点和疏漏之处，得到更多的好处。"], ["将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。", "性行淑均：性情品德善良平正。督：中部督，统率禁卫军的将领。", "将军向宠，性情品德善良平正，精通军事，从前任用时，先帝称赞他能干，因此大家商议推举他做中部督。"], ["愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。", "行（háng）阵：指军队。", "我认为军营中的事情，都拿来征询他的意见，一定能够使军队团结和睦，好的差的各得其所。"], ["亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。", "先汉：西汉。后汉：东汉。倾颓：衰败。", "亲近贤臣，疏远小人，这是西汉兴盛的原因；亲近小人，疏远贤臣，这是东汉衰败的原因。"], ["先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。", "桓、灵：东汉末年的桓帝和灵帝。痛恨：痛心遗憾。", "先帝在世的时候，每次和我谈论这些事情，没有一次不对桓帝、灵帝感到叹息痛心遗憾的。"], ["侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。", "贞良死节：坚贞可靠，能够以死报国。", "侍中、尚书、长史、参军，这些都是坚贞可靠、能够以死报国的忠臣，希望陛下亲近他们、信任他们，那么汉朝的复兴，就指日可待了。"], ["臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。", "布衣：平民。躬耕：亲自耕种。闻达：有名望，显贵。", "我本来是平民，在南阳亲自耕田，在乱世中只求苟且保全性命，不奢求在诸侯之中出名显贵。"], ["先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，", "卑鄙：身份低微，见识短浅。猥（wěi）：辱，降低身份。枉屈：屈尊就卑。", "先帝不因为我身份卑微、见识短浅，降低身份、委屈自己，三次到草庐来拜访我，向我征询对当今天下大事的意见，"], ["由是感激，遂许先帝以驱驰。", "感激：感动激发。驱驰：奔走效劳。", "我因此十分感动，就答应为先帝奔走效劳。"], ["后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。", "倾覆：指兵败。尔来：从那时以来。", "后来遇到兵败，我在兵败的时候接受了任务，在危难的时候奉行使命，从那时以来已经二十一年了。"], ["先帝知臣谨慎，故临崩寄臣以大事也。", "大事：指辅佐刘禅、复兴汉室。", "先帝知道我做事谨慎，所以临终前把复兴汉室的大事托付给我。"], ["受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，", "夙（sù）夜：早晚。", "接受遗命以来，我早晚忧虑叹息，唯恐先帝托付给我的大任不能完成，从而损害先帝的知人之明，"], ["故五月渡泸，深入不毛。", "泸：泸水。不毛：不长草木的地方，指荒凉的地方。", "所以我五月率兵渡过泸水，深入到人烟稀少的荒凉地区。"], ["今南方已定，兵甲已足，当奖率三军，北定中原，", "", "现在南方已经平定，兵器装备也已充足，应当激励、率领全军将士，向北平定中原，"], ["庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。", "庶：希望。驽（nú）钝：比喻才能平庸。攘（rǎng）除：排除，铲除。", "希望竭尽我平庸的才能，铲除奸邪凶恶的敌人，复兴汉室，迁回旧日的国都。"], ["此臣所以报先帝而忠陛下之职分也。", "", "这就是我用来报答先帝、并且效忠陛下的职责本分。"], ["至于斟酌损益，进尽忠言，则攸之、祎、允之任也。", "斟酌损益：考虑事情的利弊得失。", "至于处理事务，斟酌情理，有所兴革，毫无保留地进献忠言，那是郭攸之、费祎、董允等人的责任。"], ["愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。", "效：任务。", "希望陛下把讨伐曹魏、兴复汉室的任务交给我，如果没有成效，就惩治我的罪过，来告慰先帝的在天之灵。"], ["若无兴德之言，则责攸之、祎、允等之慢，以彰其咎；", "慢：怠慢，疏忽。彰：显扬。咎：过失。", "如果没有发扬圣德的忠言，就责备郭攸之、费祎、董允等人的怠慢，来揭示他们的过失；"], ["陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏。", "咨诹（zōu）：询问。雅言：正确的言论。", "陛下也应自行谋划，征询治国的好方法，采纳正确的言论，深切追念先帝临终留下的教诲。"], ["臣不胜受恩感激。", "不胜：禁不住。", "我禁不住感激涕零。"], ["今当远离，临表涕零，不知所言。", "临：面对。涕零：落泪。", "今天我即将远离陛下，面对这份奏表禁不住流下眼泪，不知道自己说了些什么。"]], "tip": "形势（危急存亡）→ 三条建议（开张圣听、严明赏罚、亲贤远佞）→ 自述经历（三顾、受命）→ 北伐决心 → }

  hwfri: '周六日课的作业', erecite: '背诵英语短文 1 篇', bedread: '阅读 20 分钟', sport: '户外 / 篮球', ewrite: '英文小作文 3～5 句', dict: '拼写听写', goodsent: '好句积累：抄 2 句、仿写 1 句'};

   周五：先做周六日课的作业，再背单词，其余不排；[任务, 做完后休息分钟] */

/* 把任务依次排进 [from, to)，避开上课时间；课前空档先塞放得下的短任务；连续学满 30 分钟休息 10 分钟，下课后先歇 10 分钟 */
function pack(ids, from, to, blocks) {
  const out = [], rests = [], q = ids.slice(); let t = from, run = 0;
  while (q.length) {
    const nb = blocks.find(b => b.e > t), gapEnd = nb ? Math.min(nb.s, to) : to;
    if (nb && nb.s <= t) { t = nb.e + 10; run = 0; continue; }   // 正在上课
    if (q[0] === 'homework') {   // 下课第一项先写校内作业；写到一半要上课就分两段，下课接着写
      const parts = []; let remain = DUR.homework;
      while (remain > 0) {
        const b = blocks.find(b => b.e > t), ge = b ? Math.min(b.s, to) : to;
        if (b && b.s <= t) { t = b.e + 10; continue; }
        const use = Math.min(remain, ge - t);
        if (use >= Math.min(15, remain)) { parts.push([t, t + use]); t += use; remain -= use; }
        else if (!b || b.s >= to) return null; else t = b.e + 10;
      }
      q.shift(); out.push({id: 'homework', s: parts[0][0], e: t, parts}); run = 30;
      if (q.length) { rests.push({s: t, d: 10}); t += 10; run = 0; }
      continue;
    }
    const k = q.findIndex(id => t + DUR[id] <= gapEnd);
    if (k < 0) { if (!nb || nb.s >= to) return null; t = nb.e + 10; run = 0; continue; }
    const id = q.splice(k, 1)[0], d = DUR[id];
    out.push({id, s: t, e: t + d}); t += d; run += d;
    if (run >= 30 && q.length) {
      const r = Math.min(10, (blocks.find(b => b.s >= t) || {s: 9999}).s - t);
      if (r >= 5) rests.push({s: t, d: r});
      t += 10; run = 0;
    }
  }
  return {out, rests};
}

function seqEvening(seq, from, to, blocks) {
  const out = [], rests = []; let t = from;
  for (let n = 0; n < seq.length; n++) {

function b64decodeUtf8(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const bin = atob(s), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function applySetupCode(text) {
  const m = String(text || '').trim().match(/setup=([A-Za-z0-9_\-]+)/);
  if (!m) return false;
  try {
    const cfg = JSON.parse(b64decodeUtf8(m[1]));
    if (!cfg.weekday && !cfg.sched && !cfg.listenLinks) return false;
    if (cfg.listenLinks) {
      const have = new Set(listenLinks().map(l => l.url));
      cfg.listenLinks.forEach(l => { if (!have.has(l.url)) { listenLinks().push(l); have.add(l.url); } });
      delete cfg.listenLinks; save();
    }
    if (cfg.weekday || cfg.sched) { CFG = cfg; lsSet(LS_CFG, cfg); ensureRewards(); }
    return true;
  } catch (e) { return false; }
}
function applySetupFromHash() {
  if (!/^#setup=/.test(location.hash)) return false;
  const ok = applySetupCode(location.hash);
  history.replaceState(null, '', location.pathname);
  if (!ok) alert('设置链接不完整，请重新复制');
  return ok;
}

/* ---------- 课表自动同步：网站上的 sched.enc 是用设置链接里的密钥加密的课表，只有本机能解开 ---------- */
/* ---------- 云同步（11/23 家长选方案 B）：打卡记录加密后存到孩子专用 GitHub 账号的私密 Gist，几台设备共用一份，换设备/重装不丢 ---------- */
async function aesKey() { const raw = Uint8Array.from(atob(CFG.k.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)); return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']); }
const b64e = u8 => { let s = ''; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function encJSON(o) { const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await aesKey(), new TextEncoder().encode(JSON.stringify(o)))); const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12); return b64e(all); }
async function decJSON(s) { const b = b64d(s.trim()); return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, await aesKey(), b.slice(12)))); }
function mergeData(a, b) {   // 两份打卡记录合并：都有的保留，冲突时以后保存的那份为准；被删掉（有删除记号）的不复活
  const newer = (a.savedAt || '') >= (b.savedAt || '') ? a : b;
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const deep = (x, y, nx) => { const o = {}; new Set([...Object.keys(x || {}), ...Object.keys(y || {})]).forEach(k => {
    const vx = x ? x[k] : undefined, vy = y ? y[k] : undefined;
    if (vx === undefined) o[k] = vy; else if (vy === undefined) o[k] = vx;
    else if (isObj(vx) && isObj(vy)) o[k] = deep(vx, vy, nx);
    else if (Array.isArray(vx) && Array.isArray(vy) && k === 'redeem') o[k] = [...vx, ...vy.filter(r => !vx.some(q => JSON.stringify(q) === JSON.stringify(r)))];
    else o[k] = nx === 'a' ? vx : vy; }); return o; };
  const m = deep(a, b, newer === a ? 'a' : 'b');
  const tombs = {...(b.tomb || {})}; Object.entries(a.tomb || {}).forEach(([p, t]) => { tombs[p] = Math.max(t, tombs[p] || 0); });
  const cut = Date.now() - 60 * 864e5;
  Object.entries(tombs).forEach(([p, t]) => {
    if (t < cut) { delete tombs[p]; return; }
    const ks = p.split('/'), get = o => ks.reduce((v, k) => v && v[k], o);
    const keep = [a, b].some(side => get(side) !== undefined && (side.savedAt ? Date.parse(side.savedAt) : 0) > t);
    if (!keep) { const par = ks.slice(0, -1).reduce((v, k) => v && v[k], m); if (par) delete par[ks[ks.length - 1]]; }
  });
  m.tomb = tombs; m.savedAt = newer.savedAt; return m;
}
let cloudTimer = null, cloudBusy = false, cloudLast = '';
function cloudSoon() { if (!CFG || !CFG.gt || !CFG.gid) return; clearTimeout(cloudTimer); cloudTimer = setTimeout(() => cloudSync(), 3000); }
async function cloudSync() {   // 拉下网上那份 → 合并 → 有变化就推上去；返回 true 表示本机数据变了（需要刷新页面）
  if (!CFG || !CFG.gt || !CFG.gid || cloudBusy || !(window.crypto && crypto.subtle)) return false;
  cloudBusy = true; const H = {Authorization: 'token ' + CFG.gt, Accept: 'application/vnd.github+json'};
  try {
    const r = await fetch('https://api.github.com/gists/' + CFG.gid + '?t=' + Date.now(), {headers: H, cache: 'no-store'});
    if (!r.ok) throw new Error('get ' + r.status);
    const f = (await r.json()).files['study_data.enc'], remote = f && f.content && f.content.length > 20 ? await decJSON(f.content) : null;
    const before = JSON.stringify(DATA), merged = remote ? mergeData(DATA, remote) : DATA;
    const changedLocal = JSON.stringify(merged) !== before;
    if (changedLocal) { DATA = merged; save.quiet = true; lsSet(LS_DATA, DATA); save.quiet = false; }
    const mine = JSON.stringify(DATA);

      const w = await fetch('https://api.github.com/gists/' + CFG.gid, {method: 'PATCH', headers: {...H, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});

/* 解开用设置链接里的密钥加密的文件（课表、语文一课一贴） */
async function decryptEnc(name) {
  if (!CFG || !CFG.k || !(window.crypto && crypto.subtle)) throw new Error('nokey');
  const r = await fetch(name + '?t=' + Date.now(), {cache: 'no-store'}); if (!r.ok) throw new Error('http ' + r.status);
  const buf = new Uint8Array(await r.arrayBuffer());
  const raw = Uint8Array.from(atob(CFG.k.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: buf.slice(0, 12)}, key, buf.slice(12))));
}
async function syncSchedule() {
  if (!CFG || !CFG.k || !(window.crypto && crypto.subtle)) return false;
  try {
    const r = await fetch('sched.enc?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) return false;
    const buf = new Uint8Array(await r.arrayBuffer());
    const raw = Uint8Array.from(atob(CFG.k.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: buf.slice(0, 12)}, key, buf.slice(12));
    const o = JSON.parse(new TextDecoder().decode(plain));
    if (!o.sched || (CFG.synced && o.synced <= CFG.synced)) return false;
    CFG.sched = o.sched; CFG.synced = o.synced; if (o.vac) CFG.vac = o.vac; if (o.start) CFG.start_date = o.start;
    lsSet(LS_CFG, CFG); return true;
  } catch (e) { return false; }
}

  const items = [...ketW, ...petW].filter((w, i, a) => a.findIndex(x => x.w === w.w) === i).slice(0, 25).map(w => ({w: w.w, ipa: w.ipa, zh: w.zh}));

  const text = exportBackup(), name = '学习打卡备份_' + todayIso() + '.json';
  try {
    const f = new File([text], name, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f], title: name}); markBackup(); toast('备份已发出 ✅'); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return true; }
  return false;
}
